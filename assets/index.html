<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Fiscalização</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    padding: 10px;
}

h2 {
    text-align: center;
}

.box, .item {
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

input {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.titulo {
    font-weight: bold;
    margin-bottom: 6px;
}

.linha {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
}

button {
    border: none;
    border-radius: 6px;
    font-size: 15px;
    color: #fff;
    padding: 6px 10px;
}

.add { background: #007bff; }
.menos { background: #dc3545; }

.contador {
    min-width: 22px;
    text-align: center;
    font-weight: bold;
}

.whats {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #25d366;
    margin-top: 10px;
}

.encerrar {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #6c757d;
    margin-top: 10px;
}
</style>
</head>

<body>

<h2>Controle de Fiscalização</h2>

<div class="box">
    <input id="encarregado" placeholder="Nome do Encarregado">
    <input id="motorista" placeholder="Nome do Motorista">
    <input id="auxiliar" placeholder="Nome do Auxiliar">
</div>

<div id="lista"></div>

<button class="whats" onclick="enviarWhats()">Enviar para WhatsApp</button>
<button class="encerrar" onclick="encerrarTurno()">Encerrar Turno</button>

<script>
// ================= ITENS =================
const itensFixos = [
    "AP fiscalizado","CA fiscalizado","OA fiscalizado","MO fiscalizado",
    "BOATRv","BOPM","Liberação ARD",
    "AI AP","AI CA","AI OA","AI MO",
    "CRLV Recolhido AP","CRLV Recolhido CA","CRLV Recolhido OA","CRLV Recolhido MO",
    "CNH Recolhido AP","CNH Recolhido CA","CNH Recolhido OA","CNH Recolhido MO",
    "Busca Pessoal","Informações","SOS","AI RTPP"
];

const lista = document.getElementById("lista");
let itens = [];

// fixos
itensFixos.forEach((n,i)=>itens.push({id:"f"+i,nome:n,edit:false}));
// 20 livres
for(let i=1;i<=20;i++) itens.push({id:"l"+i,nome:"",edit:true});

// ================= RENDER =================
itens.forEach(it=>{
    lista.innerHTML += `
    <div class="item">
        ${it.edit
            ? `<input id="nome_${it.id}" placeholder="Escreva o artigo">`
            : `<div class="titulo">${it.nome}</div>`}

        ${linha("Encarregado","e",it.id)}
        ${linha("Motorista","m",it.id)}
        ${linha("Auxiliar","a",it.id)}
    </div>`;
});

function linha(t,p,id){
    return `
    <div class="linha">
        <span>${t}</span>
        <div class="ctrl">
            <button class="menos" onclick="alterar('${p}${id}',-1)">-</button>
            <span id="${p}${id}" class="contador">0</span>
            <button class="add" onclick="alterar('${p}${id}',1)">+</button>
        </div>
    </div>`;
}

// ================= SALVAR =================
function salvar(){
    const d={enc:encarregado.value,mot:motorista.value,aux:auxiliar.value,n:{},c:{}};
    itens.forEach(it=>{
        if(it.edit) d.n[it.id]=document.getElementById("nome_"+it.id).value;
        ["e","m","a"].forEach(p=>{
            d.c[p+it.id]=document.getElementById(p+it.id).innerText;
        });
    });
    localStorage.setItem("controleFiscalizacao",JSON.stringify(d));
}

function carregar(){
    const d=JSON.parse(localStorage.getItem("controleFiscalizacao"));
    if(!d) return;
    encarregado.value=d.enc;
    motorista.value=d.mot;
    auxiliar.value=d.aux;

    for(let k in d.n){
        let e=document.getElementById("nome_"+k);
        if(e)e.value=d.n[k];
    }
    for(let k in d.c){
        let e=document.getElementById(k);
        if(e)e.innerText=d.c[k];
    }
}

function alterar(id,v){
    const el=document.getElementById(id);
    let n=parseInt(el.innerText)+v;
    if(n<0)n=0;
    el.innerText=n;
    salvar();
}

["encarregado","motorista","auxiliar"].forEach(i=>{
    document.getElementById(i).addEventListener("input",salvar);
});

window.onload=carregar;

// ================= WHATSAPP =================
function enviarWhats(){
    let texto=`📋 *Fiscalização*\n\n`;
    texto+=`👷 Encarregado: *${encarregado.value||"-"}*\n`;
    texto+=`🚚 Motorista: *${motorista.value||"-"}*\n`;
    texto+=`👥 Auxiliar: *${auxiliar.value||"-"}*\n\n`;

    let temAlgo=false;

    itens.forEach(it=>{
        let nome=it.edit ? document.getElementById("nome_"+it.id).value : it.nome;
        if(!nome) return;

        let e=+document.getElementById("e"+it.id).innerText;
        let m=+document.getElementById("m"+it.id).innerText;
        let a=+document.getElementById("a"+it.id).innerText;

        if(e+m+a===0) return;

        temAlgo=true;
        texto+=`*${nome}*\n`;
        if(e>0) texto+=`- Encarregado: ${e}\n`;
        if(m>0) texto+=`- Motorista: ${m}\n`;
        if(a>0) texto+=`- Auxiliar: ${a}\n`;
        texto+="\n";
    });

    if(!temAlgo){
        alert("Nenhum registro para enviar.");
        return;
    }

    window.open("https://wa.me/?text="+encodeURIComponent(texto),"_blank");
}

// ================= ENCERRAR TURNO =================
function encerrarTurno(){
    if(!confirm("Encerrar turno e zerar todos os dados?")) return;
    localStorage.removeItem("controleFiscalizacao");
    location.reload();
}

// ================= PWA =================
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
