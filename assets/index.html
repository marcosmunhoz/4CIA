<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sistema de Fiscalização por Viatura</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent;
}
body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
    min-height: 100vh;
    padding: 15px;
    overflow-x: hidden;
}

.container { 
    max-width: 100%;
    margin: 0 auto; 
    background: white; 
    border-radius: 15px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
    overflow: hidden;
    height: calc(100vh - 30px);
    display: flex;
    flex-direction: column;
}

/* Tela de seleção de viatura */
.viatura-selection { 
    padding: 25px 20px; 
    text-align: center; 
    flex: 1;
    overflow-y: auto;
}
.viatura-selection h1 { 
    color: #2c3e50; 
    margin-bottom: 20px; 
    font-size: 22px;
    font-weight: 700;
}

.viaturas-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
    gap: 12px; 
    margin: 20px 0;
}

.viatura-card { 
    background: #f8f9fa; 
    border-radius: 10px; 
    padding: 18px 12px; 
    cursor: pointer; 
    transition: all 0.3s ease; 
    border: 2px solid transparent; 
    text-align: center;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 140px;
}
.viatura-card:hover { 
    transform: translateY(-3px); 
    box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
    border-color: #3498db; 
}
.viatura-card.ativa { 
    border-color: #2ecc71; 
    background: linear-gradient(135deg, #f8f9fa 0%, #e8f4fc 100%); 
}

.viatura-icon { 
    font-size: 32px; 
    margin-bottom: 10px; 
}
.viatura-nome { 
    font-size: 16px; 
    font-weight: bold; 
    color: #2c3e50; 
    margin-bottom: 8px;
    line-height: 1.2;
}
.viatura-info { 
    color: #7f8c8d; 
    font-size: 12px; 
    margin-bottom: 10px;
    word-break: break-all;
}
.viatura-status { 
    display: inline-flex; 
    align-items: center; 
    gap: 6px; 
    padding: 4px 10px; 
    border-radius: 20px; 
    font-size: 11px;
    margin-bottom: 8px;
}
.status-online { background: rgba(46, 204, 113, 0.2); color: #27ae60; }
.status-offline { background: rgba(231, 76, 60, 0.2); color: #c0392b; }

.btn-nova-viatura { 
    background: #3498db; 
    color: white; 
    border: none; 
    padding: 14px 24px; 
    border-radius: 8px; 
    font-size: 15px; 
    font-weight: 600; 
    cursor: pointer; 
    margin-top: 15px; 
    display: inline-flex; 
    align-items: center; 
    gap: 8px;
    width: 100%;
    max-width: 300px;
    justify-content: center;
}

/* Botão de remover viatura */
.btn-remover-viatura { 
    background: #e74c3c; 
    color: white; 
    border: none; 
    padding: 8px 12px; 
    border-radius: 6px; 
    font-size: 12px; 
    cursor: pointer; 
    margin-top: 8px; 
    width: 100%;
    transition: all 0.3s ease;
    font-weight: 600;
}
.btn-remover-viatura:hover { background: #c0392b; }

/* Interface da viatura */
.viatura-interface { 
    display: none; 
    flex: 1;
    flex-direction: column;
    overflow: hidden;
}

/* Header com botões de ação no topo */
.viatura-header { 
    background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); 
    color: white; 
    padding: 15px; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

/* Linha superior - Nome da viatura, ID e botão voltar */
.viatura-top-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 10px;
}

.viatura-titulo { 
    font-size: 18px; 
    font-weight: bold;
    line-height: 1.2;
}

.viatura-id { 
    background: rgba(255,255,255,0.2); 
    padding: 4px 10px; 
    border-radius: 20px; 
    font-size: 12px;
    margin: 0 10px;
}

.btn-voltar { 
    background: rgba(255,255,255,0.2); 
    border: 1px solid rgba(255,255,255,0.3); 
    color: white; 
    padding: 6px 12px; 
    border-radius: 6px; 
    cursor: pointer; 
    font-size: 13px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
}

/* Linha inferior - Informações do usuário e botão trocar função */
.viatura-user-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: rgba(255,255,255,0.1);
    padding: 8px 12px;
    border-radius: 8px;
}

.usuario-info-compact {
    display: flex;
    align-items: center;
    gap: 8px;
}

.usuario-nome-compact {
    font-size: 14px;
    font-weight: 600;
}

.usuario-funcao-compact {
    font-size: 12px;
    opacity: 0.9;
    background: rgba(255,255,255,0.15);
    padding: 2px 8px;
    border-radius: 10px;
}

.btn-trocar-funcao {
    background: rgba(255,255,255,0.2);
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.3s ease;
}

.btn-trocar-funcao:hover {
    background: rgba(255,255,255,0.3);
}

/* Botões de ação no topo */
.top-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.2);
    margin-top: 10px;
}

.top-action-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
}

.top-action-btn:hover {
    background: rgba(255,255,255,0.3);
    transform: scale(1.05);
}

/* Seletor de função */
.funcao-seletor {
    display: flex;
    gap: 8px;
    margin: 15px;
    justify-content: center;
    flex-wrap: wrap;
    flex-shrink: 0;
}

.mode-btn {
    padding: 12px 16px;
    background: #ecf0f1;
    color: #2c3e50;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    flex: 1;
    min-width: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    transition: all 0.3s ease;
}
.mode-btn.ativo {
    background: #3498db;
    color: white;
    transform: scale(1.02);
}
.mode-btn.encarregado.ativo { background: #3498db; }
.mode-btn.motorista.ativo { background: #2ecc71; }
.mode-btn.auxiliar.ativo { background: #f39c12; }

.mode-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: #bdc3c7;
}

/* Sistema de Abas (Operações) */
.abas-container {
    display: flex;
    padding: 10px 15px 0;
    background: #f1f5f9;
    border-bottom: 2px solid #e2e8f0;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: thin;
    scrollbar-color: #cbd5e1 #f1f5f9;
}

.abas-container::-webkit-scrollbar {
    height: 6px;
}

.abas-container::-webkit-scrollbar-track {
    background: #f1f5f9;
}

.abas-container::-webkit-scrollbar-thumb {
    background-color: #cbd5e1;
    border-radius: 3px;
}

.aba-item {
    display: flex;
    align-items: center;
    background: white;
    padding: 8px 15px;
    margin-right: 8px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    border: 1px solid #e2e8f0;
    border-bottom: none;
    transition: all 0.2s ease;
    white-space: nowrap;
    min-width: 120px;
    position: relative;
}

.aba-item.ativa {
    background: #3498db;
    color: white;
    border-color: #3498db;
    font-weight: 600;
}

.aba-titulo {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 14px;
}

.btn-fechar-aba {
    margin-left: 8px;
    background: rgba(0,0,0,0.1);
    border: none;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    cursor: pointer;
    color: inherit;
    transition: all 0.2s ease;
}

.aba-item.ativa .btn-fechar-aba:hover {
    background: rgba(255,255,255,0.3);
}

.btn-nova-aba {
    background: #10b981;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    margin-left: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    font-size: 14px;
    flex-shrink: 0;
}

.btn-nova-aba:hover {
    background: #0da271;
}

/* Conteúdo das abas */
.aba-conteudo {
    flex: 1;
    overflow-y: auto;
    display: none;
    padding: 0;
    -webkit-overflow-scrolling: touch;
}

.aba-conteudo.ativa {
    display: flex;
    flex-direction: column;
}

/* Itens dentro de cada aba */
.itens-container {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.item {
    background: white;
    border: 2px solid #dee2e6;
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: all 0.3s ease;
}

.item-header {
    padding: 15px;
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    color: #2c3e50;
    cursor: pointer;
    user-select: none;
}

.item-total {
    background: #3498db;
    color: white;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    margin-left: 10px;
}

.item-conteudo {
    padding: 20px;
    border-top: 1px solid #dee2e6;
}

/* Input para artigos livres */
.input-artigo-container {
    padding: 0 0 15px;
    margin-bottom: 15px;
    border-bottom: 1px solid #dee2e6;
}

.input-artigo {
    width: 100%;
    padding: 12px;
    border: 2px solid #3498db;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
}

/* Contador específico para cada função */
.contador-funcao {
    background: #f8f9fa;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 12px;
    display: none;
}

.contador-funcao.ativo {
    display: block;
}

.contador-titulo {
    color: #2c3e50;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 600;
}

.contador-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 10px 0;
}

.contador-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.contador-btn:active {
    transform: scale(0.95);
}

.btn-menos { background: #e74c3c; }
.btn-add { background: #2ecc71; }

.contador-valor {
    font-size: 28px;
    font-weight: bold;
    color: #2c3e50;
    min-width: 50px;
    text-align: center;
}

/* Botões de envio específicos */
.envio-actions {
    display: flex;
    gap: 10px;
    padding: 15px;
    background: #f8f9fa;
    border-top: 1px solid #e2e8f0;
    flex-shrink: 0;
}

.envio-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 14px;
}

.envio-btn.aba {
    background: #3b82f6;
    color: white;
}

.envio-btn.todas {
    background: #10b981;
    color: white;
}

/* Botão admin escondido */
.btn-admin { 
    display: none !important; 
}

/* Responsivo adicional */
@media (max-width: 480px) {
    .container {
        height: calc(100vh - 20px);
        border-radius: 12px;
    }
    
    .viatura-selection {
        padding: 20px 15px;
    }
    
    .viaturas-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
    }
    
    .viatura-card {
        padding: 15px 10px;
        min-height: 120px;
    }
    
    .viatura-header {
        padding: 12px;
        flex-direction: column;
        gap: 8px;
    }
    
    .viatura-top-line {
        flex-wrap: wrap;
        gap: 8px;
    }
    
    .viatura-user-line {
        flex-wrap: wrap;
        gap: 8px;
    }
    
    .viatura-id {
        margin: 0;
    }
    
    .funcao-seletor {
        margin: 12px;
    }
    
    .mode-btn {
        padding: 10px 12px;
        font-size: 13px;
        min-width: 85px;
    }
    
    .contador-btn {
        width: 40px;
        height: 40px;
        font-size: 20px;
    }
    
    .top-actions {
        gap: 8px;
    }
    
    .top-action-btn {
        width: 36px;
        height: 36px;
        font-size: 14px;
    }
    
    .btn-voltar {
        padding: 5px 10px;
        font-size: 12px;
    }
    
    .btn-trocar-funcao {
        padding: 5px 10px;
        font-size: 11px;
    }
    
    .aba-item {
        min-width: 100px;
        padding: 6px 12px;
    }
    
    .envio-actions {
        flex-direction: column;
    }
    
    .envio-btn {
        width: 100%;
    }
}

/* Ajustes para iOS */
@supports (-webkit-touch-callout: none) {
    .container {
        height: -webkit-fill-available;
    }
}

/* Status de função ocupada */
.funcao-ocupada {
    position: relative;
}

.funcao-ocupada::after {
    content: '👤';
    position: absolute;
    top: 5px;
    right: 5px;
    font-size: 12px;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-content {
    background: white;
    border-radius: 15px;
    padding: 25px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    animation: modalAppear 0.3s ease;
}

@keyframes modalAppear {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Sistema de fiscalização - REMOVIDO */
.sistema-fiscalizacao {
    display: none;
}
</style>
</head>

<body>

<div class="container">
    <!-- TELA 1: Seleção de Viatura -->
    <div class="viatura-selection" id="viaturaSelection">
        <h1>🚔 SISTEMA DE FISCALIZAÇÃO</h1>
        <p style="color: #666; margin-bottom: 20px; font-size: 14px;">Selecione sua viatura para começar</p>
        
        <div class="viaturas-grid" id="viaturasList">
            <!-- Viaturas serão carregadas aqui -->
        </div>
        
        <!-- Botão único de Nova Viatura -->
        <button class="btn-nova-viatura" onclick="mostrarModalNovaViatura()">
            <span style="font-size: 18px;">+</span> Nova Viatura
        </button>
    </div>

    <!-- TELA 2: Interface da Viatura Selecionada -->
    <div class="viatura-interface" id="viaturaInterface">
        <div class="viatura-header">
            <div style="width: 100%;">
                <!-- Linha superior: Nome da viatura, ID e botão voltar -->
                <div class="viatura-top-line">
                    <div class="viatura-titulo" id="viaturaTitulo">Viatura X</div>
                    <div class="viatura-id" id="viaturaId">ID: VIATURA_X_001</div>
                    <button class="btn-voltar" onclick="voltarParaSelecao()">
                        ← Voltar
                    </button>
                </div>
                
                <!-- Linha inferior: Informações do usuário e botão trocar função -->
                <div class="viatura-user-line" id="viaturaUserLine" style="display: none;">
                    <div class="usuario-info-compact">
                        <span class="usuario-nome-compact" id="usuarioNomeCompact">GUIDINI</span>
                        <span class="usuario-funcao-compact" id="usuarioFuncaoCompact">Encarregado</span>
                    </div>
                    <button class="btn-trocar-funcao" onclick="sairDaFuncao()">
                        🔄 Trocar Função
                    </button>
                </div>
                
                <!-- Botões de ação -->
                <div class="top-actions">
                    <button class="top-action-btn" onclick="enviarWhatsAppTodasAbas()" title="Enviar Todas as Operações">
                        📤
                    </button>
                    <button class="top-action-btn" onclick="limparDados()" title="Limpar Dados">
                        🗑️
                    </button>
                </div>
            </div>
        </div>

        <!-- Seletor de função -->
        <div class="funcao-seletor" id="funcaoSeletor">
            <button class="mode-btn encarregado" onclick="setAccessMode('encarregado')">
                <span style="font-size: 20px;">👮‍♂️</span>
                Encarregado
            </button>
            <button class="mode-btn motorista" onclick="setAccessMode('motorista')">
                <span style="font-size: 20px;">🚚</span>
                Motorista
            </button>
            <button class="mode-btn auxiliar" onclick="setAccessMode('auxiliar')">
                <span style="font-size: 20px;">👥</span>
                Auxiliar
            </button>
        </div>

        <!-- Sistema de Abas (Operações) -->
        <div class="abas-container" id="abasContainer" style="display: none;">
            <!-- Abas serão criadas dinamicamente aqui -->
        </div>

        <!-- Container para conteúdo das abas -->
        <div id="abasConteudoContainer" style="flex: 1; display: none; overflow: hidden;">
            <!-- Conteúdo das abas será criado dinamicamente aqui -->
        </div>

        <!-- Botões de envio -->
        <div class="envio-actions" id="envioActions" style="display: none;">
            <button class="envio-btn aba" onclick="enviarWhatsAppAbaAtual()">
                📤 Enviar Esta Operação
            </button>
            <button class="envio-btn todas" onclick="enviarWhatsAppTodasAbas()">
                📊 Enviar Resultado Final (Todas)
            </button>
        </div>
    </div>
</div>

<!-- Modal Nova Viatura (SIMPLIFICADO) -->
<div class="modal" id="modalNovaViatura">
    <div class="modal-content">
        <h2>Nova Viatura</h2>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; color: #666; font-size: 14px;">Nome da Viatura:</label>
            <input type="text" id="novaViaturaNome" placeholder="Ex: R-04412" 
                   style="width: 100%; padding: 12px; border: 2px solid #3498db; border-radius: 6px; font-size: 16px;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; color: #666; font-size: 14px;">ID Único:</label>
            <input type="text" id="novaViaturaId" placeholder="Ex: R-04412" 
                   style="width: 100%; padding: 12px; border: 2px solid #3498db; border-radius: 6px; font-size: 16px;">
            <small style="color: #999; font-size: 12px; display: block; margin-top: 5px;">Use o mesmo ID em todos os dispositivos</small>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 25px;">
            <button onclick="fecharModalNovaViatura()" style="flex: 1; padding: 12px; background: #95a5a6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
                Cancelar
            </button>
            <button onclick="criarNovaViatura()" style="flex: 1; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
                Criar
            </button>
        </div>
    </div>
</div>

<script>
// ===== CONFIGURAÇÃO FIREBASE =====
const firebaseConfig = {
    apiKey: "AIzaSyC7u9yPMqkswESx3jJh4I4fCUS8tiu-MjM",
    authDomain: "rodoviariolimeira.firebaseapp.com",
    databaseURL: "https://rodoviariolimeira-default-rtdb.firebaseio.com",
    projectId: "rodoviariolimeira",
    storageBucket: "rodoviariolimeira.firebasestorage.app",
    messagingSenderId: "131653476917",
    appId: "1:131653476917:web:3758f0247b5be006c9077c",
    measurementId: "G-0CJ7FD2MN2"
};

// ===== VARIÁVEIS GLOBAIS =====
let db;
let viaturaAtualRef;
let currentViatura = null;
let currentUser = { mode: '', name: '' };
let todasViaturas = [];
let usuarioSalvo = null;
let abas = []; // Array para armazenar as abas
let abaAtualIndex = 0; // Índice da aba atual

// ===== ITENS FIXOS =====
const ITENS_FIXOS = [
    "AP Fiscalizado","CA Fiscalizado","OA Fiscalizado","MO Fiscalizado",
    "AI AP","AI CA","AI OA","AI MO","AI Abordagem","AI Revelia",
    "ART. 167","ART. 168","ART. 252, VI / § ún.","ART. 203, V",
    "ART. 165","ART. 165-A","ART. 306","Teste Ativo","Teste Passivo",
    "Pessoas abordadas","Pedestres abordados","Pedestres lançados no Google Forms",
    "Total ARV","Total ARD","Imagem Radar","BO-e Com Vítima","BO-e Sem Vítima",
    "Vítimas Leves","Vítimas Graves","Vítimas Fatais","Procurado Capturado",
    "Flagrante","Presos","BOPM ( exceto ART. 306 )"
];

// ===== INICIALIZAÇÃO =====
function initApp() {
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        
        console.log('Firebase conectado com sucesso!');
        
        carregarUsuarioSalvo();
        carregarListaViaturas();
        
        const urlParams = new URLSearchParams(window.location.search);
        const viaturaId = urlParams.get('viatura');
        if (viaturaId) {
            acessarViatura(viaturaId);
        }
    } catch (error) {
        console.error('Erro ao conectar com Firebase:', error);
    }
}

// ===== GERENCIAMENTO DE USUÁRIO =====
function carregarUsuarioSalvo() {
    const usuarioSalvoStr = localStorage.getItem('fiscalizacao_usuario');
    if (usuarioSalvoStr) {
        usuarioSalvo = JSON.parse(usuarioSalvoStr);
    }
}

function salvarUsuario() {
    if (currentUser.mode && currentUser.name) {
        localStorage.setItem('fiscalizacao_usuario', JSON.stringify({
            mode: currentUser.mode,
            name: currentUser.name,
            timestamp: new Date().getTime()
        }));
    }
}

function limparUsuarioSalvo() {
    localStorage.removeItem('fiscalizacao_usuario');
    usuarioSalvo = null;
    currentUser = { mode: '', name: '' };
}

// ===== GERENCIAMENTO DE VIATURAS =====
function carregarListaViaturas() {
    if (!db) return;
    
    db.ref('viaturas').on('value', (snapshot) => {
        todasViaturas = [];
        const viaturasList = document.getElementById('viaturasList');
        viaturasList.innerHTML = '';
        
        if (!snapshot.exists()) {
            viaturasList.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 30px 15px;">
                    <div style="font-size: 48px; margin-bottom: 15px;">🚔</div>
                    <h3 style="color: #2c3e50; margin-bottom: 10px; font-size: 16px;">Nenhuma viatura</h3>
                    <p style="color: #666; margin-bottom: 15px; font-size: 14px;">Clique em "Nova Viatura"</p>
                </div>
            `;
            return;
        }
        
        snapshot.forEach((childSnapshot) => {
            const viatura = childSnapshot.val();
            viatura.id = childSnapshot.key;
            todasViaturas.push(viatura);
            
            let status = 'offline';
            if (viatura.encarregado && viatura.encarregado.online) status = 'online';
            if (viatura.motorista && viatura.motorista.online) status = 'online';
            if (viatura.auxiliar && viatura.auxiliar.online) status = 'online';
            
            const viaturaCard = document.createElement('div');
            viaturaCard.className = `viatura-card ${currentViatura?.id === viatura.id ? 'ativa' : ''}`;
            viaturaCard.innerHTML = `
                <div class="viatura-icon">🚔</div>
                <div class="viatura-nome">${viatura.nome || 'Nova Viatura'}</div>
                <div class="viatura-info">${viatura.id}</div>
                <div class="viatura-status ${status === 'online' ? 'status-online' : 'status-offline'}">
                    <div style="width: 6px; height: 6px; border-radius: 50%; background: ${status === 'online' ? '#2ecc71' : '#e74c3c'};"></div>
                    ${status === 'online' ? 'Online' : 'Offline'}
                </div>
                <button class="btn-remover-viatura" onclick="removerViatura('${childSnapshot.key}', event)">
                    🗑️ Remover
                </button>
            `;
            viaturaCard.onclick = (e) => {
                if (!e.target.classList.contains('btn-remover-viatura')) {
                    acessarViatura(viatura.id);
                }
            };
            viaturasList.appendChild(viaturaCard);
        });
    });
}

// ===== FUNÇÕES DE ADMINISTRAÇÃO =====
function removerViatura(viaturaId, event) {
    if (event) event.stopPropagation();
    
    // Confirmar antes de remover
    if (confirm(`Tem certeza que deseja remover esta viatura? Esta ação não pode ser desfeita.`)) {
        db.ref(`viaturas/${viaturaId}`).remove()
            .then(() => {
                alert(`✅ Viatura removida com sucesso!`);
                
                // Se a viatura removida é a que está sendo usada, voltar para seleção
                if (currentViatura && currentViatura.id === viaturaId) {
                    voltarParaSelecao();
                }
            })
            .catch((error) => {
                console.error('Erro ao remover viatura:', error);
                alert('❌ Erro ao remover viatura: ' + error.message);
            });
    }
}

// ===== FUNÇÕES DA VIATURA =====
function mostrarModalNovaViatura() {
    document.getElementById('modalNovaViatura').style.display = 'flex';
    document.getElementById('novaViaturaId').value = `VIATURA_${Math.floor(Math.random() * 9000) + 1000}`;
}

function fecharModalNovaViatura() {
    document.getElementById('modalNovaViatura').style.display = 'none';
}

function criarNovaViatura() {
    const nome = document.getElementById('novaViaturaNome').value || 'Nova Viatura';
    const id = document.getElementById('novaViaturaId').value;
    
    if (!id) {
        alert('Digite um ID para a viatura!');
        return;
    }
    
    if (!db) return;
    
    // Verificar se a viatura já existe
    db.ref(`viaturas/${id}`).once('value')
        .then((snapshot) => {
            if (snapshot.exists()) {
                alert('❌ Já existe uma viatura com este ID! Use outro ID.');
                return;
            }
            
            // Criar nova viatura com uma aba padrão
            db.ref(`viaturas/${id}`).set({
                nome: nome,
                criadaEm: new Date().toISOString(),
                abas: [
                    {
                        id: 'operacao_1',
                        nome: 'Operação 1',
                        itens: criarItensPadrao()
                    }
                ],
                encarregado: { nome: '', online: false },
                motorista: { nome: '', online: false },
                auxiliar: { nome: '', online: false }
            }).then(() => {
                fecharModalNovaViatura();
                acessarViatura(id);
            });
        })
        .catch((error) => {
            alert('❌ Erro ao verificar viatura: ' + error.message);
        });
}

function criarItensPadrao() {
    const itens = [];
    
    ITENS_FIXOS.forEach((nome, i) => {
        itens.push({
            id: `f${i}`,
            tipo: 'fixo',
            nome: nome,
            encarregado: 0,
            motorista: 0,
            auxiliar: 0
        });
    });
    
    for (let i = 1; i <= 8; i++) {
        itens.push({
            id: `l${i}`,
            tipo: 'livre',
            nome: '',
            encarregado: 0,
            motorista: 0,
            auxiliar: 0
        });
    }
    
    return itens;
}

function acessarViatura(viaturaId) {
    currentViatura = { id: viaturaId };
    
    const novaUrl = `${window.location.pathname}?viatura=${viaturaId}`;
    window.history.pushState({}, '', novaUrl);
    
    conectarViatura(viaturaId);
    
    document.getElementById('viaturaSelection').style.display = 'none';
    document.getElementById('viaturaInterface').style.display = 'flex';
    
    const viaturaInfo = todasViaturas.find(v => v.id === viaturaId);
    if (viaturaInfo) {
        document.getElementById('viaturaTitulo').textContent = viaturaInfo.nome || 'Viatura';
    }
    document.getElementById('viaturaId').textContent = `ID: ${viaturaId}`;
    
    if (usuarioSalvo) {
        setTimeout(() => {
            verificarEConectarUsuario(usuarioSalvo.mode, usuarioSalvo.name);
        }, 500);
    }
}

function conectarViatura(viaturaId) {
    if (!db) return;
    
    viaturaAtualRef = db.ref(`viaturas/${viaturaId}`);
    
    viaturaAtualRef.on('value', (snapshot) => {
        if (snapshot.exists()) {
            currentViatura.data = snapshot.val();
            atualizarBotoesFuncao();
            
            // Inicializar abas se existirem dados
            if (currentViatura.data.abas && Array.isArray(currentViatura.data.abas)) {
                abas = currentViatura.data.abas;
                console.log('Abas carregadas:', abas);
                renderizarAbas();
                if (abas.length > 0) {
                    selecionarAba(abaAtualIndex);
                }
            } else {
                // Criar primeira aba se não existir
                criarNovaAba('Operação 1');
            }
            
            if (currentUser.mode) {
                atualizarInterfaceUsuarioCompact();
            }
        }
    });
}

// ===== SISTEMA DE ABAS (OPERAÇÕES) =====
function renderizarAbas() {
    const abasContainer = document.getElementById('abasContainer');
    const conteudoContainer = document.getElementById('abasConteudoContainer');
    
    if (!abasContainer || !conteudoContainer) return;
    
    // Limpar containers
    abasContainer.innerHTML = '';
    conteudoContainer.innerHTML = '';
    
    // Mostrar container de abas
    abasContainer.style.display = 'flex';
    conteudoContainer.style.display = 'flex';
    
    // Adicionar botão de nova aba
    const btnNovaAba = document.createElement('button');
    btnNovaAba.className = 'btn-nova-aba';
    btnNovaAba.innerHTML = '+';
    btnNovaAba.onclick = () => {
        const nome = prompt('Nome da nova operação:', `Operação ${abas.length + 1}`);
        if (nome) {
            criarNovaAba(nome);
        }
    };
    abasContainer.appendChild(btnNovaAba);
    
    // Renderizar cada aba
    abas.forEach((aba, index) => {
        // Criar elemento da aba
        const abaElement = document.createElement('div');
        abaElement.className = `aba-item ${index === abaAtualIndex ? 'ativa' : ''}`;
        abaElement.innerHTML = `
            <span class="aba-titulo">${aba.nome}</span>
            <button class="btn-fechar-aba" onclick="removerAba(${index}, event)">×</button>
        `;
        abaElement.onclick = (e) => {
            if (!e.target.classList.contains('btn-fechar-aba')) {
                selecionarAba(index);
            }
        };
        abasContainer.appendChild(abaElement);
        
        // Criar conteúdo da aba
        const conteudoElement = document.createElement('div');
        conteudoElement.className = `aba-conteudo ${index === abaAtualIndex ? 'ativa' : ''}`;
        conteudoElement.id = `aba-conteudo-${index}`;
        conteudoElement.innerHTML = `
            <div class="itens-container">
                <div id="itensList-${index}"></div>
            </div>
        `;
        conteudoContainer.appendChild(conteudoElement);
    });
    
    // Mostrar botões de envio se houver usuário logado
    if (currentUser.mode) {
        document.getElementById('envioActions').style.display = 'flex';
    }
    
    // Atualizar conteúdo da aba atual
    if (abas.length > 0 && currentUser.mode) {
        atualizarInterfaceAba(abaAtualIndex);
    }
}

function criarNovaAba(nome) {
    if (!viaturaAtualRef) return;
    
    const novaAba = {
        id: `operacao_${Date.now()}`,
        nome: nome || `Operação ${abas.length + 1}`,
        itens: criarItensPadrao()
    };
    
    const novoIndex = abas.length;
    abas.push(novaAba);
    
    viaturaAtualRef.child('abas').set(abas)
        .then(() => {
            renderizarAbas();
            selecionarAba(novoIndex);
        })
        .catch(error => {
            console.error('Erro ao criar aba:', error);
            alert('Erro ao criar nova operação!');
        });
}

function selecionarAba(index) {
    if (index < 0 || index >= abas.length) return;
    
    console.log('Selecionando aba:', index, 'Título:', abas[index]?.nome);
    
    // Salvar o índice da aba atual
    abaAtualIndex = index;
    
    // Atualizar classes ativas nas abas
    document.querySelectorAll('.aba-item').forEach((item, i) => {
        item.classList.toggle('ativa', i === index);
    });
    
    // Atualizar classes ativas no conteúdo
    document.querySelectorAll('.aba-conteudo').forEach((conteudo, i) => {
        conteudo.classList.toggle('ativa', i === index);
    });
    
    // Atualizar interface da aba selecionada
    if (currentUser.mode) {
        atualizarInterfaceAba(index);
    }
}

function removerAba(index, event) {
    if (event) event.stopPropagation();
    
    if (abas.length <= 1) {
        alert('Não é possível remover a última operação!');
        return;
    }
    
    if (!confirm(`Remover a operação "${abas[index].nome}"?`)) return;
    
    abas.splice(index, 1);
    
    // Se removermos a aba atual, selecionar a anterior
    if (index === abaAtualIndex) {
        abaAtualIndex = Math.max(0, index - 1);
    }
    
    viaturaAtualRef.child('abas').set(abas)
        .then(() => {
            renderizarAbas();
            selecionarAba(abaAtualIndex);
        })
        .catch(error => {
            console.error('Erro ao remover aba:', error);
            alert('Erro ao remover operação!');
        });
}

// ===== VERIFICAÇÃO DE FUNÇÃO OCUPADA =====
function verificarEConectarUsuario(mode, nomePredefinido = null) {
    if (!viaturaAtualRef || !currentViatura?.data) return;
    
    // Verificar se a função já está ocupada
    const membro = currentViatura.data[mode];
    if (membro && membro.nome && membro.online) {
        // Função já ocupada - mostrar aviso
        alert(`⚠️ A função de ${mode} já está sendo usada por ${membro.nome}!\n\nEscolha outra função.`);
        
        // Limpar usuário salvo já que não pode mais usar essa função
        if (usuarioSalvo && usuarioSalvo.mode === mode) {
            limparUsuarioSalvo();
        }
        
        // Resetar interface
        document.getElementById('viaturaUserLine').style.display = 'none';
        document.getElementById('envioActions').style.display = 'none';
        
        // Atualizar botões
        atualizarBotoesFuncao();
        
        return;
    }
    
    // Função disponível - proceder com conexão
    setAccessMode(mode, nomePredefinido);
}

function atualizarBotoesFuncao() {
    if (!currentViatura?.data) return;
    
    const data = currentViatura.data;
    const botoes = document.querySelectorAll('.mode-btn');
    
    botoes.forEach(botao => {
        const funcao = botao.classList.contains('encarregado') ? 'encarregado' :
                      botao.classList.contains('motorista') ? 'motorista' : 'auxiliar';
        
        const membro = data[funcao];
        
        if (membro && membro.nome && membro.online) {
            // Função ocupada
            botao.disabled = true;
            botao.title = `Ocupado por: ${membro.nome}`;
            botao.innerHTML = `<span style="font-size: 20px;">👤</span> ${funcao.charAt(0).toUpperCase() + funcao.slice(1)}<br><small style="font-size: 10px; opacity: 0.7;">Ocupado</small>`;
        } else {
            // Função disponível
            botao.disabled = false;
            botao.title = '';
            botao.innerHTML = `<span style="font-size: 20px;">${
                funcao === 'encarregado' ? '👮‍♂️' : 
                funcao === 'motorista' ? '🚚' : '👥'
            }</span> ${funcao.charAt(0).toUpperCase() + funcao.slice(1)}`;
        }
    });
}

function setAccessMode(mode, nomePredefinido = null) {
    if (!viaturaAtualRef) return;
    
    let userName = nomePredefinido;
    
    if (!userName) {
        userName = prompt(`Digite seu nome (${mode}):`) || mode;
        if (!userName || userName.trim() === '') {
            alert('Digite um nome para continuar!');
            return;
        }
    }
    
    currentUser.name = userName.trim();
    currentUser.mode = mode;
    
    salvarUsuario();
    atualizarInterfaceUsuarioCompact();
    
    viaturaAtualRef.child(mode).update({
        nome: currentUser.name,
        online: true,
        ultimaAtividade: firebase.database.ServerValue.TIMESTAMP
    });
    
    const userRef = viaturaAtualRef.child(mode);
    userRef.onDisconnect().update({
        online: false,
        ultimaAtividade: firebase.database.ServerValue.TIMESTAMP
    });
    
    document.getElementById('viaturaUserLine').style.display = 'flex';
    document.getElementById('envioActions').style.display = 'flex';
    
    // Mostrar abas se existirem
    if (abas.length > 0) {
        document.getElementById('abasContainer').style.display = 'flex';
        document.getElementById('abasConteudoContainer').style.display = 'flex';
        atualizarInterfaceAba(abaAtualIndex);
    }
    
    atualizarBotoesFuncao();
}

function atualizarInterfaceUsuarioCompact() {
    const usuarioNome = document.getElementById('usuarioNomeCompact');
    const usuarioFuncao = document.getElementById('usuarioFuncaoCompact');
    
    if (usuarioNome) {
        usuarioNome.textContent = currentUser.name;
    }
    
    if (usuarioFuncao) {
        const funcoes = {
            'encarregado': 'Encarregado',
            'motorista': 'Motorista', 
            'auxiliar': 'Auxiliar'
        };
        usuarioFuncao.textContent = funcoes[currentUser.mode] || currentUser.mode;
    }
    
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('ativo');
    });
    const btnAtivo = document.querySelector(`.mode-btn.${currentUser.mode}`);
    if (btnAtivo) btnAtivo.classList.add('ativo');
}

function sairDaFuncao() {
    if (viaturaAtualRef && currentUser.mode) {
        viaturaAtualRef.child(currentUser.mode).update({ online: false });
    }
    
    limparUsuarioSalvo();
    currentUser = { mode: '', name: '' };
    
    document.getElementById('viaturaUserLine').style.display = 'none';
    document.getElementById('envioActions').style.display = 'none';
    
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('ativo');
    });
    
    atualizarBotoesFuncao();
}

// ===== INTERFACE DOS ITENS EM CADA ABA =====
function atualizarInterfaceAba(abaIndex) {
    if (!abas[abaIndex] || !currentUser.mode) {
        console.log('Não foi possível atualizar interface:', {abaIndex, temAba: !!abas[abaIndex], modoUsuario: currentUser.mode});
        return;
    }
    
    console.log('Atualizando interface da aba:', abaIndex, 'Título:', abas[abaIndex].nome);
    
    const itens = abas[abaIndex].itens || [];
    renderizarItensAba(abaIndex, itens);
}

function renderizarItensAba(abaIndex, itens) {
    const container = document.getElementById(`itensList-${abaIndex}`);
    if (!container) {
        console.log('Container não encontrado para aba:', abaIndex);
        return;
    }
    
    container.innerHTML = '';
    
    console.log('Renderizando', itens.length, 'itens na aba', abaIndex);
    
    itens.forEach((item, index) => {
        const total = item.encarregado + item.motorista + item.auxiliar;
        const titulo = item.tipo === 'livre' ? (item.nome || '✏️ Artigo livre') : item.nome;
        
        const itemHTML = `
            <div class="item">
                <div class="item-header">
                    <span>${titulo}</span>
                    <span class="item-total">${total}</span>
                </div>
                <div class="item-conteudo">
                    ${item.tipo === 'livre' ? `
                        <div class="input-artigo-container">
                            <input type="text" class="input-artigo" 
                                   placeholder="Digite o nome do artigo"
                                   value="${item.nome || ''}"
                                   oninput="atualizarNomeItemAba(${abaIndex}, ${index}, this.value)">
                        </div>
                    ` : ''}
                    
                    <!-- Contador específico para cada função -->
                    <div class="contador-funcao ${currentUser.mode === 'encarregado' ? 'ativo' : ''}" id="contador-encarregado-${abaIndex}-${index}">
                        <div class="contador-titulo">👮‍♂️ Encarregado</div>
                        <div class="contador-box">
                            <button class="contador-btn btn-menos" onclick="alterarContadorAba(${abaIndex}, ${index}, 'encarregado', -1, event)">
                                -
                            </button>
                            <span class="contador-valor" id="contador-e-${abaIndex}-${index}">${item.encarregado}</span>
                            <button class="contador-btn btn-add" onclick="alterarContadorAba(${abaIndex}, ${index}, 'encarregado', 1, event)">
                                +
                            </button>
                        </div>
                    </div>
                    
                    <div class="contador-funcao ${currentUser.mode === 'motorista' ? 'ativo' : ''}" id="contador-motorista-${abaIndex}-${index}">
                        <div class="contador-titulo">🚚 Motorista</div>
                        <div class="contador-box">
                            <button class="contador-btn btn-menos" onclick="alterarContadorAba(${abaIndex}, ${index}, 'motorista', -1, event)">
                                -
                            </button>
                            <span class="contador-valor" id="contador-m-${abaIndex}-${index}">${item.motorista}</span>
                            <button class="contador-btn btn-add" onclick="alterarContadorAba(${abaIndex}, ${index}, 'motorista', 1, event)">
                                +
                            </button>
                        </div>
                    </div>
                    
                    <div class="contador-funcao ${currentUser.mode === 'auxiliar' ? 'ativo' : ''}" id="contador-auxiliar-${abaIndex}-${index}">
                        <div class="contador-titulo">👥 Auxiliar</div>
                        <div class="contador-box">
                            <button class="contador-btn btn-menos" onclick="alterarContadorAba(${abaIndex}, ${index}, 'auxiliar', -1, event)">
                                -
                            </button>
                            <span class="contador-valor" id="contador-a-${abaIndex}-${index}">${item.auxiliar}</span>
                            <button class="contador-btn btn-add" onclick="alterarContadorAba(${abaIndex}, ${index}, 'auxiliar', 1, event)">
                                +
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        container.innerHTML += itemHTML;
    });
}

function alterarContadorAba(abaIndex, itemIndex, campo, valor, event) {
    if (event) event.stopPropagation();
    
    if (!viaturaAtualRef || currentUser.mode !== campo) {
        console.log('Não pode alterar:', {temRef: !!viaturaAtualRef, modoUsuario: currentUser.mode, campo});
        return;
    }
    
    if (!abas[abaIndex]?.itens?.[itemIndex]) {
        console.log('Item não encontrado:', {abaIndex, itemIndex, temAba: !!abas[abaIndex]});
        return;
    }
    
    const novoValor = Math.max(0, (abas[abaIndex].itens[itemIndex][campo] || 0) + valor);
    
    console.log('Alterando contador:', {
        abaIndex,
        itemIndex,
        campo,
        valorAtual: abas[abaIndex].itens[itemIndex][campo],
        novoValor,
        modoUsuario: currentUser.mode
    });
    
    // Atualizar localmente primeiro
    abas[abaIndex].itens[itemIndex][campo] = novoValor;
    
    // Atualizar contador na interface
    const contador = document.getElementById(`contador-${campo.charAt(0)}-${abaIndex}-${itemIndex}`);
    if (contador) {
        contador.textContent = novoValor;
    }
    
    // Atualizar total
    const itemElement = document.querySelectorAll(`#aba-conteudo-${abaIndex} .item`)[itemIndex];
    if (itemElement) {
        const totalElement = itemElement.querySelector('.item-total');
        if (totalElement) {
            const e = parseInt(document.getElementById(`contador-e-${abaIndex}-${itemIndex}`)?.textContent || 0);
            const m = parseInt(document.getElementById(`contador-m-${abaIndex}-${itemIndex}`)?.textContent || 0);
            const a = parseInt(document.getElementById(`contador-a-${abaIndex}-${itemIndex}`)?.textContent || 0);
            const novoTotal = e + m + a;
            totalElement.textContent = novoTotal;
        }
    }
    
    // Atualizar no Firebase
    viaturaAtualRef.child(`abas/${abaIndex}/itens/${itemIndex}/${campo}`).set(novoValor)
        .catch(error => {
            console.error('Erro ao atualizar Firebase:', error);
        });
}

function atualizarNomeItemAba(abaIndex, itemIndex, nome) {
    if (!viaturaAtualRef) return;
    
    // Atualizar localmente
    abas[abaIndex].itens[itemIndex].nome = nome;
    
    // Atualizar no Firebase
    viaturaAtualRef.child(`abas/${abaIndex}/itens/${itemIndex}/nome`).set(nome);
    
    // Atualizar título do item na interface
    const itemElement = document.querySelectorAll(`#aba-conteudo-${abaIndex} .item`)[itemIndex];
    if (itemElement) {
        const tituloElement = itemElement.querySelector('.item-header span:first-child');
        if (tituloElement) {
            tituloElement.textContent = nome || '✏️ Artigo livre';
        }
    }
}

function voltarParaSelecao() {
    if (viaturaAtualRef && currentUser.mode) {
        viaturaAtualRef.child(currentUser.mode).update({ online: false });
    }
    
    document.getElementById('viaturaSelection').style.display = 'block';
    document.getElementById('viaturaInterface').style.display = 'none';
    
    currentViatura = null;
    viaturaAtualRef = null;
    abas = [];
    abaAtualIndex = 0;
}

// ===== FUNÇÕES DE ENVIO =====
function enviarWhatsAppAbaAtual() {
    if (!abas[abaAtualIndex] || !currentUser.mode) {
        alert('Escolha sua função primeiro!');
        return;
    }
    
    const aba = abas[abaAtualIndex];
    const data = currentViatura.data;
    let texto = `*FISCALIZAÇÃO - ${data.nome || currentViatura.id}*\n`;
    texto += `*OPERAÇÃO: ${aba.nome}*\n\n`;
    
    const equipe = [];
    if (data.encarregado?.nome) equipe.push(`Encarregado: ${data.encarregado.nome}`);
    if (data.motorista?.nome) equipe.push(`Motorista: ${data.motorista.nome}`);
    if (data.auxiliar?.nome) equipe.push(`Auxiliar: ${data.auxiliar.nome}`);
    
    if (equipe.length > 0) {
        texto += `👥 ${equipe.join(' | ')}\n\n`;
    }
    
    let temDados = false;
    (aba.itens || []).forEach(item => {
        const nome = item.tipo === 'livre' ? item.nome : item.nome;
        if (!nome && item.tipo === 'livre') return;
        
        const total = item.encarregado + item.motorista + item.auxiliar;
        if (total > 0) {
            temDados = true;
            texto += `*${nome}*\n`;
            if (item.encarregado > 0) texto += `- Encarregado: ${item.encarregado}\n`;
            if (item.motorista > 0) texto += `- Motorista: ${item.motorista}\n`;
            if (item.auxiliar > 0) texto += `- Auxiliar: ${item.auxiliar}\n`;
            texto += '\n';
        }
    });
    
    if (!temDados) {
        alert('Nada para enviar nesta operação!');
        return;
    }
    
    texto += `\n📅 ${new Date().toLocaleDateString('pt-BR')}`;
    
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
}

function enviarWhatsAppTodasAbas() {
    if (!abas.length || !currentUser.mode) {
        alert('Escolha sua função primeiro!');
        return;
    }
    
    const data = currentViatura.data;
    let texto = `*FISCALIZAÇÃO - ${data.nome || currentViatura.id}*\n`;
    texto += `*RESULTADO FINAL DO DIA*\n\n`;
    
    const equipe = [];
    if (data.encarregado?.nome) equipe.push(`Encarregado: ${data.encarregado.nome}`);
    if (data.motorista?.nome) equipe.push(`Motorista: ${data.motorista.nome}`);
    if (data.auxiliar?.nome) equipe.push(`Auxiliar: ${data.auxiliar.nome}`);
    
    if (equipe.length > 0) {
        texto += `👥 ${equipe.join(' | ')}\n\n`;
    }
    
    // Criar objeto para somar todos os itens de todas as abas
    const somas = {};
    let temDados = false;
    
    // Processar cada aba e somar todos os valores
    abas.forEach((aba) => {
        aba.itens.forEach(item => {
            const nome = item.tipo === 'livre' ? item.nome : item.nome;
            if (!nome && item.tipo === 'livre') return;
            
            const total = item.encarregado + item.motorista + item.auxiliar;
            if (total > 0) {
                temDados = true;
                
                if (!somas[nome]) {
                    somas[nome] = {
                        encarregado: 0,
                        motorista: 0,
                        auxiliar: 0,
                        total: 0
                    };
                }
                
                somas[nome].encarregado += item.encarregado;
                somas[nome].motorista += item.motorista;
                somas[nome].auxiliar += item.auxiliar;
                somas[nome].total += total;
            }
        });
    });
    
    if (!temDados) {
        alert('Nada para enviar!');
        return;
    }
    
    // Adicionar totais gerais (apenas itens com total > 0)
    texto += `📊 *TOTAIS GERAIS (Consolidado)*\n`;
    let totalGeral = 0;
    let encarregadoTotal = 0;
    let motoristaTotal = 0;
    let auxiliarTotal = 0;
    
    // Ordenar itens por total (maior primeiro)
    const itensOrdenados = Object.entries(somas)
        .filter(([nome, valores]) => valores.total > 0) // Filtrar apenas itens com total > 0
        .sort((a, b) => b[1].total - a[1].total); // Ordenar por total decrescente
    
    for (const [nome, valores] of itensOrdenados) {
        // Mostrar apenas o total geral do item (soma de todas as operações)
        texto += `*${nome}: ${valores.total}*\n`;
        
        // Adicionar detalhes por função apenas se houver valores
        if (valores.encarregado > 0 || valores.motorista > 0 || valores.auxiliar > 0) {
            const detalhes = [];
            if (valores.encarregado > 0) detalhes.push(`E:${valores.encarregado}`);
            if (valores.motorista > 0) detalhes.push(`M:${valores.motorista}`);
            if (valores.auxiliar > 0) detalhes.push(`A:${valores.auxiliar}`);
            
            if (detalhes.length > 0) {
                texto += `(${detalhes.join(' ')})`;
            }
        }
        
        texto += '\n\n';
        
        totalGeral += valores.total;
        encarregadoTotal += valores.encarregado;
        motoristaTotal += valores.motorista;
        auxiliarTotal += valores.auxiliar;
    }
    
    // Adicionar resumo final
    texto += `📈 *RESUMO FINAL*\n`;
    
    // Mostrar apenas funções que têm valores > 0
    const resumoFuncoes = [];
    if (encarregadoTotal > 0) resumoFuncoes.push(`Encarregado: ${encarregadoTotal}`);
    if (motoristaTotal > 0) resumoFuncoes.push(`Motorista: ${motoristaTotal}`);
    if (auxiliarTotal > 0) resumoFuncoes.push(`Auxiliar: ${auxiliarTotal}`);
    
    if (resumoFuncoes.length > 0) {
        texto += `${resumoFuncoes.join(' | ')}\n`;
    }
    
    texto += `*TOTAL GERAL: ${totalGeral}*\n\n`;
    
    // Adicionar data e quantidade de operações
    texto += `📅 ${new Date().toLocaleDateString('pt-BR')}`;
    texto += ` | ${abas.length} ${abas.length === 1 ? 'operação' : 'operações'}`;
    
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
}

function limparDados() {
    if (!currentUser.mode) {
        alert('Escolha sua função primeiro!');
        return;
    }
    
    if (confirm('Limpar todos os dados desta operação?')) {
        const itensIniciais = criarItensPadrao();
        viaturaAtualRef.child(`abas/${abaAtualIndex}/itens`).set(itensIniciais);
    }
}

        viaturaAtualRef.child(currentUser.mode).update({ online: false });
    }
});
