<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, shrink-to-fit=no">
<title>Controle de Fiscalização - 4ª Cia PMRv</title>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #0a0a0a;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    color: #f0f0f0;
    padding: 10px;
    padding-top: 80px;
    min-height: 100vh;
}

/* Barra superior */
.top-bar {
    background: #1a1a1a;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #ffcc00;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    flex-wrap: wrap;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-text h1 {
    font-size: 1.1rem;
    font-weight: 700;
    color: #ffcc00;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    line-height: 1.2;
}

.logo-text span {
    font-size: 0.7rem;
    color: #cccccc;
    font-weight: 400;
    display: block;
}

/* BOTÕES DO TOPO */
.topo-botoes {
    display: flex;
    gap: 10px;
    z-index: 999;
    align-items: center;
}

.btn-topo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: none;
    font-size: 18px;
    color: #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: all 0.3s;
}

.btn-topo:hover {
    transform: scale(1.05);
}

.btn-topo.whats { 
    background: #25d366; 
}

.btn-topo.encerrar { 
    background: #c82333; 
}

/* Status de sincronização */
.status-sync {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 5px;
}

.status-sync.online {
    background: #4CAF50;
    box-shadow: 0 0 10px #4CAF50;
    animation: pulse-green 2s infinite;
}

.status-sync.offline {
    background: #f44336;
    box-shadow: 0 0 10px #f44336;
}

.status-sync.saving {
    background: #ffcc00;
    animation: pulse-yellow 1s infinite;
}

@keyframes pulse-green {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
}

@keyframes pulse-yellow {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
    100% { opacity: 1; transform: scale(1); }
}

/* título */
h2 {
    text-align: center;
    color: #ffcc00;
    font-size: 1.4rem;
    margin: 20px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* caixas */
.box, .item {
    background: #1a1a1a;
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
    border: 1px solid #2a2a2a;
}

.header {
    padding: 12px 15px;
    font-weight: 600;
    cursor: pointer;
    background: #1f1f1f;
    color: #ffcc00;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s;
    border-bottom: 1px solid #2a2a2a;
}

.header:hover {
    background: #2a2a2a;
}

.header .arrow {
    transition: transform 0.3s;
    font-size: 0.8rem;
}

.header.active .arrow {
    transform: rotate(90deg);
}

.conteudo {
    display: none;
    padding: 12px;
    background: #141414;
}

.linha {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 6px 0;
    border-bottom: 1px solid #1f1f1f;
}

.linha:last-child {
    border-bottom: none;
    margin-bottom: 0;
}

.linha span:first-child {
    color: #cccccc;
    font-size: 0.9rem;
}

.ctrl {
    display: flex;
    gap: 6px;
    align-items: center;
}

button {
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}

button:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

.add { 
    background: #ffcc00; 
    color: #000;
}

.menos { 
    background: #dc3545; 
}

.contador {
    min-width: 28px;
    text-align: center;
    font-weight: bold;
    color: #ffcc00;
    font-size: 1.1rem;
}

input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 1px solid #2a2a2a;
    background: #1a1a1a;
    color: #f0f0f0;
    font-size: 0.95rem;
    transition: all 0.2s;
}

input:focus {
    outline: none;
    border-color: #ffcc00;
    background: #222;
}

input::placeholder {
    color: #666;
}

.box input:last-child {
    margin-bottom: 0;
}

/* estilo dos artigos livres */
.item-edit .header {
    background: #1a1a1a;
    border-left: 3px solid #ffcc00;
}

/* Botões de ação */
.botoes-acao {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 15px 0;
    flex-wrap: wrap;
}

.btn-salvar-supabase {
    background: #ffcc00;
    color: #000;
    padding: 12px 25px;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
    flex: 1;
    min-width: 150px;
}

.btn-salvar-supabase:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
}

.btn-finalizar {
    background: #c82333;
    color: #fff;
    padding: 12px 25px;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
    flex: 1;
    min-width: 150px;
}

.btn-finalizar:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(200, 35, 51, 0.3);
}

/* scrollbar */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #0a0a0a;
}

::-webkit-scrollbar-thumb {
    background: #ffcc00;
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: #e6b800;
}

/* responsivo */
@media (max-width: 768px) {
    .top-bar {
        padding: 10px 15px;
    }
    
    .logo-text h1 {
        font-size: 0.9rem;
    }
    
    .logo-text span {
        font-size: 0.6rem;
    }
    
    .btn-topo {
        width: 40px;
        height: 40px;
        font-size: 16px;
    }
    
    h2 {
        font-size: 1.1rem;
        margin: 15px 0;
    }
    
    .botoes-acao {
        flex-direction: column;
    }
    
    .btn-salvar-supabase, .btn-finalizar {
        width: 100%;
    }
}
</style>
</head>
<body>

<!-- BARRA SUPERIOR -->
<header class="top-bar">
    <div class="logo-area">
        <div class="logo-text">
            <h1>4ª Cia Limeira</h1>
            <span>Policiamento Rodoviário</span>
        </div>
    </div>
    <div class="topo-botoes">
        <span class="status-sync offline" id="statusSync" title="Status da conexão"></span>
        <button class="btn-topo whats" onclick="enviarWhats()" title="Enviar WhatsApp">📤</button>
        <button class="btn-topo encerrar" onclick="encerrarTurno()" title="Finalizar Turno">⛔</button>
    </div>
</header>

<h2>Controle de Fiscalização</h2>

<!-- DADOS DA EQUIPE -->
<div class="box">
    <input id="encarregado" placeholder="Nome do Encarregado" onchange="salvarDados()">
    <input id="motorista" placeholder="Nome do Motorista" onchange="salvarDados()">
    <input id="auxiliar" placeholder="Nome do Auxiliar (opcional)" onchange="salvarDados()">
</div>

<div id="lista"></div>

<!-- Botões de ação -->
<div class="botoes-acao">
    <button class="btn-salvar-supabase" onclick="salvarNoSupabase()">
        💾 Salvar no Banco
    </button>
    <button class="btn-finalizar" onclick="finalizarFiscalizacao()">
        🏁 Finalizar Fiscalização
    </button>
</div>

<script>
// ===== CONFIGURAÇÃO SUPABASE (SUAS CREDENCIAIS) =====
const SUPABASE_URL = 'https://hgokcxjselfmwodbclvs.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhnb2tjeGpzZWxmbXdvZGJjbHZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMjAzNzksImV4cCI6MjA5ODY5NjM3OX0.WdEw6u4pKkmTlXlcP2NO8Jix-Z2kLHMdop0xFqlU5F8';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let fiscalizacaoId = null;
let dadosLocais = {};

// ===== LISTA FIXA =====
const itensFixos = [
 "AP Fiscalizado","CA Fiscalizado","OA Fiscalizado","MO Fiscalizado",
 "AI AP","AI CA","AI OA","AI MO",
 "AI Abordagem","AI Revelia",
 "ART. 167","ART. 168","ART. 252, VI / § ún.","ART. 203, V",
 "ART. 165","ART. 165-A","ART. 306",
 "Teste Ativo","Teste Passivo",
 "Pessoas abordadas","Pedestres abordados","Pedestres lançados no Google Forms",
 "Total ARV","Total ARD","Imagem Radar",
 "BO-e Com Vítima","BO-e Sem Vítima",
 "Vítimas Leves","Vítimas Graves","Vítimas Fatais",
 "Procurado Capturado","Flagrante","Presos",
 "BOPM ( exceto ART. 306 )"
];

const lista = document.getElementById("lista");
let itens = [];

// fixos
itensFixos.forEach((n,i)=>itens.push({id:"f"+i,nome:n,edit:false}));

// 8 livres
for(let i=1;i<=8;i++) itens.push({id:"l"+i,nome:"",edit:true});

// render
itens.forEach(it=>{
    const isEdit = it.edit;
    const headerClass = isEdit ? 'header item-edit' : 'header';
    
    lista.innerHTML += `
    <div class="item">
        <div class="${headerClass}" onclick="toggle('${it.id}')">
            <span>${isEdit ? '✏️ Artigo livre' : it.nome}</span>
            <span class="arrow">▶</span>
        </div>
        <div class="conteudo" id="c_${it.id}">
            ${isEdit ? `<input id="nome_${it.id}" placeholder="Digite o artigo" onchange="salvarDados()">` : ""}
            ${linha("Encarregado","e",it.id)}
            ${linha("Motorista","m",it.id)}
            ${linha("Auxiliar","a",it.id)}
        </div>
    </div>`;
});

function linha(t,p,id){
    return `
    <div class="linha">
        <span>${t}</span>
        <div class="ctrl">
            <button class="menos" onclick="alterar('${p}${id}',-1)">-</button>
            <span id="${p}${id}" class="contador">0</span>
            <button class="add" onclick="alterar('${p}${id}',1)">+</button>
        </div>
    </div>`;
}

function toggle(id){
    const el=document.getElementById("c_"+id);
    const header=el.closest('.item').querySelector('.header');
    
    if(el.style.display === "block") {
        el.style.display = "none";
        header.classList.remove('active');
    } else {
        el.style.display = "block";
        header.classList.add('active');
    }
}

// ===== FUNÇÕES DE SALVAMENTO =====

// Salvar localmente
function salvarDados(){
    const d={enc:encarregado.value,mot:motorista.value,aux:auxiliar.value,n:{},c:{}};
    itens.forEach(it=>{
        if(it.edit){
            let n=document.getElementById("nome_"+it.id);
            if(n) d.n[it.id]=n.value;
        }
        ["e","m","a"].forEach(p=>{
            const el = document.getElementById(p+it.id);
            if(el) d.c[p+it.id]=el.innerText;
        });
    });
    localStorage.setItem("controleFiscalizacao",JSON.stringify(d));
    dadosLocais = d;
}

function carregarDados(){
    const d=JSON.parse(localStorage.getItem("controleFiscalizacao"));
    if(!d) return;
    
    encarregado.value=d.enc || '';
    motorista.value=d.mot || '';
    auxiliar.value=d.aux || '';

    for(let k in d.n){
        let e=document.getElementById("nome_"+k);
        if(e)e.value=d.n[k];
    }
    for(let k in d.c){
        let e=document.getElementById(k);
        if(e)e.innerText=d.c[k];
    }
    dadosLocais = d;
}

// ===== FUNÇÕES SUPABASE =====

// Atualizar status de conexão
function atualizarStatus(status) {
    const el = document.getElementById('statusSync');
    el.className = 'status-sync ' + status;
}

// Verificar conexão com Supabase
async function verificarConexao() {
    try {
        const { data, error } = await supabase.from('fiscalizacoes').select('count', { count: 'exact', head: true });
        if (error) throw error;
        atualizarStatus('online');
        return true;
    } catch (e) {
        atualizarStatus('offline');
        console.log('Offline: ', e.message);
        return false;
    }
}

// Coletar dados atuais
function coletarDadosAtuais() {
    dadosLocais.enc = encarregado.value || '';
    dadosLocais.mot = motorista.value || '';
    dadosLocais.aux = auxiliar.value || '';
    
    itens.forEach(it => {
        if (it.edit) {
            const el = document.getElementById("nome_"+it.id);
            if (el) dadosLocais.n[it.id] = el.value || '';
        }
        ['e','m','a'].forEach(p => {
            const el = document.getElementById(p+it.id);
            if (el) dadosLocais.c[p+it.id] = el.innerText || '0';
        });
    });
}

// Salvar no Supabase
async function salvarNoSupabase() {
    const online = await verificarConexao();
    if (!online) {
        alert('⚠️ Sem conexão com o banco de dados. Os dados serão salvos localmente e sincronizados quando a conexão for restabelecida.');
        salvarDados();
        return;
    }

    try {
        atualizarStatus('saving');
        
        // Coleta dados atuais
        coletarDadosAtuais();
        
        // Se não tem ID, cria nova fiscalização
        if (!fiscalizacaoId) {
            // Verifica se já existe uma ativa
            const { data: ativa, error: errAtiva } = await supabase
                .from('fiscalizacoes')
                .select('id')
                .eq('status', 'ativo')
                .limit(1);
            
            if (ativa && ativa.length > 0) {
                fiscalizacaoId = ativa[0].id;
            } else {
                // Cria nova
                const { data: nova, error: errNova } = await supabase
                    .from('fiscalizacoes')
                    .insert({
                        encarregado: dadosLocais.enc || '',
                        motorista: dadosLocais.mot || '',
                        auxiliar: dadosLocais.aux || '',
                        status: 'ativo'
                    })
                    .select()
                    .single();
                
                if (errNova) throw errNova;
                fiscalizacaoId = nova.id;
            }
        }
        
        // Atualiza a fiscalização
        await supabase
            .from('fiscalizacoes')
            .update({
                encarregado: dadosLocais.enc || '',
                motorista: dadosLocais.mot || '',
                auxiliar: dadosLocais.aux || ''
            })
            .eq('id', fiscalizacaoId);
        
        // Remove itens antigos
        await supabase
            .from('itens_fiscalizacao')
            .delete()
            .eq('fiscalizacao_id', fiscalizacaoId);
        
        // Insere novos itens
        const itensParaSalvar = [];
        itens.forEach((it, index) => {
            const nome = it.edit ? 
                document.getElementById("nome_"+it.id)?.value || `Artigo ${index+1}` :
                it.nome;
            
            const enc = parseInt(document.getElementById("e"+it.id)?.innerText) || 0;
            const mot = parseInt(document.getElementById("m"+it.id)?.innerText) || 0;
            const aux = parseInt(document.getElementById("a"+it.id)?.innerText) || 0;
            
            if (enc + mot + aux > 0) {
                itensParaSalvar.push({
                    fiscalizacao_id: fiscalizacaoId,
                    nome_item: nome,
                    tipo_item: it.edit ? 'livre' : 'fixo',
                    encarregado_valor: enc,
                    motorista_valor: mot,
                    auxiliar_valor: aux,
                    ordem: index
                });
            }
        });
        
        if (itensParaSalvar.length > 0) {
            const { error: errItens } = await supabase
                .from('itens_fiscalizacao')
                .insert(itensParaSalvar);
            
            if (errItens) throw errItens;
        }
        
        atualizarStatus('online');
        alert('✅ Dados salvos com sucesso no banco de dados!');
        
        // Salva também localmente
        salvarDados();
        
    } catch (error) {
        console.error('Erro ao salvar:', error);
        atualizarStatus('offline');
        alert('❌ Erro ao salvar: ' + error.message);
    }
}

// Finalizar fiscalização
async function finalizarFiscalizacao() {
    if (!fiscalizacaoId) {
        alert('Salve os dados primeiro!');
        return;
    }
    
    if (confirm('Confirmar finalização da fiscalização atual?')) {
        try {
            await supabase
                .from('fiscalizacoes')
                .update({ status: 'finalizado' })
                .eq('id', fiscalizacaoId);
            
            fiscalizacaoId = null;
            alert('✅ Fiscalização finalizada com sucesso!');
            
            // Opção: limpar dados ou começar nova
            if (confirm('Deseja limpar os dados para uma nova fiscalização?')) {
                localStorage.removeItem('controleFiscalizacao');
                location.reload();
            }
            
        } catch (error) {
            alert('❌ Erro ao finalizar: ' + error.message);
        }
    }
}

// ===== FUNÇÕES EXISTENTES =====

function alterar(id,v){
    const el=document.getElementById(id);
    if(!el) return;
    let n=parseInt(el.innerText)+v;
    if(n<0)n=0;
    el.innerText=n;
    salvarDados();
}

function enviarWhats(){
    const enc = encarregado.value.trim();
    const mot = motorista.value.trim();
    const aux = auxiliar.value.trim();
    
    let texto = "";
    if(enc) texto += `Encarregado: ${enc}\n`;
    if(mot) texto += `Motorista: ${mot}\n`;
    if(aux) texto += `Auxiliar: ${aux}\n`;
    if(texto) texto += "\n";
    
    let temDados = false;
    
    itens.forEach(it=>{
        let nome = it.edit ? document.getElementById("nome_"+it.id)?.value?.trim() : it.nome;
        if(!nome) return;
        
        const e = parseInt(document.getElementById("e"+it.id)?.innerText) || 0;
        const m = parseInt(document.getElementById("m"+it.id)?.innerText) || 0;
        const a = parseInt(document.getElementById("a"+it.id)?.innerText) || 0;
        
        if(e + m + a === 0) return;
        
        temDados = true;
        texto += `${nome}\n`;
        if(e > 0) texto += `- Encarregado: ${e}\n`;
        if(m > 0) texto += `- Motorista: ${m}\n`;
        if(a > 0) texto += `- Auxiliar: ${a}\n`;
        texto += "\n";
    });

    if(!temDados && !enc && !mot && !aux){ 
        alert("Nada para enviar"); 
        return; 
    }
    
    texto = texto.trim();
    window.open("https://wa.me/?text="+encodeURIComponent(texto),"_blank");
}

function encerrarTurno(){
    if(confirm("Encerrar turno e apagar todos os dados?")){
        localStorage.removeItem("controleFiscalizacao");
        location.reload();
    }
}

// ===== INICIALIZAÇÃO =====

// Configurar listeners
["encarregado","motorista","auxiliar"].forEach(i=>{
    document.getElementById(i).addEventListener("input",salvarDados);
});

// Carregar dados e verificar conexão
window.onload = async function() {
    carregarDados();
    await verificarConexao();
    
    // Tenta carregar fiscalização ativa
    try {
        const { data, error } = await supabase
            .from('fiscalizacoes')
            .select('id')
            .eq('status', 'ativo')
            .limit(1);
        
        if (data && data.length > 0) {
            fiscalizacaoId = data[0].id;
        }
    } catch (e) {
        console.log('Erro ao buscar fiscalização:', e);
    }
    
    // Verifica conexão a cada 30 segundos
    setInterval(verificarConexao, 30000);
};
</script>

</body>
</html>
