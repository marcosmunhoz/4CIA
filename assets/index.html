<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Fiscalização</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    height: 100vh;
    overflow: hidden;
}

/* Container principal */
.container {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Abas no topo */
.abas-container {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #f1f1f1;
    padding: 10px 10px 0 10px;
    z-index: 1000;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.abas {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding-bottom: 5px;
}

.aba {
    padding: 12px 20px;
    background: #fff;
    border-radius: 8px 8px 0 0;
    border: 1px solid #ddd;
    border-bottom: none;
    cursor: pointer;
    white-space: nowrap;
    min-width: 120px;
    text-align: center;
    font-weight: bold;
    position: relative;
    transition: all 0.3s ease;
}

.aba:hover {
    background: #f8f8f8;
}

.aba.ativa {
    background: #fff;
    border-color: #ccc;
    z-index: 10;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.aba-fechar {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ff6b6b;
    color: white;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
}

.aba:hover .aba-fechar {
    opacity: 1;
}

.aba-fechar:hover {
    background: #ff4757;
}

/* Área de conteúdo */
.conteudo-container {
    margin-top: 70px; /* Espaço para as abas */
    height: calc(100vh - 70px);
    overflow-y: auto;
    padding: 10px;
}

.operacao-content {
    display: none;
    background: #fff;
    border-radius: 8px;
    padding: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    height: 100%;
    overflow-y: auto;
}

.operacao-content.ativa {
    display: block;
}

/* Cabeçalho da operação */
.operacao-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid #007bff;
}

.operacao-titulo {
    font-size: 24px;
    font-weight: bold;
    color: #333;
}

.operacao-botoes {
    display: flex;
    gap: 10px;
}

/* Botões */
.btn {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-whats {
    background: #25d366;
}

.btn-whats:hover {
    background: #1da851;
}

.btn-encerrar {
    background: #c82333;
}

.btn-encerrar:hover {
    background: #a71d2a;
}

.btn-somar {
    background: #17a2b8;
}

.btn-somar:hover {
    background: #138496;
}

.btn-add {
    background: #28a745;
}

.btn-add:hover {
    background: #218838;
}

/* Campos de equipe */
.equipe-box {
    background: #f8f9fa;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 20px;
    border: 1px solid #dee2e6;
}

.equipe-box input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: 1px solid #ced4da;
    font-size: 16px;
}

.equipe-box input:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
}

/* Itens de fiscalização */
.itens-container {
    margin-top: 20px;
}

.item {
    background: #fff;
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
    border: 1px solid #dee2e6;
}

.item-header {
    padding: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #e9ecef;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.3s ease;
}

.item-header:hover {
    background: #dee2e6;
}

.item-conteudo {
    padding: 15px;
    border-top: 1px solid #dee2e6;
}

.linha {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding: 10px;
    background: #f8f9fa;
    border-radius: 6px;
}

.ctrl {
    display: flex;
    gap: 10px;
    align-items: center;
}

.btn-ctrl {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-add-ctrl {
    background: #007bff;
}

.btn-add-ctrl:hover {
    background: #0056b3;
}

.btn-menos-ctrl {
    background: #dc3545;
}

.btn-menos-ctrl:hover {
    background: #c82333;
}

.contador {
    min-width: 40px;
    text-align: center;
    font-weight: bold;
    font-size: 18px;
}

.item-total {
    background: #6c757d;
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
}

/* Input para artigos livres */
.input-artigo {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 2px solid #007bff;
    font-size: 16px;
    font-weight: bold;
}

.input-artigo:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
}

/* Barra superior */
.top-bar {
    position: fixed;
    top: 70px;
    right: 20px;
    z-index: 999;
    display: flex;
    gap: 10px;
}

/* Botão Nova Operação */
.btn-nova-operacao {
    background: #28a745;
    color: white;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
}

.btn-nova-operacao:hover {
    background: #218838;
    transform: scale(1.1);
}

/* Responsividade */
@media (max-width: 768px) {
    .aba {
        min-width: 100px;
        padding: 10px 15px;
        font-size: 14px;
    }
    
    .operacao-header {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
    }
    
    .operacao-botoes {
        width: 100%;
        justify-content: space-between;
    }
}
</style>
</head>

<body>

<div class="container">
    <!-- Abas das operações -->
    <div class="abas-container">
        <div class="abas" id="abas"></div>
    </div>
    
    <!-- Barra superior com botões -->
    <div class="top-bar">
        <button class="btn-nova-operacao" onclick="novaOperacao()" title="Nova Operação">+</button>
        <button class="btn btn-somar" onclick="enviarTudoWhats()" title="Enviar Todas as Operações">📊 Todos</button>
    </div>
    
    <!-- Área de conteúdo -->
    <div class="conteudo-container" id="conteudoContainer">
        <!-- As operações serão inseridas aqui via JavaScript -->
    </div>
</div>

<script>
// ===== CONFIGURAÇÃO =====
const ITENS_FIXOS = [
    "AP Fiscalizado","CA Fiscalizado","OA Fiscalizado","MO Fiscalizado",
    "AI AP","AI CA","AI OA","AI MO",
    "AI Abordagem","AI Revelia",
    "ART. 167","ART. 168","ART. 252, VI / § ún.","ART. 203, V",
    "ART. 165","ART. 165-A","ART. 306",
    "Teste Ativo","Teste Passivo",
    "Pessoas abordadas","Pedestres abordados","Pedestres lançados no Google Forms",
    "Total ARV","Total ARD","Imagem Radar",
    "BO-e Com Vítima","BO-e Sem Vítima",
    "Vítimas Leves","Vítimas Graves","Vítimas Fatais",
    "Procurado Capturado","Flagrante","Presos",
    "BOPM ( exceto ART. 306 )"
];

const NUM_OPERACOES_PADRAO = 6;
let operacoes = [];
let operacaoAtiva = 0;

// ===== FUNÇÕES DE INICIALIZAÇÃO =====
function inicializarSistema() {
    // Carregar operações salvas ou criar padrão
    const operacoesSalvas = localStorage.getItem('controleFiscalizacao_operacoes');
    
    if (operacoesSalvas) {
        operacoes = JSON.parse(operacoesSalvas);
    } else {
        // Criar operações padrão
        for (let i = 1; i <= NUM_OPERACOES_PADRAO; i++) {
            operacoes.push({
                id: i,
                nome: `Operação ${i}`,
                encarregado: '',
                motorista: '',
                auxiliar: '',
                itens: criarItensPadrao(),
                ativa: i === 1
            });
        }
    }
    
    renderizarAbas();
    renderizarConteudo();
    salvarOperacoes();
}

function criarItensPadrao() {
    const itens = [];
    
    // Itens fixos
    ITENS_FIXOS.forEach((nome, i) => {
        itens.push({
            id: `f${i}`,
            tipo: 'fixo',
            nome: nome,
            encarregado: 0,
            motorista: 0,
            auxiliar: 0
        });
    });
    
    // 8 itens livres
    for (let i = 1; i <= 8; i++) {
        itens.push({
            id: `l${i}`,
            tipo: 'livre',
            nome: '',
            encarregado: 0,
            motorista: 0,
            auxiliar: 0
        });
    }
    
    return itens;
}

// ===== FUNÇÕES DE RENDERIZAÇÃO =====
function renderizarAbas() {
    const abasContainer = document.getElementById('abas');
    abasContainer.innerHTML = '';
    
    operacoes.forEach((op, index) => {
        const aba = document.createElement('div');
        aba.className = `aba ${op.ativa ? 'ativa' : ''}`;
        aba.innerHTML = `
            ${op.nome}
            <div class="aba-fechar" onclick="fecharOperacao(${index}, event)">×</div>
        `;
        aba.onclick = () => trocarOperacao(index);
        abasContainer.appendChild(aba);
    });
}

function renderizarConteudo() {
    const conteudoContainer = document.getElementById('conteudoContainer');
    conteudoContainer.innerHTML = '';
    
    operacoes.forEach((op, index) => {
        const content = document.createElement('div');
        content.className = `operacao-content ${op.ativa ? 'ativa' : ''}`;
        content.id = `operacao-${index}`;
        content.innerHTML = criarHTMLOperacao(op, index);
        conteudoContainer.appendChild(content);
    });
}

function criarHTMLOperacao(op, index) {
    return `
        <div class="operacao-header">
            <div class="operacao-titulo">${op.nome}</div>
            <div class="operacao-botoes">
                <button class="btn btn-whats" onclick="enviarOperacaoWhats(${index})">📤 Enviar</button>
                <button class="btn btn-encerrar" onclick="encerrarOperacao(${index})">⛔ Limpar</button>
            </div>
        </div>
        
        <div class="equipe-box">
            <input type="text" id="encarregado-${index}" placeholder="Nome do Encarregado" 
                   value="${op.encarregado || ''}" 
                   oninput="atualizarEquipe(${index}, 'encarregado', this.value)">
            <input type="text" id="motorista-${index}" placeholder="Nome do Motorista" 
                   value="${op.motorista || ''}" 
                   oninput="atualizarEquipe(${index}, 'motorista', this.value)">
            <input type="text" id="auxiliar-${index}" placeholder="Nome do Auxiliar (opcional)" 
                   value="${op.auxiliar || ''}" 
                   oninput="atualizarEquipe(${index}, 'auxiliar', this.value)">
        </div>
        
        <div class="itens-container" id="itens-container-${index}">
            ${criarHTMLItens(op.itens, index)}
        </div>
    `;
}

function criarHTMLItens(itens, opIndex) {
    let html = '';
    
    itens.forEach(item => {
        const total = item.encarregado + item.motorista + item.auxiliar;
        const titulo = item.tipo === 'livre' ? (item.nome || '✏️ Artigo livre') : item.nome;
        
        html += `
            <div class="item">
                <div class="item-header" onclick="toggleItem(${opIndex}, '${item.id}')">
                    <span>${titulo}</span>
                    <span class="item-total">${total}</span>
                </div>
                <div class="item-conteudo" id="item-conteudo-${opIndex}-${item.id}" style="display: block;">
                    ${item.tipo === 'livre' ? `
                        <input type="text" class="input-artigo" 
                               placeholder="Digite o nome do artigo (ex: ART. 999)"
                               value="${item.nome || ''}"
                               oninput="atualizarNomeItem(${opIndex}, '${item.id}', this.value)">
                    ` : ''}
                    
                    ${criarHTMLControles(item, opIndex)}
                </div>
            </div>
        `;
    });
    
    return html;
}

function criarHTMLControles(item, opIndex) {
    return `
        <div class="linha">
            <span>Encarregado</span>
            <div class="ctrl">
                <button class="btn-ctrl btn-menos-ctrl" onclick="alterarContador(${opIndex}, '${item.id}', 'encarregado', -1)">-</button>
                <span class="contador" id="contador-e-${opIndex}-${item.id}">${item.encarregado}</span>
                <button class="btn-ctrl btn-add-ctrl" onclick="alterarContador(${opIndex}, '${item.id}', 'encarregado', 1)">+</button>
            </div>
        </div>
        
        <div class="linha">
            <span>Motorista</span>
            <div class="ctrl">
                <button class="btn-ctrl btn-menos-ctrl" onclick="alterarContador(${opIndex}, '${item.id}', 'motorista', -1)">-</button>
                <span class="contador" id="contador-m-${opIndex}-${item.id}">${item.motorista}</span>
                <button class="btn-ctrl btn-add-ctrl" onclick="alterarContador(${opIndex}, '${item.id}', 'motorista', 1)">+</button>
            </div>
        </div>
        
        <div class="linha">
            <span>Auxiliar</span>
            <div class="ctrl">
                <button class="btn-ctrl btn-menos-ctrl" onclick="alterarContador(${opIndex}, '${item.id}', 'auxiliar', -1)">-</button>
                <span class="contador" id="contador-a-${opIndex}-${item.id}">${item.auxiliar}</span>
                <button class="btn-ctrl btn-add-ctrl" onclick="alterarContador(${opIndex}, '${item.id}', 'auxiliar', 1)">+</button>
            </div>
        </div>
    `;
}

// ===== FUNÇÕES DE CONTROLE =====
function trocarOperacao(index) {
    operacoes.forEach((op, i) => {
        op.ativa = i === index;
    });
    
    operacaoAtiva = index;
    renderizarAbas();
    renderizarConteudo();
    salvarOperacoes();
}

function atualizarEquipe(opIndex, campo, valor) {
    operacoes[opIndex][campo] = valor;
    salvarOperacoes();
}

function atualizarNomeItem(opIndex, itemId, nome) {
    const item = operacoes[opIndex].itens.find(i => i.id === itemId);
    if (item) {
        item.nome = nome;
        // Atualizar título na interface
        const header = document.querySelector(`#item-conteudo-${opIndex}-${itemId}`).parentElement.querySelector('.item-header span:first-child');
        if (header) {
            header.textContent = nome || '✏️ Artigo livre';
        }
        salvarOperacoes();
        atualizarTotalItem(opIndex, itemId);
    }
}

function alterarContador(opIndex, itemId, campo, valor) {
    const item = operacoes[opIndex].itens.find(i => i.id === itemId);
    if (item) {
        item[campo] = Math.max(0, item[campo] + valor);
        
        // Atualizar na interface
        const contador = document.getElementById(`contador-${campo.charAt(0)}-${opIndex}-${itemId}`);
        if (contador) {
            contador.textContent = item[campo];
        }
        
        salvarOperacoes();
        atualizarTotalItem(opIndex, itemId);
    }
}

function atualizarTotalItem(opIndex, itemId) {
    const item = operacoes[opIndex].itens.find(i => i.id === itemId);
    if (item) {
        const total = item.encarregado + item.motorista + item.auxiliar;
        const totalElement = document.querySelector(`#item-conteudo-${opIndex}-${itemId}`).parentElement.querySelector('.item-total');
        if (totalElement) {
            totalElement.textContent = total;
        }
    }
}

function toggleItem(opIndex, itemId) {
    const conteudo = document.getElementById(`item-conteudo-${opIndex}-${itemId}`);
    if (conteudo) {
        conteudo.style.display = conteudo.style.display === 'none' ? 'block' : 'none';
    }
}

// ===== FUNÇÕES DE OPERAÇÕES =====
function novaOperacao() {
    const novoId = operacoes.length > 0 ? Math.max(...operacoes.map(op => op.id)) + 1 : 1;
    
    operacoes.push({
        id: novoId,
        nome: `Operação ${novoId}`,
        encarregado: '',
        motorista: '',
        auxiliar: '',
        itens: criarItensPadrao(),
        ativa: true
    });
    
    // Desativar outras operações
    operacoes.forEach((op, index) => {
        op.ativa = index === operacoes.length - 1;
    });
    
    renderizarAbas();
    renderizarConteudo();
    salvarOperacoes();
}

function fecharOperacao(index, event) {
    event.stopPropagation();
    
    if (operacoes.length <= 1) {
        alert('Não é possível fechar a última operação!');
        return;
    }
    
    if (confirm(`Deseja fechar ${operacoes[index].nome}?`)) {
        operacoes.splice(index, 1);
        
        // Se fechamos a operação ativa, ativar a primeira
        if (operacoes.length > 0 && !operacoes.some(op => op.ativa)) {
            operacoes[0].ativa = true;
        }
        
        renderizarAbas();
        renderizarConteudo();
        salvarOperacoes();
    }
}

function encerrarOperacao(index) {
    if (confirm('Deseja limpar todos os dados desta operação?')) {
        operacoes[index].encarregado = '';
        operacoes[index].motorista = '';
        operacoes[index].auxiliar = '';
        operacoes[index].itens = criarItensPadrao();
        
        renderizarConteudo();
        salvarOperacoes();
    }
}

// ===== FUNÇÕES DO WHATSAPP =====
function enviarOperacaoWhats(index) {
    const op = operacoes[index];
    const texto = gerarTextoOperacao(op);
    
    if (!texto) {
        alert('Nada para enviar nesta operação');
        return;
    }
    
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
}

function enviarTudoWhats() {
    const texto = gerarTextoCompleto();
    
    if (!texto) {
        alert('Nenhuma operação tem dados para enviar');
        return;
    }
    
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
}

function gerarTextoOperacao(op) {
    let texto = `*${op.nome}*\n\n`;
    
    const pessoas = [];
    if (op.encarregado.trim()) pessoas.push(`Encarregado: ${op.encarregado}`);
    if (op.motorista.trim()) pessoas.push(`Motorista: ${op.motorista}`);
    if (op.auxiliar.trim()) pessoas.push(`Auxiliar: ${op.auxiliar}`);
    
    if (pessoas.length > 0) {
        texto += pessoas.join(' | ') + '\n\n';
    } else {
        texto += 'Sem equipe definida\n\n';
    }
    
    let temDados = false;
    
    op.itens.forEach(item => {
        const nome = item.nome.trim();
        if (!nome && item.tipo === 'livre') return;
        
        const nomeFinal = item.tipo === 'livre' ? nome : item.nome;
        const total = item.encarregado + item.motorista + item.auxiliar;
        
        if (total > 0) {
            temDados = true;
            texto += `*${nomeFinal}*\n`;
            if (item.encarregado > 0) texto += `- Encarregado: ${item.encarregado}\n`;
            if (item.motorista > 0) texto += `- Motorista: ${item.motorista}\n`;
            if (item.auxiliar > 0) texto += `- Auxiliar: ${item.auxiliar}\n`;
            texto += '\n';
        }
    });
    
    return temDados ? texto : null;
}

function gerarTextoCompleto() {
    let texto = '*RELATÓRIO COMPLETO DE OPERAÇÕES*\n\n';
    let temAlgumaOperacao = false;
    
    operacoes.forEach(op => {
        const opTexto = gerarTextoOperacao(op);
        if (opTexto) {
            temAlgumaOperacao = true;
            texto += '════════════════════════════════════\n';
            texto += opTexto;
        }
    });
    
    if (!temAlgumaOperacao) return null;
    
    // Adicionar totais gerais
    texto += '════════════════════════════════════\n';
    texto += '*TOTAIS GERAIS*\n\n';
    
    const totais = {};
    
    operacoes.forEach(op => {
        op.itens.forEach(item => {
            const nome = item.tipo === 'livre' ? item.nome.trim() : item.nome;
            if (!nome && item.tipo === 'livre') return;
            
            if (!totais[nome]) {
                totais[nome] = { encarregado: 0, motorista: 0, auxiliar: 0 };
            }
            
            totais[nome].encarregado += item.encarregado;
            totais[nome].motorista += item.motorista;
            totais[nome].auxiliar += item.auxiliar;
        });
    });
    
    let temTotais = false;
    for (const [nome, dados] of Object.entries(totais)) {
        const total = dados.encarregado + dados.motorista + dados.auxiliar;
        if (total > 0) {
            temTotais = true;
            texto += `*${nome}*\n`;
            if (dados.encarregado > 0) texto += `- Encarregado: ${dados.encarregado}\n`;
            if (dados.motorista > 0) texto += `- Motorista: ${dados.motorista}\n`;
            if (dados.auxiliar > 0) texto += `- Auxiliar: ${dados.auxiliar}\n`;
            texto += '\n';
        }
    }
    
    if (!temTotais) {
        texto += 'Nenhum dado para totalizar\n';
    }
    
    return texto;
}

// ===== SALVAR E CARREGAR =====
function salvarOperacoes() {
    localStorage.setItem('controleFiscalizacao_operacoes', JSON.stringify(operacoes));
}

// ===== INICIALIZAÇÃO =====
window.onload = inicializarSistema;
</script>

</body>
</html>
