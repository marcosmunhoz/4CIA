<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Fiscalização</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    padding: 10px;
    padding-top: 100px;
}

h2 { text-align: center; }

/* topo */
.topo-botoes {
    position: fixed;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 10px;
    z-index: 999;
}

.btn-topo {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    color: #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    cursor: pointer;
}

.btn-topo.whats { background: #25d366; }
.btn-topo.encerrar { background: #c82333; }
.btn-topo.somar { background: #17a2b8; }

/* menu operações */
.menu-operacoes {
    position: fixed;
    top: 10px;
    left: 10px;
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    z-index: 999;
}

.menu-operacoes select {
    width: 120px;
    padding: 8px;
    border-radius: 4px;
    border: 1px solid #ccc;
}

/* caixas */
.box, .item {
    background: #fff;
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
}

.header {
    padding: 12px;
    font-weight: bold;
    cursor: pointer;
    background: #e9e9e9;
}

.conteudo {
    display: none;
    padding: 10px;
}

.linha {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.ctrl {
    display: flex;
    gap: 6px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
}

.add { background: #007bff; }
.menos { background: #dc3545; }

.contador {
    min-width: 22px;
    text-align: center;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 8px;
    margin-bottom: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.operacao-nome {
    text-align: center;
    font-size: 14px;
    color: #666;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<!-- MENU DE OPERAÇÕES -->
<div class="menu-operacoes">
    <select id="selecionarOperacao" onchange="trocarOperacao()">
        <option value="op1">Operação 1</option>
        <option value="op2">Operação 2</option>
        <option value="op3">Operação 3</option>
    </select>
</div>

<!-- BOTÕES DO TOPO -->
<div class="topo-botoes">
    <button class="btn-topo somar" onclick="enviarTudoWhats()" title="Enviar Tudo">📊</button>
    <button class="btn-topo whats" onclick="enviarWhats()" title="Enviar Esta Operação">📤</button>
    <button class="btn-topo encerrar" onclick="encerrarTurno()" title="Encerrar Turno">⛔</button>
</div>

<h2>Controle de Fiscalização</h2>
<div id="operacaoNome" class="operacao-nome">Operação 1</div>

<div class="box">
    <input id="encarregado" placeholder="Nome do Encarregado">
    <input id="motorista" placeholder="Nome do Motorista">
    <input id="auxiliar" placeholder="Nome do Auxiliar (opcional)">
</div>

<div id="lista"></div>

<script>
// ===== CONFIGURAÇÃO =====
const NUM_OPERACOES = 3;
const OPERACOES_PREFIX = "controleFiscalizacao_";

// ===== LISTA FIXA =====
const itensFixos = [
 "AP Fiscalizado","CA Fiscalizado","OA Fiscalizado","MO Fiscalizado",
 "AI AP","AI CA","AI OA","AI MO",
 "AI Abordagem","AI Revelia",
 "ART. 167","ART. 168","ART. 252, VI / § ún.","ART. 203, V",
 "ART. 165","ART. 165-A","ART. 306",
 "Teste Ativo","Teste Passivo",
 "Pessoas abordadas","Pedestres abordados","Pedestres lançados no Google Forms",
 "Total ARV","Total ARD","Imagem Radar",
 "BO-e Com Vítima","BO-e Sem Vítima",
 "Vítimas Leves","Vítimas Graves","Vítimas Fatais",
 "Procurado Capturado","Flagrante","Presos",
 "BOPM ( exceto ART. 306 )"
];

const lista = document.getElementById("lista");
let itens = [];
let operacaoAtual = "op1";

// Inicializar itens
function inicializarItens() {
    itens = [];
    
    // fixos
    itensFixos.forEach((n,i)=>itens.push({id:"f"+i,nome:n,edit:false}));
    
    // 8 livres
    for(let i=1;i<=8;i++) itens.push({id:"l"+i,nome:"",edit:true});
}

// Renderizar interface
function renderizar() {
    lista.innerHTML = "";
    
    itens.forEach(it=>{
        lista.innerHTML += `
        <div class="item">
            <div class="header" onclick="toggle('${it.id}')">
                ${it.edit ? "✏️ Artigo livre" : it.nome}
            </div>
            <div class="conteudo" id="c_${it.id}">
                ${it.edit ? `<input id="nome_${it.id}" placeholder="Digite o artigo">` : ""}
                ${linha("Encarregado","e",it.id)}
                ${linha("Motorista","m",it.id)}
                ${linha("Auxiliar","a",it.id)}
            </div>
        </div>`;
    });
}

function linha(t,p,id){
    return `
    <div class="linha">
        <span>${t}</span>
        <div class="ctrl">
            <button class="menos" onclick="alterar('${p}${id}',-1)">-</button>
            <span id="${p}${id}" class="contador">0</span>
            <button class="add" onclick="alterar('${p}${id}',1)">+</button>
        </div>
    </div>`;
}

function toggle(id){
    const el=document.getElementById("c_"+id);
    el.style.display = el.style.display==="block" ? "none" : "block";
}

// ===== GERENCIAMENTO DE OPERAÇÕES =====
function trocarOperacao() {
    salvarOperacaoAtual();
    operacaoAtual = document.getElementById("selecionarOperacao").value;
    document.getElementById("operacaoNome").textContent = 
        operacaoAtual === "op1" ? "Operação 1" : 
        operacaoAtual === "op2" ? "Operação 2" : "Operação 3";
    carregarOperacao();
}

function salvarOperacaoAtual() {
    const d = {
        enc: document.getElementById("encarregado").value,
        mot: document.getElementById("motorista").value,
        aux: document.getElementById("auxiliar").value,
        n: {},
        c: {}
    };
    
    itens.forEach(it=>{
        if(it.edit){
            let n = document.getElementById("nome_"+it.id);
            if(n) d.n[it.id] = n.value;
        }
        ["e","m","a"].forEach(p=>{
            d.c[p+it.id] = document.getElementById(p+it.id).innerText;
        });
    });
    
    localStorage.setItem(OPERACOES_PREFIX + operacaoAtual, JSON.stringify(d));
}

function carregarOperacao() {
    const d = JSON.parse(localStorage.getItem(OPERACOES_PREFIX + operacaoAtual));
    
    // Resetar valores
    document.getElementById("encarregado").value = "";
    document.getElementById("motorista").value = "";
    document.getElementById("auxiliar").value = "";
    
    // Resetar contadores
    itens.forEach(it=>{
        ["e","m","a"].forEach(p=>{
            document.getElementById(p+it.id).innerText = "0";
        });
        if(it.edit) {
            let nomeEl = document.getElementById("nome_"+it.id);
            if(nomeEl) nomeEl.value = "";
        }
    });
    
    // Carregar dados salvos
    if(!d) return;
    
    document.getElementById("encarregado").value = d.enc || "";
    document.getElementById("motorista").value = d.mot || "";
    document.getElementById("auxiliar").value = d.aux || "";
    
    for(let k in d.n){
        let e = document.getElementById("nome_"+k);
        if(e) e.value = d.n[k];
    }
    
    for(let k in d.c){
        let e = document.getElementById(k);
        if(e) e.innerText = d.c[k];
    }
}

function alterar(id,v){
    const el = document.getElementById(id);
    let n = parseInt(el.innerText) + v;
    if(n<0) n=0;
    el.innerText = n;
    salvarOperacaoAtual();
}

// ===== FUNÇÕES DO WHATSAPP =====
function gerarTextoOperacao(opNum) {
    const opKey = "op" + opNum;
    const dados = JSON.parse(localStorage.getItem(OPERACOES_PREFIX + opKey));
    if(!dados) return null;
    
    let texto = `Operação ${opNum}\n`;
    
    // Apenas mostra quem tem nome preenchido
    const pessoas = [];
    if(dados.enc) pessoas.push(`Encarregado: ${dados.enc}`);
    if(dados.mot) pessoas.push(`Motorista: ${dados.mot}`);
    if(dados.aux) pessoas.push(`Auxiliar: ${dados.aux}`);
    
    if(pessoas.length > 0) {
        texto += pessoas.join(" | ") + "\n\n";
    }
    
    // Recriar estrutura de itens para esta operação
    let itensOp = [];
    itensFixos.forEach((n,i)=>itensOp.push({id:"f"+i,nome:n,edit:false}));
    for(let i=1;i<=8;i++) itensOp.push({id:"l"+i,nome:"",edit:true});
    
    // Aplicar nomes dos itens livres
    for(let k in dados.n){
        let item = itensOp.find(it => it.id === k);
        if(item) item.nome = dados.n[k];
    }
    
    let temDados = false;
    
    itensOp.forEach(it=>{
        let nome = it.edit ? (it.nome || "") : it.nome;
        if(!nome) return;
        
        let e = +(dados.c["e"+it.id] || 0);
        let m = +(dados.c["m"+it.id] || 0);
        let a = +(dados.c["a"+it.id] || 0);
        
        if(e+m+a === 0) return;
        
        temDados = true;
        texto += `${nome}:\n`;
        if(e) texto += `- Encarregado: ${e}\n`;
        if(m) texto += `- Motorista: ${m}\n`;
        if(a) texto += `- Auxiliar: ${a}\n`;
        texto += "\n";
    });
    
    if(!temDados) return null;
    return texto;
}

function enviarWhats(){
    const texto = gerarTextoOperacao(operacaoAtual.charAt(2));
    
    if(!texto){
        alert("Nada para enviar nesta operação");
        return;
    }
    
    window.open("https://wa.me/?text="+encodeURIComponent(texto),"_blank");
}

function enviarTudoWhats(){
    let textoFinal = "RELATÓRIO COMPLETO DE OPERAÇÕES\n\n";
    let temDados = false;
    
    for(let i = 1; i <= NUM_OPERACOES; i++) {
        const opTexto = gerarTextoOperacao(i);
        if(opTexto) {
            temDados = true;
            textoFinal += "=".repeat(30) + "\n";
            textoFinal += opTexto + "\n";
        }
    }
    
    if(!temDados){
        alert("Nenhuma operação tem dados para enviar");
        return;
    }
    
    // Adicionar totais gerais
    textoFinal += "=".repeat(30) + "\n";
    textoFinal += "TOTAIS GERAIS\n\n";
    
    // Calcular totais
    const totais = {};
    
    for(let i = 1; i <= NUM_OPERACOES; i++) {
        const opKey = "op" + i;
        const dados = JSON.parse(localStorage.getItem(OPERACOES_PREFIX + opKey));
        if(!dados) continue;
        
        // Recriar estrutura de itens
        let itensOp = [];
        itensFixos.forEach((n,i)=>itensOp.push({id:"f"+i,nome:n,edit:false}));
        for(let j=1;j<=8;j++) itensOp.push({id:"l"+j,nome:"",edit:true}));
        
        // Aplicar nomes dos itens livres
        for(let k in dados.n){
            let item = itensOp.find(it => it.id === k);
            if(item) item.nome = dados.n[k];
        }
        
        itensOp.forEach(it=>{
            let nome = it.edit ? (it.nome || "") : it.nome;
            if(!nome) return;
            
            let e = +(dados.c["e"+it.id] || 0);
            let m = +(dados.c["m"+it.id] || 0);
            let a = +(dados.c["a"+it.id] || 0);
            let total = e + m + a;
            
            if(total > 0) {
                if(!totais[nome]) totais[nome] = {e:0, m:0, a:0};
                totais[nome].e += e;
                totais[nome].m += m;
                totais[nome].a += a;
            }
        });
    }
    
    // Adicionar totais ao texto
    for(let nome in totais){
        textoFinal += `${nome}:\n`;
        if(totais[nome].e) textoFinal += `- Encarregado: ${totais[nome].e}\n`;
        if(totais[nome].m) textoFinal += `- Motorista: ${totais[nome].m}\n`;
        if(totais[nome].a) textoFinal += `- Auxiliar: ${totais[nome].a}\n`;
        textoFinal += "\n";
    }
    
    window.open("https://wa.me/?text="+encodeURIComponent(textoFinal),"_blank");
}

// ===== ENCERRAR TURNO =====
function encerrarTurno(){
    if(confirm("Encerrar turno e apagar todos os dados de todas as operações?")){
        for(let i = 1; i <= NUM_OPERACOES; i++) {
            localStorage.removeItem(OPERACOES_PREFIX + "op" + i);
        }
        location.reload();
    }
}

// ===== INICIALIZAÇÃO =====
window.onload = function() {
    inicializarItens();
    renderizar();
    carregarOperacao();
    
    // Adicionar listeners para salvar automaticamente
    ["encarregado","motorista","auxiliar"].forEach(id=>{
        document.getElementById(id).addEventListener("input", salvarOperacaoAtual);
    });
    
    // Adicionar listeners para os inputs de artigos livres
    setTimeout(() => {
        itens.forEach(it=>{
            if(it.edit){
                let nomeEl = document.getElementById("nome_"+it.id);
                if(nomeEl){
                    nomeEl.addEventListener("input", salvarOperacaoAtual);
                }
            }
        });
    }, 100);
};
</script>

</body>
</html>
