<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Fiscalização</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    padding: 10px;
    padding-top: 80px;
}

h2 { text-align: center; }

/* topo */
.topo-botoes {
    position: fixed;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 10px;
    z-index: 999;
}

.btn-topo {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    color: #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}

.btn-topo.whats { background: #25d366; }
.btn-topo.encerrar { background: #c82333; }

/* caixas */
.box, .item {
    background: #fff;
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
}

.header {
    padding: 12px;
    font-weight: bold;
    cursor: pointer;
    background: #e9e9e9;
}

.conteudo {
    display: none;
    padding: 10px;
}

.linha {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.ctrl {
    display: flex;
    gap: 6px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    color: #fff;
    font-size: 15px;
}

.add { background: #007bff; }
.menos { background: #dc3545; }

.contador {
    min-width: 22px;
    text-align: center;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 8px;
    margin-bottom: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<!-- BOTÕES DO TOPO -->
<div class="topo-botoes">
    <button class="btn-topo whats" onclick="enviarWhats()" title="Enviar WhatsApp">📤</button>
    <button class="btn-topo encerrar" onclick="encerrarTurno()" title="Encerrar Turno">⛔</button>
</div>

<h2>Controle de Fiscalização</h2>

<div class="box">
    <input id="encarregado" placeholder="Nome do Encarregado">
    <input id="motorista" placeholder="Nome do Motorista">
    <input id="auxiliar" placeholder="Nome do Auxiliar">
</div>

<div id="lista"></div>

<script>
// ===== LISTA FIXA =====
const itensFixos = [
 "AP Fiscalizado","CA Fiscalizado","OA Fiscalizado","MO Fiscalizado",
 "AI AP","AI CA","AI OA","AI MO",
 "AI Abordagem","AI Revelia",
 "ART. 167","ART. 168","ART. 252, VI / § ún.","ART. 203, V",
 "ART. 165","ART. 165-A","ART. 306",
 "Teste Ativo","Teste Passivo",
 "Pessoas abordadas","Pedestres abordados","Pedestres lançados no Google Forms",
 "Total ARV","Total ARD","Imagem Radar",
 "BO-e Com Vítima","BO-e Sem Vítima",
 "Vítimas Leves","Vítimas Graves","Vítimas Fatais",
 "Procurado Capturado","Flagrante","Presos",
 "BOPM ( exceto ART. 306 )"
];

const lista = document.getElementById("lista");
let itens = [];

// fixos
itensFixos.forEach((n,i)=>itens.push({id:"f"+i,nome:n,edit:false}));

// 8 livres
for(let i=1;i<=8;i++) itens.push({id:"l"+i,nome:"",edit:true});

// render
itens.forEach(it=>{
    lista.innerHTML += `
    <div class="item">
        <div class="header" onclick="toggle('${it.id}')">
            ${it.edit ? "✏️ Artigo livre" : it.nome}
        </div>
        <div class="conteudo" id="c_${it.id}">
            ${it.edit ? `<input id="nome_${it.id}" placeholder="Digite o artigo">` : ""}
            ${linha("Encarregado","e",it.id)}
            ${linha("Motorista","m",it.id)}
            ${linha("Auxiliar","a",it.id)}
        </div>
    </div>`;
});

function linha(t,p,id){
    return `
    <div class="linha">
        <span>${t}</span>
        <div class="ctrl">
            <button class="menos" onclick="alterar('${p}${id}',-1)">-</button>
            <span id="${p}${id}" class="contador">0</span>
            <button class="add" onclick="alterar('${p}${id}',1)">+</button>
        </div>
    </div>`;
}

function toggle(id){
    const el=document.getElementById("c_"+id);
    el.style.display = el.style.display==="block" ? "none" : "block";
}

// salvar / carregar
function salvar(){
    const d={enc:encarregado.value,mot:motorista.value,aux:auxiliar.value,n:{},c:{}};
    itens.forEach(it=>{
        if(it.edit){
            let n=document.getElementById("nome_"+it.id);
            if(n) d.n[it.id]=n.value;
        }
        ["e","m","a"].forEach(p=>{
            d.c[p+it.id]=document.getElementById(p+it.id).innerText;
        });
    });
    localStorage.setItem("controleFiscalizacao",JSON.stringify(d));
}

function carregar(){
    const d=JSON.parse(localStorage.getItem("controleFiscalizacao"));
    if(!d) return;
    encarregado.value=d.enc;
    motorista.value=d.mot;
    auxiliar.value=d.aux;

    for(let k in d.n){
        let e=document.getElementById("nome_"+k);
        if(e)e.value=d.n[k];
    }
    for(let k in d.c){
        let e=document.getElementById(k);
        if(e)e.innerText=d.c[k];
    }
}

function alterar(id,v){
    const el=document.getElementById(id);
    let n=parseInt(el.innerText)+v;
    if(n<0)n=0;
    el.innerText=n;
    salvar();
}

["encarregado","motorista","auxiliar"].forEach(i=>{
    document.getElementById(i).addEventListener("input",salvar);
});

window.onload=carregar;

// WhatsApp
function enviarWhats(){
    let texto=`📋 *Fiscalização*\n\n`;
    texto+=`👷 Encarregado: ${encarregado.value||"-"}\n`;
    texto+=`🚚 Motorista: ${motorista.value||"-"}\n`;
    texto+=`👥 Auxiliar: ${auxiliar.value||"-"}\n\n`;

    let tem=false;
    itens.forEach(it=>{
        let nome=it.edit?document.getElementById("nome_"+it.id).value:it.nome;
        if(!nome) return;
        let e=+document.getElementById("e"+it.id).innerText;
        let m=+document.getElementById("m"+it.id).innerText;
        let a=+document.getElementById("a"+it.id).innerText;
        if(e+m+a===0) return;

        tem=true;
        texto+=`*${nome}*\n`;
        if(e) texto+=`- Encarregado: ${e}\n`;
        if(m) texto+=`- Motorista: ${m}\n`;
        if(a) texto+=`- Auxiliar: ${a}\n`;
        texto+="\n";
    });

    if(!tem){ alert("Nada para enviar"); return; }
    window.open("https://wa.me/?text="+encodeURIComponent(texto),"_blank");
}

// Encerrar turno
function encerrarTurno(){
    if(confirm("Encerrar turno e apagar todos os dados?")){
        localStorage.removeItem("controleFiscalizacao");
        location.reload();
    }
}
</script>

</body>
</html>
