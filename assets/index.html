<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Fiscalização por Viatura</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; padding: 20px; }

.container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }

/* Tela de seleção de viatura */
.viatura-selection { padding: 40px; text-align: center; }
.viatura-selection h1 { color: #2c3e50; margin-bottom: 30px; font-size: 28px; }

.viaturas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 30px 0; }

.viatura-card { background: #f8f9fa; border-radius: 10px; padding: 25px; cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent; text-align: center; }
.viatura-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-color: #3498db; }
.viatura-card.ativa { border-color: #2ecc71; background: linear-gradient(135deg, #f8f9fa 0%, #e8f4fc 100%); }

.viatura-icon { font-size: 40px; margin-bottom: 15px; }
.viatura-nome { font-size: 22px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
.viatura-info { color: #7f8c8d; font-size: 14px; margin-bottom: 15px; }
.viatura-status { display: inline-flex; align-items: center; gap: 8px; padding: 5px 15px; border-radius: 20px; font-size: 12px; }
.status-online { background: rgba(46, 204, 113, 0.2); color: #27ae60; }
.status-offline { background: rgba(231, 76, 60, 0.2); color: #c0392b; }

.btn-nova-viatura { background: #3498db; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; display: inline-flex; align-items: center; gap: 10px; }

/* Interface da viatura */
.viatura-interface { display: none; padding: 20px; }

.viatura-header { background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }

.viatura-info-bar { display: flex; gap: 20px; align-items: center; }
.viatura-titulo { font-size: 24px; font-weight: bold; }
.viatura-id { background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; font-size: 14px; }

.btn-voltar { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; }

/* Equipe */
.equipe-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 30px; }
.equipe-card { background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #dee2e6; }
.equipe-card.ativo { border-color: #3498db; background: #e8f4fc; }
.equipe-card h3 { color: #2c3e50; margin-bottom: 10px; font-size: 16px; }
.equipe-nome { font-size: 18px; font-weight: bold; color: #3498db; padding: 10px; background: white; border-radius: 5px; }

/* Itens */
.itens-container { max-height: 500px; overflow-y: auto; padding-right: 10px; }
.item { background: white; border: 2px solid #dee2e6; border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
.item-header { padding: 15px; background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #2c3e50; }
.item-total { background: #3498db; color: white; padding: 5px 12px; border-radius: 20px; font-size: 14px; }
.item-conteudo { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; border-top: 1px solid #dee2e6; }

.contador-section { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; }
.contador-box { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 10px 0; }
.contador-btn { width: 40px; height: 40px; border: none; border-radius: 50%; color: white; font-size: 20px; cursor: pointer; }
.btn-menos { background: #e74c3c; }
.btn-add { background: #2ecc71; }
.contador-valor { font-size: 28px; font-weight: bold; color: #2c3e50; min-width: 50px; }

/* Botões de ação */
.actions { display: flex; gap: 15px; justify-content: center; margin-top: 30px; padding-top: 20px; border-top: 2px solid #dee2e6; }
.action-btn { padding: 12px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; }

.btn-whatsapp { background: #25d366; color: white; }
.btn-limpar { background: #e74c3c; color: white; }

/* Modal nova viatura */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
.modal-content { background: white; padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; }

/* Responsivo */
@media (max-width: 768px) {
    .viaturas-grid { grid-template-columns: 1fr; }
    .viatura-header { flex-direction: column; gap: 15px; text-align: center; }
    .item-conteudo { grid-template-columns: 1fr; }
    .actions { flex-direction: column; }
    .action-btn { width: 100%; justify-content: center; }
}
</style>
</head>

<body>

<div class="container">
    <!-- TELA 1: Seleção de Viatura -->
    <div class="viatura-selection" id="viaturaSelection">
        <h1>🚔 SISTEMA DE FISCALIZAÇÃO</h1>
        <p style="color: #666; margin-bottom: 30px;">Selecione sua viatura para começar</p>
        
        <div class="viaturas-grid" id="viaturasList">
            <!-- Viaturas serão carregadas aqui -->
        </div>
        
        <button class="btn-nova-viatura" onclick="mostrarModalNovaViatura()">
            <span style="font-size: 20px;">+</span> Nova Viatura
        </button>
    </div>

    <!-- TELA 2: Interface da Viatura Selecionada -->
    <div class="viatura-interface" id="viaturaInterface">
        <div class="viatura-header">
            <div class="viatura-info-bar">
                <div class="viatura-titulo" id="viaturaTitulo">Viatura X</div>
                <div class="viatura-id" id="viaturaId">ID: VIATURA_X_001</div>
                <div class="connection-status">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <span id="statusText">Conectado</span>
                </div>
            </div>
            <button class="btn-voltar" onclick="voltarParaSelecao()">← Voltar</button>
        </div>

        <!-- Seletor de função -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px; justify-content: center;">
            <button class="mode-btn encarregado ativo" onclick="setAccessMode('encarregado')" style="padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer;">
                👮‍♂️ Encarregado
            </button>
            <button class="mode-btn motorista" onclick="setAccessMode('motorista')" style="padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 6px; cursor: pointer;">
                🚚 Motorista
            </button>
            <button class="mode-btn auxiliar" onclick="setAccessMode('auxiliar')" style="padding: 10px 20px; background: #f39c12; color: white; border: none; border-radius: 6px; cursor: pointer;">
                👥 Auxiliar
            </button>
        </div>

        <!-- Equipe -->
        <div class="equipe-container" id="equipeContainer">
            <!-- Dados da equipe serão carregados aqui -->
        </div>

        <!-- Itens -->
        <div class="itens-container" id="itensContainer">
            <h2 style="text-align: center; margin-bottom: 20px; color: #2c3e50;">📊 Controle de Produtividade</h2>
            <div id="itensList"></div>
        </div>

        <!-- Botões de ação -->
        <div class="actions">
            <button class="action-btn btn-whatsapp" onclick="enviarWhatsApp()">
                📤 Enviar WhatsApp
            </button>
            <button class="action-btn btn-limpar" onclick="limparDados()">
                🗑️ Limpar Dados
            </button>
        </div>
    </div>
</div>

<!-- Modal Nova Viatura -->
<div class="modal" id="modalNovaViatura">
    <div class="modal-content">
        <h2 style="color: #2c3e50; margin-bottom: 20px; text-align: center;">Nova Viatura</h2>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; color: #666;">Nome da Viatura:</label>
            <input type="text" id="novaViaturaNome" placeholder="Ex: Viatura X, RP-01, etc" 
                   style="width: 100%; padding: 12px; border: 2px solid #3498db; border-radius: 6px; font-size: 16px;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; color: #666;">ID Único:</label>
            <input type="text" id="novaViaturaId" placeholder="Ex: VIATURA_X_001" 
                   style="width: 100%; padding: 12px; border: 2px solid #3498db; border-radius: 6px; font-size: 16px;">
            <small style="color: #999; font-size: 12px;">Use o mesmo ID em todos os dispositivos da mesma viatura</small>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 30px;">
            <button onclick="fecharModalNovaViatura()" style="flex: 1; padding: 12px; background: #95a5a6; color: white; border: none; border-radius: 6px; cursor: pointer;">
                Cancelar
            </button>
            <button onclick="criarNovaViatura()" style="flex: 1; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
                Criar Viatura
            </button>
        </div>
    </div>
</div>

<script>
// ===== CONFIGURAÇÃO FIREBASE =====
// ⚠️ COLE SUAS CREDENCIAIS AQUI! ⚠️
const firebaseConfig = {
    apiKey: "AIzaSyC7u9yPMqkswESx3jJh4I4fCUS8tiu-MjM",
    authDomain: "rodoviariolimeira.firebaseapp.com",
    databaseURL: "https://rodoviariolimeira-default-rtdb.firebaseio.com",
    projectId: "rodoviariolimeira",
    storageBucket: "rodoviariolimeira.firebasestorage.app",
    messagingSenderId: "131653476917",
    appId: "1:131653476917:web:3758f0247b5be006c9077c",
    measurementId: "G-0CJ7FD2MN2"
};

// ===== VARIÁVEIS GLOBAIS =====
let db;
let viaturaAtualRef;
let currentViatura = null;
let currentUser = { mode: 'encarregado', name: '' };
let todasViaturas = [];

const ITENS_FIXOS = [
    "AP Fiscalizado","CA Fiscalizado","OA Fiscalizado","MO Fiscalizado",
    "AI AP","AI CA","AI OA","AI MO","AI Abordagem","AI Revelia",
    "ART. 167","ART. 168","ART. 252, VI / § ún.","ART. 203, V",
    "ART. 165","ART. 165-A","ART. 306","Teste Ativo","Teste Passivo",
    "Pessoas abordadas","Pedestres abordados","Pedestres lançados no Google Forms",
    "Total ARV","Total ARD","Imagem Radar","BO-e Com Vítima","BO-e Sem Vítima",
    "Vítimas Leves","Vítimas Graves","Vítimas Fatais","Procurado Capturado",
    "Flagrante","Presos","BOPM ( exceto ART. 306 )"
];

// ===== INICIALIZAÇÃO =====
function initApp() {
    try {
        // Inicializar Firebase com SUAS credenciais
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        
        console.log('Firebase conectado com sucesso!');
        console.log('Projeto:', firebaseConfig.projectId);
        
        carregarListaViaturas();
        
        // Verificar se tem viatura na URL
        const urlParams = new URLSearchParams(window.location.search);
        const viaturaId = urlParams.get('viatura');
        if (viaturaId) {
            acessarViatura(viaturaId);
        }
    } catch (error) {
        console.error('Erro ao conectar com Firebase:', error);
        alert('Erro na conexão. Verifique o console (F12) para detalhes.');
    }
}

// ===== GERENCIAMENTO DE VIATURAS =====
function carregarListaViaturas() {
    if (!db) {
        console.error('Banco de dados não inicializado');
        return;
    }
    
    db.ref('viaturas').on('value', (snapshot) => {
        todasViaturas = [];
        const viaturasList = document.getElementById('viaturasList');
        viaturasList.innerHTML = '';
        
        if (!snapshot.exists()) {
            console.log('Nenhuma viatura encontrada. Criando uma padrão...');
            criarViaturaPadrao();
            return;
        }
        
        snapshot.forEach((childSnapshot) => {
            const viatura = childSnapshot.val();
            viatura.id = childSnapshot.key;
            todasViaturas.push(viatura);
            
            // Verificar status (se alguém está online)
            let status = 'offline';
            if (viatura.encarregado && viatura.encarregado.online) status = 'online';
            if (viatura.motorista && viatura.motorista.online) status = 'online';
            if (viatura.auxiliar && viatura.auxiliar.online) status = 'online';
            
            const viaturaCard = document.createElement('div');
            viaturaCard.className = `viatura-card ${currentViatura?.id === viatura.id ? 'ativa' : ''}`;
            viaturaCard.innerHTML = `
                <div class="viatura-icon">🚔</div>
                <div class="viatura-nome">${viatura.nome || 'Nova Viatura'}</div>
                <div class="viatura-info">ID: ${viatura.id}</div>
                <div class="viatura-status ${status === 'online' ? 'status-online' : 'status-offline'}">
                    <div style="width: 8px; height: 8px; border-radius: 50%; background: ${status === 'online' ? '#2ecc71' : '#e74c3c'};"></div>
                    ${status === 'online' ? 'Ativa agora' : 'Sem conexão'}
                </div>
            `;
            viaturaCard.onclick = () => acessarViatura(viatura.id);
            viaturasList.appendChild(viaturaCard);
        });
    }, (error) => {
        console.error('Erro ao carregar viaturas:', error);
    });
}

function criarViaturaPadrao() {
    const viaturaId = `VIATURA_${Math.floor(Math.random() * 9000) + 1000}`;
    db.ref(`viaturas/${viaturaId}`).set({
        nome: 'Viatura Principal',
        criadaEm: new Date().toISOString(),
        itens: criarItensPadrao(),
        encarregado: { nome: '', online: false },
        motorista: { nome: '', online: false },
        auxiliar: { nome: '', online: false }
    }).then(() => {
        console.log('Viatura padrão criada:', viaturaId);
    }).catch((error) => {
        console.error('Erro ao criar viatura padrão:', error);
    });
}

function mostrarModalNovaViatura() {
    document.getElementById('modalNovaViatura').style.display = 'flex';
    document.getElementById('novaViaturaId').value = `VIATURA_${Math.floor(Math.random() * 9000) + 1000}`;
}

function fecharModalNovaViatura() {
    document.getElementById('modalNovaViatura').style.display = 'none';
}

function criarNovaViatura() {
    const nome = document.getElementById('novaViaturaNome').value || 'Nova Viatura';
    const id = document.getElementById('novaViaturaId').value;
    
    if (!id) {
        alert('Digite um ID para a viatura!');
        return;
    }
    
    if (!db) {
        alert('Erro de conexão. Recarregue a página.');
        return;
    }
    
    db.ref(`viaturas/${id}`).set({
        nome: nome,
        criadaEm: new Date().toISOString(),
        itens: criarItensPadrao(),
        encarregado: { nome: '', online: false },
        motorista: { nome: '', online: false },
        auxiliar: { nome: '', online: false }
    }).then(() => {
        console.log('Viatura criada:', id);
        fecharModalNovaViatura();
        acessarViatura(id);
    }).catch((error) => {
        console.error('Erro ao criar viatura:', error);
        alert('Erro ao criar viatura: ' + error.message);
    });
}

function criarItensPadrao() {
    const itens = [];
    
    ITENS_FIXOS.forEach((nome, i) => {
        itens.push({
            id: `f${i}`,
            tipo: 'fixo',
            nome: nome,
            encarregado: 0,
            motorista: 0,
            auxiliar: 0
        });
    });
    
    for (let i = 1; i <= 8; i++) {
        itens.push({
            id: `l${i}`,
            tipo: 'livre',
            nome: '',
            encarregado: 0,
            motorista: 0,
            auxiliar: 0
        });
    }
    
    return itens;
}

function acessarViatura(viaturaId) {
    currentViatura = { id: viaturaId };
    
    // Atualizar URL
    const novaUrl = `${window.location.pathname}?viatura=${viaturaId}`;
    window.history.pushState({}, '', novaUrl);
    
    // Conectar à viatura
    conectarViatura(viaturaId);
    
    // Mudar para interface da viatura
    document.getElementById('viaturaSelection').style.display = 'none';
    document.getElementById('viaturaInterface').style.display = 'block';
    
    // Atualizar título
    const viaturaInfo = todasViaturas.find(v => v.id === viaturaId);
    if (viaturaInfo) {
        document.getElementById('viaturaTitulo').textContent = viaturaInfo.nome || 'Viatura';
    }
    document.getElementById('viaturaId').textContent = `ID: ${viaturaId}`;
}

function conectarViatura(viaturaId) {
    if (!db) {
        alert('Erro de conexão. Recarregue a página.');
        return;
    }
    
    viaturaAtualRef = db.ref(`viaturas/${viaturaId}`);
    
    // Pedir nome do usuário
    const userName = prompt(`Digite seu nome (${currentUser.mode}):`) || currentUser.mode;
    currentUser.name = userName;
    
    // Escutar alterações na viatura
    viaturaAtualRef.on('value', (snapshot) => {
        if (snapshot.exists()) {
            currentViatura.data = snapshot.val();
            atualizarInterfaceViatura();
        } else {
            console.log('Viatura não encontrada, criando...');
            // Se a viatura não existe, cria
            db.ref(`viaturas/${viaturaId}`).set({
                nome: 'Viatura ' + viaturaId,
                criadaEm: new Date().toISOString(),
                itens: criarItensPadrao(),
                encarregado: { nome: '', online: false },
                motorista: { nome: '', online: false },
                auxiliar: { nome: '', online: false }
            });
        }
    }, (error) => {
        console.error('Erro ao conectar à viatura:', error);
    });
    
    // Atualizar status online
    const userRef = viaturaAtualRef.child(currentUser.mode);
    userRef.update({
        nome: currentUser.name,
        online: true,
        ultimaAtividade: firebase.database.ServerValue.TIMESTAMP
    }).catch((error) => {
        console.error('Erro ao atualizar status:', error);
    });
    
    // Configurar desconexão
    userRef.onDisconnect().update({
        online: false,
        ultimaAtividade: firebase.database.ServerValue.TIMESTAMP
    });
}

function voltarParaSelecao() {
    // Desconectar da viatura atual
    if (viaturaAtualRef && currentUser.mode) {
        viaturaAtualRef.child(currentUser.mode).update({ online: false });
    }
    
    // Voltar para tela de seleção
    document.getElementById('viaturaSelection').style.display = 'block';
    document.getElementById('viaturaInterface').style.display = 'none';
    
    currentViatura = null;
    viaturaAtualRef = null;
}

// ===== INTERFACE DA VIATURA =====
function atualizarInterfaceViatura() {
    if (!currentViatura?.data) return;
    
    const data = currentViatura.data;
    
    // Atualizar status de conexão
    const statusIndicator = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');
    if (statusIndicator && statusText) {
        statusIndicator.style.background = '#2ecc71';
        statusText.textContent = `Conectado como ${currentUser.name}`;
    }
    
    // Atualizar equipe
    const equipeContainer = document.getElementById('equipeContainer');
    if (equipeContainer) {
        equipeContainer.innerHTML = '';
        
        ['encarregado', 'motorista', 'auxiliar'].forEach((funcao) => {
            const membro = data[funcao] || {};
            const card = document.createElement('div');
            card.className = `equipe-card ${funcao === currentUser.mode ? 'ativo' : ''}`;
            card.innerHTML = `
                <h3>${funcao === 'encarregado' ? '👮‍♂️ Encarregado' : 
                       funcao === 'motorista' ? '🚚 Motorista' : '👥 Auxiliar'}</h3>
                <div class="equipe-nome">${membro.nome || '-'}</div>
                <div style="margin-top: 10px; font-size: 12px; color: ${membro.online ? '#2ecc71' : '#e74c3c'}">
                    ${membro.online ? '● Online' : '○ Offline'}
                </div>
            `;
            equipeContainer.appendChild(card);
        });
    }
    
    // Atualizar itens
    renderizarItens(data.itens || []);
}

function renderizarItens(itens) {
    const container = document.getElementById('itensList');
    if (!container) return;
    
    container.innerHTML = '';
    
    itens.forEach((item, index) => {
        const total = item.encarregado + item.motorista + item.auxiliar;
        const titulo = item.tipo === 'livre' ? (item.nome || '✏️ Artigo livre') : item.nome;
        
        const itemHTML = `
            <div class="item">
                <div class="item-header">
                    <span>${titulo}</span>
                    <span class="item-total">${total}</span>
                </div>
                <div class="item-conteudo">
                    ${item.tipo === 'livre' ? `
                        <div style="grid-column: 1 / -1;">
                            <input type="text" 
                                   placeholder="Digite o nome do artigo"
                                   value="${item.nome || ''}"
                                   oninput="atualizarNomeItem(${index}, this.value)"
                                   style="width: 100%; padding: 12px; border: 2px solid #3498db; border-radius: 6px;">
                        </div>
                    ` : ''}
                    
                    <!-- Encarregado -->
                    <div class="contador-section">
                        <h4>👮‍♂️ Encarregado</h4>
                        <div class="contador-box">
                            <button class="contador-btn btn-menos" 
                                    onclick="alterarContador(${index}, 'encarregado', -1)"
                                    ${currentUser.mode !== 'encarregado' ? 'disabled style="opacity: 0.5;"' : ''}>
                                -
                            </button>
                            <span class="contador-valor">${item.encarregado}</span>
                            <button class="contador-btn btn-add" 
                                    onclick="alterarContador(${index}, 'encarregado', 1)"
                                    ${currentUser.mode !== 'encarregado' ? 'disabled style="opacity: 0.5;"' : ''}>
                                +
                            </button>
                        </div>
                    </div>
                    
                    <!-- Motorista -->
                    <div class="contador-section">
                        <h4>🚚 Motorista</h4>
                        <div class="contador-box">
                            <button class="contador-btn btn-menos" 
                                    onclick="alterarContador(${index}, 'motorista', -1)"
                                    ${currentUser.mode !== 'motorista' ? 'disabled style="opacity: 0.5;"' : ''}>
                                -
                            </button>
                            <span class="contador-valor">${item.motorista}</span>
                            <button class="contador-btn btn-add" 
                                    onclick="alterarContador(${index}, 'motorista', 1)"
                                    ${currentUser.mode !== 'motorista' ? 'disabled style="opacity: 0.5;"' : ''}>
                                +
                            </button>
                        </div>
                    </div>
                    
                    <!-- Auxiliar -->
                    <div class="contador-section">
                        <h4>👥 Auxiliar</h4>
                        <div class="contador-box">
                            <button class="contador-btn btn-menos" 
                                    onclick="alterarContador(${index}, 'auxiliar', -1)"
                                    ${currentUser.mode !== 'auxiliar' ? 'disabled style="opacity: 0.5;"' : ''}>
                                -
                            </button>
                            <span class="contador-valor">${item.auxiliar}</span>
                            <button class="contador-btn btn-add" 
                                    onclick="alterarContador(${index}, 'auxiliar', 1)"
                                    ${currentUser.mode !== 'auxiliar' ? 'disabled style="opacity: 0.5;"' : ''}>
                                +
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        container.innerHTML += itemHTML;
    });
}

// ===== FUNÇÕES DE CONTROLE =====
function setAccessMode(mode) {
    if (!viaturaAtualRef) return;
    
    // Atualizar status anterior para offline
    if (currentUser.mode) {
        viaturaAtualRef.child(currentUser.mode).update({ online: false });
    }
    
    // Mudar modo
    currentUser.mode = mode;
    
    // Atualizar novo status
    viaturaAtualRef.child(mode).update({
        nome: currentUser.name,
        online: true,
        ultimaAtividade: firebase.database.ServerValue.TIMESTAMP
    });
    
    // Atualizar botões
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('ativo');
    });
    const btnAtivo = document.querySelector(`.mode-btn.${mode}`);
    if (btnAtivo) btnAtivo.classList.add('ativo');
    
    // Recarregar interface
    if (currentViatura?.data) {
        atualizarInterfaceViatura();
    }
}

function alterarContador(itemIndex, campo, valor) {
    if (!viaturaAtualRef || currentUser.mode !== campo) return;
    
    if (!currentViatura?.data?.itens?.[itemIndex]) {
        console.error('Item não encontrado:', itemIndex);
        return;
    }
    
    const itemRef = viaturaAtualRef.child(`itens/${itemIndex}/${campo}`);
    const novoValor = Math.max(0, (currentViatura.data.itens[itemIndex][campo] || 0) + valor);
    
    itemRef.set(novoValor).catch((error) => {
        console.error('Erro ao atualizar contador:', error);
    });
}

function atualizarNomeItem(itemIndex, nome) {
    if (!viaturaAtualRef) return;
    
    viaturaAtualRef.child(`itens/${itemIndex}/nome`).set(nome).catch((error) => {
        console.error('Erro ao atualizar nome:', error);
    });
}

function enviarWhatsApp() {
    if (!currentViatura?.data) return;
    
    const data = currentViatura.data;
    let texto = `*FISCALIZAÇÃO - ${data.nome || currentViatura.id}*\n\n`;
    
    // Equipe
    const equipe = [];
    if (data.encarregado?.nome) equipe.push(`Encarregado: ${data.encarregado.nome}`);
    if (data.motorista?.nome) equipe.push(`Motorista: ${data.motorista.nome}`);
    if (data.auxiliar?.nome) equipe.push(`Auxiliar: ${data.auxiliar.nome}`);
    
    if (equipe.length > 0) {
        texto += `👥 ${equipe.join(' | ')}\n\n`;
    }
    
    // Itens
    let temDados = false;
    (data.itens || []).forEach(item => {
        const nome = item.tipo === 'livre' ? item.nome : item.nome;
        if (!nome && item.tipo === 'livre') return;
        
        const total = item.encarregado + item.motorista + item.auxiliar;
        if (total > 0) {
            temDados = true;
            texto += `*${nome}*\n`;
            if (item.encarregado > 0) texto += `- Encarregado: ${item.encarregado}\n`;
            if (item.motorista > 0) texto += `- Motorista: ${item.motorista}\n`;
            if (item.auxiliar > 0) texto += `- Auxiliar: ${item.auxiliar}\n`;
            texto += '\n';
        }
    });
    
    if (!temDados) {
        alert('Nada para enviar!');
        return;
    }
    
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
}

function limparDados() {
    if (confirm('Limpar todos os dados desta viatura?')) {
        const itensIniciais = criarItensPadrao();
        viaturaAtualRef.child('itens').set(itensIniciais).catch((error) => {
            console.error('Erro ao limpar dados:', error);
            alert('Erro ao limpar dados: ' + error.message);
        });
    }
}

// ===== INICIALIZAR =====
window.onload = initApp;
window.addEventListener('beforeunload', function() {
    if (viaturaAtualRef && currentUser.mode) {
        viaturaAtualRef.child(currentUser.mode).update({ online: false });
    }
});
