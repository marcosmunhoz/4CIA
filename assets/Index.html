<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Artigos</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    padding: 10px;
}

h2 {
    text-align: center;
}

.box {
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 12px;
}

input {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.item {
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

.titulo {
    font-weight: bold;
    margin-bottom: 6px;
}

.linha {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
}

button {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    color: #fff;
    background: #007bff;
}

.menos {
    background: #dc3545;
}

.contador {
    min-width: 25px;
    text-align: center;
    font-weight: bold;
}

.whats {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #25d366;
    border: none;
    border-radius: 8px;
    color: white;
    margin-top: 15px;
}
</style>
</head>

<body>

<h2>Controle de Artigos</h2>

<div class="box">
    <input id="encarregado" placeholder="Nome do Encarregado">
    <input id="motorista" placeholder="Nome do Motorista">
</div>

<!-- LISTA DE ITENS -->
<div id="lista"></div>

<button class="whats" onclick="enviarWhats()">Enviar para WhatsApp</button>

<script>
// ===== LISTA DE ARTIGOS (depois você me manda a completa) =====
const artigos = [
    { id: "167", nome: "ART 167" },
    { id: "302", nome: "ART 302" }
];

// ===== RENDERIZA LISTA =====
const lista = document.getElementById("lista");

artigos.forEach(a => {
    lista.innerHTML += `
    <div class="item">
        <div class="titulo">${a.nome}</div>

        <div class="linha">
            <span>Encarregado</span>
            <div class="ctrl">
                <button class="menos" onclick="alterar('e${a.id}',-1)">-</button>
                <span id="e${a.id}" class="contador">0</span>
                <button onclick="alterar('e${a.id}',1)">+</button>
            </div>
        </div>

        <div class="linha">
            <span>Motorista</span>
            <div class="ctrl">
                <button class="menos" onclick="alterar('m${a.id}',-1)">-</button>
                <span id="m${a.id}" class="contador">0</span>
                <button onclick="alterar('m${a.id}',1)">+</button>
            </div>
        </div>
    </div>
    `;
});

// ===== SALVAMENTO =====
function salvar() {
    const dados = {
        encarregado: encarregado.value,
        motorista: motorista.value,
        itens: {}
    };

    artigos.forEach(a => {
        dados.itens[`e${a.id}`] = document.getElementById(`e${a.id}`).innerText;
        dados.itens[`m${a.id}`] = document.getElementById(`m${a.id}`).innerText;
    });

    localStorage.setItem("controleArtigos", JSON.stringify(dados));
}

function carregar() {
    const dados = JSON.parse(localStorage.getItem("controleArtigos"));
    if (!dados) return;

    encarregado.value = dados.encarregado;
    motorista.value = dados.motorista;

    for (let k in dados.itens) {
        const el = document.getElementById(k);
        if (el) el.innerText = dados.itens[k];
    }
}

function alterar(id, v) {
    const el = document.getElementById(id);
    let n = parseInt(el.innerText) + v;
    if (n < 0) n = 0;
    el.innerText = n;
    salvar();
}

encarregado.addEventListener("input", salvar);
motorista.addEventListener("input", salvar);
window.onload = carregar;

// ===== WHATSAPP =====
function enviarWhats() {
    let texto = `📋 *Controle de Artigos*\n\n`;
    texto += `👷 Encarregado: *${encarregado.value || "Não informado"}*\n`;
    texto += `🚚 Motorista: *${motorista.value || "Não informado"}*\n\n`;

    artigos.forEach(a => {
        texto += `${a.nome}\n`;
        texto += `- Encarregado: ${document.getElementById(`e${a.id}`).innerText}\n`;
        texto += `- Motorista: ${document.getElementById(`m${a.id}`).innerText}\n\n`;
    });

    window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
}

// ===== SERVICE WORKER =====
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
