<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Completo PMO - Veículos e Procedimentos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #2a4a7c);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 25px;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #1a2a6c, #2a4a7c, #3a6a9c);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 15px;
            color: #1a2a6c;
            font-size: 1.8rem;
        }
        
        .description {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-style: italic;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        
        .stat-item {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1a2a6c;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            height: 12px;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #1a2a6c, #2a4a7c);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .question-counter {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: #2a4a7c;
        }
        
        .question {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background-color: #f9f9f9;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }
        
        .question h3 {
            margin-bottom: 20px;
            color: #1a2a6c;
            font-size: 1.2rem;
        }
        
        .options {
            display: flex;
            flex-direction: column;
        }
        
        .option {
            margin-bottom: 12px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .option:hover {
            background-color: #e9e9e9;
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }
        
        .option.selected {
            background-color: #d4edda;
            border-color: #1a2a6c;
            color: #1a2a6c;
        }
        
        .option.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        
        .option.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        
        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        #prev-btn {
            background-color: #6c757d;
            color: white;
        }
        
        #prev-btn:hover:not(:disabled) {
            background-color: #5a6268;
        }
        
        #next-btn, #submit-btn {
            background: linear-gradient(90deg, #1a2a6c, #2a4a7c);
            color: white;
        }
        
        #next-btn:hover:not(:disabled), #submit-btn:hover:not(:disabled) {
            background: linear-gradient(90deg, #2a4a7c, #3a6a9c);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .results {
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            background-color: #f8f9fa;
            text-align: center;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .results h2 {
            margin-bottom: 20px;
            color: #1a2a6c;
        }
        
        .score-container {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
        }
        
        .score-box {
            padding: 20px;
            border-radius: 10px;
            width: 45%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .correct-box {
            background-color: #d4edda;
            border: 2px solid #28a745;
        }
        
        .incorrect-box {
            background-color: #f8d7da;
            border: 2px solid #dc3545;
        }
        
        .score-label {
            font-size: 1rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .score-value {
            font-size: 2.5rem;
            font-weight: bold;
        }
        
        .correct-value {
            color: #155724;
        }
        
        .incorrect-value {
            color: #721c24;
        }
        
        .percentage {
            font-size: 1.5rem;
            margin: 15px 0;
            font-weight: bold;
            color: #1a2a6c;
        }
        
        .message {
            margin: 15px 0;
            font-size: 1.1rem;
            color: #555;
        }
        
        .restart-btn {
            background: linear-gradient(90deg, #1a2a6c, #2a4a7c);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s;
        }
        
        .restart-btn:hover {
            background: linear-gradient(90deg, #2a4a7c, #3a6a9c);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .explanation {
            margin-top: 15px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #495057;
            display: none;
        }
        
        .category {
            display: inline-block;
            background: #1a2a6c;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .stats {
                flex-direction: column;
                gap: 10px;
            }
            
            .question {
                padding: 15px;
            }
            
            .option {
                padding: 12px;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            .score-container {
                flex-direction: column;
                align-items: center;
            }
            
            .score-box {
                width: 90%;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quiz Completo PMO - Veículos e Procedimentos</h1>
        <p class="description">Teste seus conhecimentos sobre PMO-52, PMO-53, PMO-54, PMO-55 e procedimentos</p>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="total-questions">0</div>
                <div class="stat-label">Total de Perguntas</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="answered-questions">0</div>
                <div class="stat-label">Respondidas</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="remaining-questions">0</div>
                <div class="stat-label">Restantes</div>
            </div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="question-counter" id="question-counter">Pergunta 1 de 0</div>
        
        <div id="quiz-container">
            <!-- As perguntas serão inseridas aqui via JavaScript -->
        </div>
        
        <div class="explanation" id="explanation">
            <!-- Explicação da resposta será inserida aqui -->
        </div>
        
        <div class="buttons">
            <button id="prev-btn" disabled>Anterior</button>
            <button id="next-btn">Próxima</button>
            <button id="submit-btn" style="display: none;">Verificar Respostas</button>
        </div>
        
        <div class="results" id="results">
            <h2>Resultado do Quiz</h2>
            <div class="score-container">
                <div class="score-box correct-box">
                    <div class="score-label">Acertos</div>
                    <div class="score-value correct-value" id="correct-count">0</div>
                </div>
                <div class="score-box incorrect-box">
                    <div class="score-label">Erros</div>
                    <div class="score-value incorrect-value" id="incorrect-count">0</div>
                </div>
            </div>
            <div class="percentage" id="percentage">0%</div>
            <div class="message" id="message"></div>
            <button class="restart-btn" id="restart-btn">Refazer Quiz</button>
        </div>
    </div>

    <script>

            { q: "O guincho deve ser acionado quando:", opts: ["O policial acha conveniente", "Veículo não puder se mover com segurança", "Sempre que houver dano", "Quando solicitarem"], c: 1, cat: "Procedimentos" },
            { q: "O uso do guincho particular:", opts: ["É proibido sempre", "Permitido somente com ciência e liberação do agente", "Permitido sem controle", "Só pode quando veículo for de carga"], c: 1, cat: "Procedimentos" },

            { q: "O croqui com vítima deve conter:", opts: ["Somente veículos", "Posição final da vítima no local", "Somente trajeto do condutor", "Posição aproximada dos socorristas"], c: 1, cat: "Procedimentos" },

            { q: "O aditamento ao BO-e é utilizado para:", opts: ["Corrigir ou complementar informações posteriores", "Cancelar ocorrência", "Incluir multa", "Trocar versão das partes"], c: 0, cat: "Procedimentos" },
            { q: "Quem pode solicitar aditamento?", opts: ["Qualquer pessoa interessada", "Apenas delegado", "Apenas vítima", "Apenas PM comandante"], c: 0, cat: "Procedimentos" },

            { q: "As fotos no local do acidente devem:", opts: ["Ser dispensadas", "Registrar veículos, via, vestígios e posição relativa", "Registrar apenas placas", "Registrar apenas vítimas"], c: 1, cat: "Procedimentos" },

            { q: "Quando há atropelamento:", opts: ["Não se faz croqui", "Croqui deve indicar ponto de impacto provável", "Apenas fotos", "Somente depoimento da vítima"], c: 1, cat: "Procedimentos" },
            { q: "O relatório do atendente (RAPM) deve:", opts: ["Conter opinião", "Ser exclusivamente objetivo", "Ser preenchido apenas pela autoridade policial", "Pode conter hipóteses"], c: 1, cat: "Procedimentos" },
            { q: "A inversão de marchas no croqui significa:", opts: ["Representação errada", "Uso de seta dupla demonstrando deslocamento", "Que o veículo estava parado", "Erro do agente"], c: 1, cat: "Procedimentos" },
            { q: "Se um veículo for retirado antes da chegada da PM:", opts: ["Cancela ocorrência", "Registra croqui baseado em vestígios e relatos", "Não se faz BO-e", "Apenas fotos do proprietário"], c: 1, cat: "Procedimentos" },
            { q: "O posicionamento do policial no registro deve ser:", opts: ["Subjetivo", "Neutro e técnico", "Baseado no autor mais forte", "Com opinião jurídica"], c: 1, cat: "Procedimentos" },
            { q: "Quando o veículo está muito danificado e sem placa:", opts: ["Não se registra", "Registra-se chassi + características", "Apenas fotos", "Solicita-se novo CRLV"], c: 1, cat: "Procedimentos" },
            { q: "O deslocamento das partes após colisão deve ser:", opts: ["Estimado no croqui com seta de movimentação", "Ignorado", "Registrado apenas nas fotos", "Lançado como distância exata"], c: 0, cat: "Procedimentos" },
            { q: "Quando há forte divergência entre versões:", opts: ["Policial escolhe a mais provável", "Registra ambas as versões fielmente", "Cancela BO-e", "Registra apenas a da vítima"], c: 1, cat: "Procedimentos" },
            { q: "O objetivo do croqui é:", opts: ["Identificar culpado", "Auxiliar a visualização técnica da dinâmica do fato", "Definir multa", "Mostrar opinião do agente"], c: 1, cat: "Procedimentos" },
            
            // Resolução 810 e Classificação
            { q: "O que é considerado sinistro de trânsito segundo a Res. 810?", opts: ["Qualquer colisão entre dois objetos", "Evento com dano envolvendo ao menos uma das partes em movimento", "Somente acidentes com vítimas", "Somente acidentes com caminhões"], c: 1, cat: "Res. 810" },
            { q: "Quando um veículo roubado é recuperado com danos, o que deve ser feito?", opts: ["Não se classifica dano", "Somente a seguradora avalia", "Deve ser efetuada classificação de dano e BO-e duplo", "Somente DETRAN analisa"], c: 2, cat: "Res. 810" },
            { q: "Em furto/roubo com posterior sinistro, qual é a regra correta?", opts: ["Não há necessidade de desdobramento", "O veículo não pode ser classificado", "Deve conter desdobramento adequado no BO-e", "O PMRv apenas fotografa"], c: 2, cat: "Res. 810" },
            { q: "Quando marcar 'NA' na planilha de danos?", opts: ["Sempre que houver dano", "Sempre que houver dúvida", "Quando o item não puder ser tecnicamente avaliado", "Quando o veículo tiver mais de dois danos"], c: 2, cat: "Res. 810" },
            { q: "O agente deve classificar danos:", opts: ["Sempre, mesmo sem dano", "Para qualquer veículo envolvido, desde que haja dano efetivo", "Somente com vítima", "Somente se o condutor solicitar"], c: 1, cat: "Res. 810" },
            { q: "Danos preexistentes devem ser registrados:", opts: ["No campo de observações da planilha", "Por foto apenas", "Em anexo separado", "No DETRAN"], c: 0, cat: "Res. 810" },
            { q: "As imagens do veículo devem ser obtidas:", opts: ["Somente no pátio", "Somente se a vítima autorizar", "Preferencialmente no local, antes de remoção", "Apenas pela seguradora"], c: 2, cat: "Res. 810" },
            { q: "Se não for possível anexar imagens ao BO-e, o que fazer?", opts: ["Anotar nada", "Justificar a impossibilidade no campo próprio", "Enviar ao DETRAN sem justificativa", "Aguardar perícia"], c: 1, cat: "Res. 810" },
            { q: "A classificação de dano depende:", opts: ["Da opinião do condutor", "Da seguradora", "De critérios objetivos da planilha PMO", "Apenas do policial mais antigo"], c: 2, cat: "Res. 810" },
            { q: "A planilha PMO deve ser preenchida:", opts: ["Para todos os veículos, sempre", "Somente para veículos com dano", "Somente se houver vítimas", "Somente quando houver duas partes"], c: 1, cat: "Res. 810" },
            { q: "A constatação física do dano deve ocorrer:", opts: ["A distância", "Somente via foto", "No veículo inspecionado pelo agente", "Somente no pátio"], c: 2, cat: "Res. 810" },
            { q: "Qual órgão cria a classificação de dano da Resolução 810?", opts: ["Polícia Civil", "DETRAN", "CONTRAN", "Exército"], c: 2, cat: "Res. 810" },
            { q: "A Res. 810 se aplica:", opts: ["Apenas a caminhões", "A qualquer veículo terrestre automotor", "Somente motos", "Somente ônibus"], c: 1, cat: "Res. 810" },
            { q: "Veículos sem dano devem receber:", opts: ["Classificação DPM", "Nenhuma classificação", "Classificação provisória", "Classificação de fabricante"], c: 1, cat: "Res. 810" },
            { q: "A classificação deve refletir:", opts: ["A opinião das partes", "A vontade da seguradora", "A análise técnica objetiva do agente", "O valor do veículo"], c: 2, cat: "Res. 810" },
            { q: "O agente deve registrar dano em veículo de terceiro não envolvido?", opts: ["Sim, se houver dano", "Não", "Apenas se dono pedir", "Somente polícia judiciária"], c: 0, cat: "Res. 810" },
            { q: "A classificação de dano serve para:", opts: ["Definir responsabilidade", "Indicar gravidade estrutural para circulação e regularização", "Ajudar na perícia criminal", "Calcular multa"], c: 1, cat: "Res. 810" },
            { q: "O que acontece se houver erro na classificação?", opts: ["Nada", "PM é punido automaticamente", "Há possibilidade de recurso do proprietário", "Classificação vira automática"], c: 2, cat: "Res. 810" },
            { q: "A classificação reduzida (DPM/DMM/DGM) é baseada:", opts: ["No valor do reparo", "No laudo da seguradora", "Na quantidade de itens SIM ou NA", "No tipo de veículo"], c: 2, cat: "Res. 810" },
            { q: "Planilhas diferentes existem porque:", opts: ["PMO gosta de dificultar", "Tipos de veículos possuem estruturas diferentes", "O DETRAN exige", "As seguradoras pediram"], c: 1, cat: "Res. 810" },
            
            // Conceitos Gerais
            { q: "O DETRAN utiliza a classificação para:", opts: ["Determinar culpado", "Avaliar estado de circulação/sucateamento", "Aplicar multa", "Criar estatística"], c: 1, cat: "Conceitos" },
            { q: "DGM implica:", opts: ["Autorização especial", "Sucateamento", "Reparo leve", "Multa ao condutor"], c: 1, cat: "Conceitos" },
            { q: "DMM implica:", opts: ["Proibição total", "Reparo com alinhamento estrutural", "Nada", "Perda total"], c: 1, cat: "Conceitos" },
            { q: "Veículo com DPM:", opts: ["Pode circular após reparo adequado", "É sucateado", "Não pode circular nunca", "Vai para leilão"], c: 0, cat: "Conceitos" },
            { q: "Recurso contra classificação deve ser feito:", opts: ["Junto à PM", "Ao DETRAN", "Ao COPOM", "Ao seguro"], c: 1, cat: "Conceitos" },
            { q: "Sem fotos do veículo, a classificação:", opts: ["Não pode ser homologada", "Segue normal", "É automática", "Não existe"], c: 0, cat: "Conceitos" },
            { q: "Planilhas PMO servem para:", opts: ["Opinião pessoal", "Critério técnico objetivo", "Avaliação estética", "Cálculo de multa"], c: 1, cat: "Conceitos" },
            { q: "Classificação incorreta pode gerar:", opts: ["Nada", "Recurso e revisão", "Prisão do PM", "Perda do veículo automaticamente"], c: 1, cat: "Conceitos" },
            { q: "A Resolução 810 exige:", opts: ["Registros subjetivos", "Critérios objetivos", "Que o PM decida visualmente", "Apenas fotos"], c: 1, cat: "Conceitos" }
        ];

        // Variáveis para controlar o estado do quiz
        let currentQuestion = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let quizSubmitted = false;

        // Elementos DOM
        const quizContainer = document.getElementById('quiz-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const resultsDiv = document.getElementById('results');
        const correctCountElem = document.getElementById('correct-count');
        const incorrectCountElem = document.getElementById('incorrect-count');
        const percentageElem = document.getElementById('percentage');
        const messageElem = document.getElementById('message');
        const restartBtn = document.getElementById('restart-btn');
        const progressBar = document.getElementById('progress-bar');
        const questionCounter = document.getElementById('question-counter');
        const explanationElem = document.getElementById('explanation');
        const totalQuestionsElem = document.getElementById('total-questions');
        const answeredQuestionsElem = document.getElementById('answered-questions');
        const remainingQuestionsElem = document.getElementById('remaining-questions');

        // Função para inicializar o quiz
        function initializeQuiz() {
            totalQuestionsElem.textContent = quizData.length;
            updateStats();
            showQuestion(currentQuestion);
            updateButtons();
            updateProgressBar();
        }

        // Função para atualizar estatísticas
        function updateStats() {
            const answered = userAnswers.filter(answer => answer !== null).length;
            const remaining = quizData.length - answered;
            
            answeredQuestionsElem.textContent = answered;
            remainingQuestionsElem.textContent = remaining;
        }

        // Função para mostrar uma pergunta
        function showQuestion(index) {
            quizContainer.innerHTML = '';
            const questionData = quizData[index];
            
            const questionElement = document.createElement('div');
            questionElement.className = 'question';
            
            // Adiciona categoria
            const categoryElement = document.createElement('div');
            categoryElement.className = 'category';
            categoryElement.textContent = questionData.cat;
            questionElement.appendChild(categoryElement);
            
            const questionTitle = document.createElement('h3');
            questionTitle.textContent = questionData.q;
            questionElement.appendChild(questionTitle);
            
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options';
            
            questionData.opts.forEach((option, optionIndex) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                
                // Adiciona classe se já foi respondida e o quiz foi submetido
                if (quizSubmitted) {
                    if (optionIndex === questionData.c) {
                        optionElement.classList.add('correct');
                    } else if (userAnswers[index] === optionIndex && userAnswers[index] !== questionData.c) {
                        optionElement.classList.add('incorrect');
                    }
                } else if (userAnswers[index] === optionIndex) {
                    optionElement.classList.add('selected');
                }
                
                optionElement.textContent = option;
                optionElement.dataset.optionIndex = optionIndex;
                
                optionElement.addEventListener('click', () => {
                    if (!quizSubmitted) {
                        selectOption(index, optionIndex);
                    }
                });
                
                optionsContainer.appendChild(optionElement);
            });
            
            questionElement.appendChild(optionsContainer);
            quizContainer.appendChild(questionElement);
            
            // Atualiza o contador de perguntas
            questionCounter.textContent = `Pergunta ${index + 1} de ${quizData.length}`;
            
            // Mostra explicação se o quiz foi submetido
            if (quizSubmitted) {
                showExplanation(index);
            } else {
                explanationElem.style.display = 'none';
            }
        }

        // Função para mostrar explicação da resposta
        function showExplanation(index) {
            const questionData = quizData[index];
            const userAnswer = userAnswers[index];
            const correctAnswer = questionData.c;
            
            explanationElem.innerHTML = '';
            
            if (userAnswer !== null) {
                explanationElem.style.display = 'block';
                
                const explanationTitle = document.createElement('div');
                explanationTitle.style.fontWeight = 'bold';
                explanationTitle.style.marginBottom = '10px';
                
                if (userAnswer === correctAnswer) {
                    explanationTitle.textContent = '✓ Resposta Correta!';
                    explanationTitle.style.color = '#28a745';
                } else {
                    explanationTitle.textContent = '✗ Resposta Incorreta';
                    explanationTitle.style.color = '#dc3545';
                }
                
                explanationElem.appendChild(explanationTitle);
                
                const correctOption = document.createElement('div');
                correctOption.textContent = `Resposta correta: ${questionData.opts[correctAnswer]}`;
                correctOption.style.marginBottom = '10px';
                explanationElem.appendChild(correctOption);
            } else {
                explanationElem.style.display = 'none';
            }
        }

        // Função para selecionar uma opção
        function selectOption(questionIndex, optionIndex) {
            userAnswers[questionIndex] = optionIndex;
            showQuestion(questionIndex);
            updateButtons();
            updateStats();
        }

        // Função para atualizar os botões de navegação
        function updateButtons() {
            prevBtn.disabled = currentQuestion === 0;
            
            if (currentQuestion === quizData.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'block';
                submitBtn.disabled = userAnswers[currentQuestion] === null;
            } else {
                nextBtn.style.display = 'block';
                submitBtn.style.display = 'none';
                nextBtn.disabled = userAnswers[currentQuestion] === null;
            }
        }

        // Função para atualizar a barra de progresso
        function updateProgressBar() {
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            progressBar.style.width = `${progress}%`;
        }

        // Função para verificar as respostas
        function checkAnswers() {
            let correctCount = 0;
            
            quizData.forEach((questionData, index) => {
                if (userAnswers[index] === questionData.c) {
                    correctCount++;
                }
            });
            
            const incorrectCount = quizData.length - correctCount;
            const percentage = Math.round((correctCount / quizData.length) * 100);
            
            // Atualiza a contagem
            correctCountElem.textContent = correctCount;
            incorrectCountElem.textContent = incorrectCount;
            percentageElem.textContent = `${percentage}% de acerto`;
            
            // Mensagem personalizada baseada no desempenho
            let message = "";
            if (percentage >= 90) {
                message = "Excelente! Você domina completamente o assunto!";
            } else if (percentage >= 70) {
                message = "Muito bom! Você tem um conhecimento sólido sobre PMO.";
            } else if (percentage >= 50) {
                message = "Bom! Revise alguns conceitos para melhorar seu desempenho.";
            } else {
                message = "Estude mais os materiais para melhorar seu conhecimento.";
            }
            messageElem.textContent = message;
            
            // Mostra os resultados
            resultsDiv.style.display = 'block';
            
            // Desabilita o botão de envio
            submitBtn.disabled = true;
            quizSubmitted = true;
            
            // Mostra todas as perguntas com feedback
            showQuestion(currentQuestion);
        }

        // Event Listeners
        prevBtn.addEventListener('click', () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion(currentQuestion);
                updateButtons();
                updateProgressBar();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                showQuestion(currentQuestion);
                updateButtons();
                updateProgressBar();
            }
        });

        submitBtn.addEventListener('click', checkAnswers);

        restartBtn.addEventListener('click', () => {
            currentQuestion = 0;
            userAnswers = new Array(quizData.length).fill(null);
            quizSubmitted = false;
            resultsDiv.style.display = 'none';
            explanationElem.style.display = 'none';
            initializeQuiz();
        });

        // Inicializa o quiz quando a página carrega
        document.addEventListener('DOMContentLoaded', initializeQuiz);
    </script>
</body>
</html>
