<!doctype html>

<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz Avançado - BO-e e Classificação de Danos</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--muted:#9ca3af;--ok:#16a34a;--err:#ef4444}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;background:linear-gradient(180deg,#041025 0%,#071227 100%);color:#e6eef6;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px}
    .wrap{width:100%;max-width:900px}
    header{display:flex;gap:12px;align-items:center;margin-bottom:14px}
    header h1{font-size:18px;margin:0}
    header p{margin:0;color:var(--muted);font-size:13px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);padding:14px;border-radius:12px;box-shadow:0 8px 24px rgba(2,6,23,0.6)}
    .q{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
    .question{font-weight:600;font-size:15px}
    .meta{color:var(--muted);font-size:12px}
    .options{margin-top:10px;display:grid;gap:8px}
    .opt{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:10px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center}
    .opt input{appearance:none;width:18px;height:18px;border-radius:5px;border:2px solid rgba(255,255,255,0.06);display:inline-block;margin-right:8px}
    .opt.selected{border-color:rgba(6,182,212,0.25);box-shadow:0 4px 12px rgba(6,182,212,0.06)}
    .controls{display:flex;gap:8px;margin-top:12px}
    button{background:var(--accent);border:none;color:#022;padding:10px 12px;border-radius:8px;font-weight:600;cursor:pointer}
    button.secondary{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
    .result{margin-top:12px;padding:10px;border-radius:8px;font-size:14px}
    .correct{background:linear-gradient(90deg, rgba(22,163,74,0.12), rgba(22,163,74,0.04));border:1px solid rgba(22,163,74,0.12);color:var(--ok)}
    .wrong{background:linear-gradient(90deg, rgba(239,68,68,0.06), rgba(239,68,68,0.02));border:1px solid rgba(239,68,68,0.08);color:var(--err)}
    .explain{margin-top:8px;color:var(--muted);font-size:13px}
    footer{margin-top:12px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
    .progress{height:8px;background:rgba(255,255,255,0.04);border-radius:999px;overflow:hidden}
    .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#60a5fa);width:0%}
    @media (max-width:520px){body{padding:14px}.question{font-size:15px}.card{padding:12px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Quiz Avançado — BO-e & Classificação de Danos (nível concurso)</h1>
        <p>20 questões — revele a resposta ao submeter cada questão. Respostas explicadas.</p>
      </div>
    </header><div id="quiz" class="card"></div>

<footer>
  <div class="meta">Desenvolvido para estudo — Marcos Munhoz</div>
  <div style="width:40%">
    <div class="progress" aria-hidden><i id="bar"></i></div>
  </div>
</footer>

  </div><script>
// Questões (difíceis) cobrindo todo o resumo. Formato: {q, meta, opts:[{k,text}], answer:'A', explanation}
const questions = [
  {q: '1) O que caracteriza a obrigatoriedade de elaboração do BO-e?', meta:'Direito/Procedimento', opts:[
    {k:'A',text:'Qualquer chamada recebida pela Base Operacional'},
    {k:'B',text:'Ocorrência com infração penal, dano patrimonial ou preservação de direito'},
    {k:'C',text:'Encaminhamento de pessoa a outro órgão'},
    {k:'D',text:'Trote com despacho'},
  ], answer:'B', explanation:'O BO-e é obrigatório quando houver infração penal, dano patrimonial ou necessidade de preservação de direito; situações como trote ou simples encaminhamentos são dispensáveis.'},

  {q: '2) Se o SIOPM estiver indisponível, qual procedimento correto?', meta:'Formulários', opts:[
    {k:'A',text:'Não registrar nada até voltar o sistema'},
    {k:'B',text:'Usar apenas os anexos do PMO-58 correlacionados ao atendimento'},
    {k:'C',text:'Preencher BO-e online em outro posto sem justificar'},
    {k:'D',text:'Registrar somente a folha de rosto'},
  ], answer:'B', explanation:'Em indisponibilidade do SIOPM, devem-se usar os anexos do PMO-58 que tenham correlação com o atendimento; tecnicamente folha de rosto, qualificação e relatório são comuns.'},

  {q: '3) Ao registrar um sinistro que envolva roubo seguido de acidente, o policial deve:', meta:'BO-e / Sinistro', opts:[
    {k:'A',text:'Lavrar apenas BO-e do roubo (crime) e ignorar o sinistro'},
    {k:'B',text:'Lavrar BO-e referente ao crime e também BO-e referente ao sinistro de trânsito, com desdobramento adequado'},
    {k:'C',text:'Aguardar decisão da delegacia antes de qualquer registro'},
    {k:'D',text:'Somente preencher a planilha de dano e não BO-e'},
  ], answer:'B', explanation:'Nas ocorrências de roubo/furto com sinistro, devem ser lavrados tanto o BO-e referente ao crime quanto o BO-e referente ao sinistro (com desdobramentos L08/L09 conforme materiais).'},

  {q: '4) A qual norma o croqui deve obedecer?', meta:'Croqui / Norma', opts:[
    {k:'A',text:'CONTRAN Resolução 810/20'},
    {k:'B',text:'ABNT NBR 10697/20'},
    {k:'C',text:'Instrução interna do posto'},
    {k:'D',text:'Não existe norma para croqui'},
  ], answer:'B', explanation:'O croqui deve seguir a ABNT NBR 10697/20 e a simbologia do PMO-58, garantindo padronização do desenho do sinistro.'},

  {q: '5) No RAPM, qual item NÃO deve constar?', meta:'RAPM', opts:[
    {k:'A',text:'Opinião pessoal do policial sobre culpa'},
    {k:'B',text:'Data e hora do fato'},
    {k:'C',text:'Descrição detalhada do modo como ocorreu'},
    {k:'D',text:'Quem são as partes envolvidas'},
  ], answer:'A', explanation:'O RAPM deve evitar opiniões pessoais, distorções ou afirmações tendenciosas; descrever fatos objetivos: quando, onde, quem, o que, como e por quê.'},

  {q: '6) Sobre as imagens do veículo, marque a alternativa correta:', meta:'Registro fotográfico', opts:[
    {k:'A',text:'As imagens são opcionais e nunca justificadas se ausentes'},
    {k:'B',text:'As imagens devem ser obtidas preferencialmente quando o veículo estiver em condições normais de análise; sua impossibilidade deve ser justificada'},
    {k:'C',text:'Basta uma foto do veículo inteira uma vez'},
    {k:'D',text:'Fotos só são necessárias para danos de grande monta'},
  ], answer:'B', explanation:'As imagens devem ser obtidas preferencialmente em condições normais; se não for possível juntá-las, a impossibilidade precisa ser justificada no campo de observação.'},

  {q: '7) Classificação PMO-52: quantos itens “SIM”/"NA" caracterizam Dano de Média Monta (DMM)?', meta:'Classificação PMO-52', opts:[
    {k:'A',text:'0 itens'},
    {k:'B',text:'1 item'},
    {k:'C',text:'2 a 6 itens'},
    {k:'D',text:'7 a 22 itens'},
  ], answer:'C', explanation:'Para automóveis (PMO-52): Pequena monta = 1 item; Média monta = 2 a 6 itens; Grande monta = 7 a 22 itens.'},

  {q: '8) A classificação "Grande Monta" aplicada ao chassi exige:', meta:'Consequências DGM', opts:[
    {k:'A',text:'Reparo simples e liberação imediata'},
    {k:'B',text:'Restrição administrativa temporária'},
    {k:'C',text:'Sucateamento do veículo como um todo (irrecuperável) quando se aplica ao chassi'},
    {k:'D',text:'Multa ao proprietário'},
  ], answer:'C', explanation:'A classificação de Grande Monta no chassi acarreta sucateamento do veículo como um todo; é uma consequência administrativa grave.'},

  {q: '9) Para veículos classificados como DMM, o órgão executivo do Estado tem quantos dias úteis para incluir a restrição administrativa no sistema?', meta:'Prazos', opts:[
    {k:'A',text:'5 dias úteis'},
    {k:'B',text:'10 dias úteis'},
    {k:'C',text:'30 dias corridos'},
    {k:'D',text:'60 dias'},
  ], answer:'B', explanation:'O órgão executivo de trânsito do Estado tem 10 dias úteis para incluir a restrição administrativa no sistema após o ofício.'},

  {q: '10) O proprietário de veículo classificado como DMM ou DGM tem qual prazo para interpor recurso para reenquadramento?', meta:'Recurso', opts:[
    {k:'A',text:'30 dias'},
    {k:'B',text:'60 dias'},
    {k:'C',text:'90 dias'},
    {k:'D',text:'180 dias'},
  ], answer:'C', explanation:'O proprietário pode apresentar recurso em 90 dias a contar da data de registro do BOe.'},

  {q: '11) Em ocorrência de trânsito, antes de registrar um BO-e individualmente, o policial deve:', meta:'Pesquisa prévia', opts:[
    {k:'A',text:'Iniciar um novo BO-e sem pesquisar'},
    {k:'B',text:'Pesquisar no SIOPM por placas, local, data e horário para verificar se já existe registro e, se existir, complementar o existente'},
    {k:'C',text:'Enviar mensagem à base solicitando autorização'},
    {k:'D',text:'Aguardar a outra parte registrar'},
  ], answer:'B', explanation:'O policial deve pesquisar no SIOPM para checar se já existe BO-e sobre o sinistro; se houver, complementar o registro em vez de criar novo.'},

  {q: '12) Ao gerar um BO-e complementar, o que acontece com o original?', meta:'BO-e complementar', opts:[
    {k:'A',text:'Apaga-se o original automaticamente'},
    {k:'B',text:'O original passa a exibir uma inscrição que identifica o BO-e complementar vinculado'},
    {k:'C',text:'Nada, ficam independentes'},
    {k:'D',text:'O original é transferido ao DETRAN'},
  ], answer:'B', explanation:'Ao gerar BO-e complementar, o original passa a constar com inscrição identificando que há complemento vinculado; todos os complementares serão listados automaticamente.'},

  {q: '13) Em sinistro de trânsito com vítima, quais informações complementares são essenciais no RAPM?', meta:'Informações de vítima', opts:[
    {k:'A',text:'Nome do socorrista, prefixo da unidade de resgate, nome do hospital, nome do médico e CRM, região do corpo e tipo de lesão'},
    {k:'B',text:'Apenas o nome do motorista do guincho'},
    {k:'C',text:'Somente a placa do veículo envolvido'},
    {k:'D',text:'Nada além do relato do condutor'},
  ], answer:'A', explanation:'Em sinistros com vítima é preciso registrar detalhes do socorro: socorrista, unidade, hospital, médico e CRM, região do corpo e tipo de lesão, entre outros.'},

  {q: '14) Ao lavrar a planilha de classificação de danos, o policial deve preencher planilha para:', meta:'Planilha de dano', opts:[
    {k:'A',text:'Todos os veículos envolvidos, independentemente de estarem danificados'},
    {k:'B',text:'Apenas os veículos que apresentem danos'},
    {k:'C',text:'Somente o veículo do autor do sinistro'},
    {k:'D',text:'Somente veículos apreendidos pela autoridade'},
  ], answer:'B', explanation:'O PMRv deve qualificar todos os veículos envolvidos, mas lavrar a planilha de classificação de dano apenas para os veículos que apresentem danos.'},

  {q: '15) Sobre fotos e imagens redistro: qual a orientação em relação ao momento ideal para captar imagens?', meta:'Imagens', opts:[
    {k:'A',text:'Quando o veículo estiver em condições normais de análise'},
    {k:'B',text:'Enquanto o veículo estiver sendo rebocado apenas'},
    {k:'C',text:'Fotos só após reparo'},
    {k:'D',text:'Fotos não são necessárias'},
  ], answer:'A', explanation:'As imagens devem ser obtidas preferencialmente quando o veículo estiver em condições normais de análise para melhor avaliação das avarias.'},

  {q: '16) Quais anexos PMO são usados para classificação de danos em motocicletas?', meta:'PMO', opts:[
    {k:'A',text:'PMO-52'},
    {k:'B',text:'PMO-53'},
    {k:'C',text:'PMO-54'},
    {k:'D',text:'PMO-55'},
  ], answer:'C', explanation:'PMO-054 é a planilha destinada a classificação de danos em motocicletas, motonetas, ciclomotores, triciclos e quadriciclos.'},

  {q: '17) Qual das alternativas é VERDADEIRA a respeito da classificação de danos em caminhões com chassi?', meta:'Caminhões', opts:[
    {k:'A',text:'Grande monta pode ser aplicada à carroceria causando sucateamento automático'},
    {k:'B',text:'Grande monta não se aplica ao chassi'},
    {k:'C',text:'Grande monta no chassi acarreta sucateamento do veículo como um todo'},
    {k:'D',text:'Cabine e carroceria e chassi são sempre avaliados em conjunto numa única regra'},
  ], answer:'C', explanation:'A classificação de Grande Monta no chassi implica sucateamento do veículo como um todo; já cabine e carroçaria são avaliadas separadamente e DGM não se aplica a elas.'},

  {q: '18) Se um veículo for classificado como DMM, o CRLV/CLA apresentará na observação:', meta:'CRLV', opts:[
    {k:'A',text:'Nada, o CRLV não é alterado'},
    {k:'B',text:'A expressão “sinistrado” ou “DMM” até a baixa definitiva do veículo'},
    {k:'C',text:'A imediata baixa definitiva do veículo'},
    {k:'D',text:'Apenas uma multa ao proprietário'},
  ], answer:'B', explanation:'Veículo classificado DMM constará no campo de observação do CRLV/CLA a palavra “sinistrado” ou “DMM”, que permanecerá até a baixa definitiva.'},

  {q: '19) Em caso de complementação proposta por parte interessada, quem decide sobre o complemento?', meta:'Complemento', opts:[
    {k:'A',text:'Unidade de serviço que solicitou'},
    {k:'B',text:'Cmt Cia ou equivalente, que decidirá pela autorização ou não'},
    {k:'C',text:'DETRAN local automaticamente'},
    {k:'D',text:'O delegado de plantão, sem nenhuma anuência'},
  ], answer:'B', explanation:'Quando o complemento é proposto por parte interessada ou pelo próprio componente da US, a solicitação é encaminhada ao Cmt Cia (ou equivalente) para decisão final.'},

  {q: '20) Prazos: o órgão fiscalizador tem quantos dias a partir do sinistro para expedir ofício ao órgão executivo do Estado?', meta:'Prazos ofício', opts:[
    {k:'A',text:'30 dias'},
    {k:'B',text:'60 dias'},
    {k:'C',text:'15 dias'},
    {k:'D',text:'90 dias'},
  ], answer:'B', explanation:'Em caso de média e grande monta, o órgão fiscalizador responsável tem 60 dias a partir da data do sinistro para expedir ofício ao órgão executivo do Estado para a restrição administrativa.'},

  // --- Perguntas adicionais (25) sobre assuntos faltantes ---

  {q: '21) Em relação às formas de comunicação previstas para o registro de ocorrências, qual alternativa apresenta a forma que pressupõe ciência inequívoca da autoridade policial e gera obrigação formal de registro?', meta:'Formas de Comunicação', opts:[
    {k:'A',text:'Comunicação verbal'},
    {k:'B',text:'Comunicação prévia'},
    {k:'C',text:'Comunicação formal'},
    {k:'D',text:'Comunicação pessoal'},
  ], answer:'C', explanation:'A comunicação formal pressupõe registro e obrigação formal; é aquela que formaliza a ciência da autoridade.'},

  {q: '22) A comunicação prévia caracteriza-se por:', meta:'Formas de Comunicação', opts:[
    {k:'A',text:'Ser utilizada somente em ocorrências com vítima'},
    {k:'B',text:'Ser a comunicação inicial da equipe ao COPOM/BOP, indicando natureza e local'},
    {k:'C',text:'Ser obrigatoriamente escrita'},
    {k:'D',text:'Ser forma de comunicação que substitui o BO-e quando não houver dano'},
  ], answer:'B', explanation:'Comunicação prévia é a comunicação inicial da equipe à base sobre natureza e local do fato.'},

  {q: '23) A comunicação pessoal ocorre quando:', meta:'Formas de Comunicação', opts:[
    {k:'A',text:'O policial é comunicado diretamente por e-mail institucional'},
    {k:'B',text:'Uma autoridade ou cidadão comparece fisicamente à unidade para relatar fato'},
    {k:'C',text:'O policial telefona para outra equipe repassando dados'},
    {k:'D',text:'Existe apenas entre Polícia Militar e Polícia Civil'},
  ], answer:'B', explanation:'Comunicação pessoal refere-se ao comparecimento físico do comunicante à unidade.'},

  {q: '24) De acordo com a Resolução SSP 057/15, a Notificação de Ocorrência (NOc) tem como finalidade:', meta:'NOc', opts:[
    {k:'A',text:'Substituir o BO-e em ocorrências com vítima leve'},
    {k:'B',text:'Formalizar comunicação imediata à Polícia Civil em situações previstas, como acidentes com vítima, mesmo antes da finalização do BO-e'},
    {k:'C',text:'Registrar ocorrências de trânsito sem vítimas'},
    {k:'D',text:'Registrar exclusivamente crimes ambientais'},
  ], answer:'B', explanation:'A NOc formaliza comunicação imediata à Polícia Civil em situações previstas, antes mesmo do encerramento do BO-e.'},

  {q: '25) A NOc deve ser emitida obrigatoriamente quando:', meta:'NOc', opts:[
    {k:'A',text:'Houver dano ao patrimônio público, independentemente de vítima'},
    {k:'B',text:'Houver crime de ação penal pública incondicionada com autor no local'},
    {k:'C',text:'O fato exigir comunicação prévia imediata à Polícia Civil pela gravidade, independentemente da conclusão do BO-e'},
    {k:'D',text:'Sofrer indisponibilidade do SIOPM'},
  ], answer:'C', explanation:'NOc é usada quando é necessária comunicação imediata pela gravidade do fato, independentemente da conclusão do BO-e.'},

  {q: '26) Assinale a alternativa que traz situação onde a NOc não deve ser utilizada:', meta:'NOc', opts:[
    {k:'A',text:'Acidente de trânsito com vítima'},
    {k:'B',text:'Ocorrência com autor detido'},
    {k:'C',text:'Crime ambiental'},
    {k:'D',text:'Crime de menor potencial ofensivo sem autor no local'},
  ], answer:'D', explanation:'Crimes de menor potencial ofensivo sem autor no local são normalmente encaminhados via delegacia eletrônica, não exigindo NOc.'},

  {q: '27) A Lei Federal 5.970/73, sobre acidentes de trânsito, prevê:', meta:'Leis', opts:[
    {k:'A',text:'Obrigatoriedade de lavratura de AIT em vítima fatal'},
    {k:'B',text:'Dispensa de apresentação imediata do envolvido à autoridade policial em acidentes sem vítima ou sem fuga'},
    {k:'C',text:'Proibição do recolhimento de CNH independentemente do caso'},
    {k:'D',text:'Encaminhamento compulsório de todos os envolvidos à delegacia'},
  ], answer:'B', explanation:'A Lei trata de procedimentos em acidentes, incluindo hipóteses de dispensa de apresentação imediata quando não há vítimas ou fuga.'},

  {q: '28) Sobre a Lei 6.174/74, é correto afirmar:', meta:'Leis', opts:[
    {k:'A',text:'Define critérios para responsabilização penal imediata'},
    {k:'B',text:'Estabelece medidas administrativas específicas aplicáveis pela autoridade de trânsito, complementando o CTB'},
    {k:'C',text:'Permite ao policial dispensar cadastro do veículo nos autos'},
    {k:'D',text:'Revoga integralmente procedimentos de recolhimento do veículo'},
  ], answer:'B', explanation:'A Lei trata de medidas administrativas aplicáveis no âmbito do trânsito, complementando disposições do CTB.'},

  {q: '29) Em relação às Leis 5.970/73 e 6.174/74, assinale a alternativa correta:', meta:'Leis', opts:[
    {k:'A',text:'Ambas retiram da autoridade policial militar o poder de agir em acidentes'},
    {k:'B',text:'Ambas tratam especificamente de crimes ambientais'},
    {k:'C',text:'Ambas fornecem base jurídica para procedimentos do PMRv em acidentes, incluindo comunicação à autoridade competente e medidas administrativas'},
    {k:'D',text:'Nenhuma delas se aplica ao trabalho rodoviário'},
  ], answer:'C', explanation:'As leis fornecem base jurídica para procedimentos administrativos e de atuação em acidentes rodoviários.'},

  {q: '30) Assinale o item que é obrigatório constar no croqui e no RAPM quando houver vestígios físicos:', meta:'Registro técnico', opts:[
    {k:'A',text:'Condições de visibilidade do perito'},
    {k:'B',text:'Marcas de frenagem e sua posição na pista'},
    {k:'C',text:'Preço estimado do dano'},
    {k:'D',text:'Turno de serviço do policial'},
  ], answer:'B', explanation:'Marcas de frenagem e sua posição são vestígios físicos relevantes e devem constar no croqui e no RAPM.'},

  {q: '31) Em relação à remoção do veículo, o BO-e deve obrigatoriamente constar:', meta:'Remoção', opts:[
    {k:'A',text:'Apenas o nome do motorista do guincho'},
    {k:'B',text:'Marca/modelo e placa do guincho, além do endereço para onde o veículo foi transportado'},
    {k:'C',text:'Apenas placa do guincho'},
    {k:'D',text:'Somente o endereço da seguradora'},
  ], answer:'B', explanation:'Deve constar identificação do guincho e para onde o veículo foi levado para responsabilidade e rastreio.'},

  {q: '32) Sobre as condições do local e pista, marque a alternativa correta:', meta:'Local', opts:[
    {k:'A',text:'Registrar tipo de pavimento é facultativo'},
    {k:'B',text:'O relevo da pista e separação física central são elementos obrigatórios de observação'},
    {k:'C',text:'Obras não devem ser citadas para evitar erros interpretativos'},
    {k:'D',text:'A sinalização vertical só deve ser citada se estiver incorreta'},
  ], answer:'B', explanation:'Relevo, separador e outros elementos da via influenciam dinâmica e são parte da observação obrigatória.'},

  {q: '33) Quando a perícia não comparece ao local, torna-se ainda mais relevante o registro de:', meta:'Perícia', opts:[
    {k:'A',text:'Estado emocional das vítimas'},
    {k:'B',text:'Marcas de frenagem e choque, indicando posição exata e sentido'},
    {k:'C',text:'Endereço do hospital da vítima'},
    {k:'D',text:'Dados do perito substituto'},
  ], answer:'B', explanation:'Sem perícia técnica, registros de vestígios físicos como marcas de frenagem são fundamentais para análise posterior.'},

  {q: '34) A Resolução 915/22 estabelece que veículos N2 são:', meta:'Categorias', opts:[
    {k:'A',text:'Veículos destinados ao transporte de carga com massa menor que 2 t'},
    {k:'B',text:'Veículos de transporte de carga com massa maior que 12 t'},
    {k:'C',text:'Veículos de transporte de carga com massa superior a 3,5 t e até 12 t'},
    {k:'D',text:'Veículos de passeio com chassi reforçado'},
  ], answer:'C', explanation:'N2 corresponde a veículos para transporte de carga com massa superior a 3,5 t e até 12 t.'},

  {q: '35) A F-350, conforme classificação técnica, é considerada:', meta:'Categorias', opts:[
    {k:'A',text:'Automóvel leve'},
    {k:'B',text:'Caminhonete (até 3.500 kg)'},
    {k:'C',text:'Caminhão (acima de 3.500 kg)'},
    {k:'D',text:'Microcaminhão N1'},
  ], answer:'C', explanation:'Modelos como F-350 geralmente enquadram-se como caminhão por terem peso bruto acima de 3.500 kg.'},

const quizEl = document.getElementById('quiz');
let idx = 0; let score=0;

function render(){
  const item = questions[idx];
  quizEl.innerHTML = `
    <div class="q">
      <div>
        <div class="question">${item.q}</div>
        <div class="meta">${item.meta} — Questão ${idx+1} de ${questions.length}</div>
        <div class="options" id="opts"></div>
        <div class="controls">
          <button id="check">Verificar resposta</button>
          <button class="secondary" id="next">Próxima</button>
          <button class="secondary" id="goback">Voltar</button>
        </div>
        <div id="res"></div>
      </div>
      <div style="min-width:140px;text-align:right">
        <div style="font-size:13px;color:var(--muted)">Pontuação</div>
        <div style="font-size:22px;font-weight:700">${score} / ${questions.length}</div>
        <div style="margin-top:18px;color:var(--muted);font-size:12px">Progresso</div>
      </div>
    </div>
  `;
  const optsEl = document.getElementById('opts');
  item.opts.forEach(o=>{
    const d = document.createElement('label'); d.className='opt'; d.tabIndex=0;
    d.innerHTML = `<input type="radio" name="opt" value="${o.k}" aria-label="${o.k}"><div><strong>${o.k}.</strong> ${o.text}</div>`;
    d.addEventListener('click',()=>{ selectOption(d); });
    optsEl.appendChild(d);
  });
  document.getElementById('check').addEventListener('click',check);
  document.getElementById('next').addEventListener('click',next);
  document.getElementById('goback').addEventListener('click',prev);
  updateProgress();
}

function selectOption(el){
  const same = document.querySelectorAll('.opt');
  same.forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected');
  const r = el.querySelector('input'); r.checked=true;
}

function getSelected(){
  const inp = document.querySelector('input[name="opt"]:checked');
  return inp?inp.value:null;
}

function check(){
  const selected = getSelected();
  const resEl = document.getElementById('res');
  resEl.innerHTML='';
  if(!selected){ resEl.innerHTML = '<div class="result wrong">Selecione uma alternativa antes de verificar.</div>'; return }
  const correct = questions[idx].answer;
  const explanation = questions[idx].explanation;
  if(selected === correct){
    score += 1; resEl.innerHTML = `<div class="result correct">Correto — Alternativa ${correct}.</div><div class="explain">${explanation}</div>`;
  } else {
    resEl.innerHTML = `<div class="result wrong">Errado — você marcou ${selected}. Resposta correta: ${correct}.</div><div class="explain">${explanation}</div>`;
  }
  // disable options after check
  document.querySelectorAll('input[name="opt"]').forEach(i=>i.disabled=true);
  updateProgress();
}

function next(){
  if(idx < questions.length-1){ idx++; render(); } else { showFinish(); }
}
function prev(){ if(idx>0){ idx--; render(); } }

function showFinish(){
  quizEl.innerHTML = `
    <div style="text-align:center;padding:18px">
      <h2>Fim do Quiz</h2>
      <p class="meta">Sua pontuação: <strong>${score}</strong> de ${questions.length}</p>
      <p class="meta">% de acerto: <strong>${Math.round((score/questions.length)*100)}%</strong></p>
      <div style="margin-top:12px"><button id="restart">Reiniciar</button> <button class="secondary" id="review">Revisar questões</button></div>
    </div>
  `;
  document.getElementById('restart').addEventListener('click',()=>{ idx=0; score=0; render(); });
  document.getElementById('review').addEventListener('click',()=>{ idx=0; render(); });
  updateProgress(true);
}

function updateProgress(final){
  const bar = document.getElementById('bar');
  const pct = Math.round(((idx + (final?1:0)) / questions.length) * 100);
  bar.style.width = pct + '%';
}

// inicializa
render();
