<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menu - Companhias</title>
  <style>
    :root{
      --gap: 14px;
      --btn-height: 56px;
      --btn-radius: 999px;
      --max-width: 600px;
      --page-bg: linear-gradient(180deg,#f6f8fb,#eef4fb);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--page-bg);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      color:#111;
    }

    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 18px;
      box-sizing:border-box;
    }

    .card{
      width:100%;
      max-width:var(--max-width);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:var(--gap);
      padding:28px;
      box-sizing:border-box;
      background:transparent;
    }

    .btn{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      width:88%;
      max-width:420px;
      height:var(--btn-height);
      padding:0 18px;
      border-radius:var(--btn-radius);
      text-decoration:none;
      color:#fff;
      font-weight:700;
      font-size:18px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.08), 0 10px 20px rgba(10,25,50,0.06);
      transition: transform .12s ease, box-shadow .12s ease;
      overflow:hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active{ transform:translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,0.06); }

    @media (max-width:380px){
      .btn{ width:94%; font-size:16px; height:50px; }
    }

    .btn svg.play{
      position:absolute;
      left:14px;
      width:28px;
      height:28px;
      pointer-events:none;
      filter: drop-shadow(0 2px 0 rgba(0,0,0,0.05));
    }

    /* cores dos 5 botões */
    .btn:nth-child(1){ background: linear-gradient(180deg,#00d1c6,#00a89a); }
    .btn:nth-child(2){ background: linear-gradient(180deg,#ffb400,#ff8a00); }
    .btn:nth-child(3){ background: linear-gradient(180deg,#ff4b4b,#d92f2f); }
    .btn:nth-child(4){ background: linear-gradient(180deg,#5cd65c,#22a722); }
    .btn:nth-child(5){ background: linear-gradient(180deg,#d1d1d1,#8c8c8c); }

    .btn::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
      border-radius:var(--btn-radius);
      pointer-events:none;
    }

    .note{
      margin-top:6px;
      font-size:13px;
      color:#4b5563;
      opacity:0.9;
      text-align:center;
    }
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <div class="card" aria-labelledby="titulo">
      <h1 id="titulo" style="font-size:20px;margin:0 0 6px 0;">Companhias</h1>

      <a class="btn" href="1cia.html" aria-label="Abrir 1cia">
        <svg class="play" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="11" fill="rgba(255,255,255,0.18)"/>
          <path d="M10 8v8l6-4-6-4z" fill="#fff"/>
        </svg>
        1cia
      </a>

      <a class="btn" href="2cia.html" aria-label="Abrir 2cia">
        <svg class="play" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="11" fill="rgba(255,255,255,0.18)"/>
          <path d="M10 8v8l6-4-6-4z" fill="#fff"/>
        </svg>
        2cia
      </a>

      <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLScnGvMdqDxoTaUf4PUAttOpsmR09TveHCY7NR8pQS7AMFjDyQ/viewform?usp=sf_link" aria-label="Abrir 3cia">
        <svg class="play" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="11" fill="rgba(255,255,255,0.18)"/>
          <path d="M10 8v8l6-4-6-4z" fill="#fff"/>
        </svg>
        3cia
      </a>

      <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLScAsayIw8JXcY8sIYy2ZQViqbAoKUSZOoKL27mnwXDIPjgK5w/viewform" aria-label="Abrir 4cia">
        <svg class="play" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="11" fill="rgba(255,255,255,0.18)"/>
          <path d="M10 8v8l6-4-6-4z" fill="#fff"/>
        </svg>
        4cia
      </a>

      <a class="btn" href="5cia.html" aria-label="Abrir 5cia">
        <svg class="play" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="11" fill="rgba(255,255,255,0.18)"/>
          <path d="M10 8v8l6-4-6-4z" fill="#fff"/>
        </svg>
        5cia
      </a>

      <p class="note">Toque em uma companhia para abrir a respectiva página.</p>
    </div>
  </main>
</body>
</html>
