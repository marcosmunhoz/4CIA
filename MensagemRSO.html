<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueleto RSO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2b2b2b;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 860px;
            width: 100%;
            background: #3a3a3a;
            border-radius: 16px;
            padding: 35px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-left: 8px solid #f1c40f;
            border-right: 8px solid #f1c40f;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #f1c40f;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 2px solid #f1c40f;
            padding-bottom: 12px;
            margin-bottom: 28px;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 25px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .campo label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #f1c40f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .campo input, .campo select {
            padding: 8px 12px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #2a2a2a;
            color: #eee;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .campo input:focus, .campo select:focus {
            outline: none;
            border-color: #f1c40f;
            background: #1f1f1f;
            box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.3);
        }

        .campo input::placeholder {
            color: #888;
        }

        .campo input[readonly] {
            background: #2f2f2f;
            color: #ccc;
            cursor: default;
            border-color: #444;
        }

        .campo-full {
            grid-column: 1 / -1;
        }

        .separador {
            grid-column: 1 / -1;
            border-top: 2px dashed #f1c40f;
            margin: 6px 0 10px 0;
            opacity: 0.4;
        }

        .area-texto {
            margin-top: 30px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px 25px;
            border-left: 6px solid #f1c40f;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.7;
            color: #e0e0e0;
            max-height: 500px;
            overflow-y: auto;
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #444;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-copiar {
            background: #f1c40f;
            color: #1e1e1e;
        }
        .btn-copiar:hover {
            background: #d4ac0d;
            transform: translateY(-2px);
        }

        .btn-wpp {
            background: #25d366;
            color: #fff;
        }
        .btn-wpp:hover {
            background: #1da85c;
            transform: translateY(-2px);
        }

        .btn-limpar {
            background: #e74c3c;
            color: #fff;
        }
        .btn-limpar:hover {
            background: #c0392b;
        }

        .feedback {
            text-align: center;
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            min-height: 1.8rem;
            color: #f1c40f;
        }

        @media (max-width: 640px) {
            .container {
                padding: 20px 15px;
            }
            .form-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .area-texto {
                font-size: 0.85rem;
                padding: 15px;
                max-height: 400px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 0.85rem;
                width: 100%;
                justify-content: center;
            }
            .botoes {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">

    <h1>Esqueleto RSO</h1>

    <div class="form-grid">

        <!-- Local fixo (RODOVIA) -->
        <div class="campo campo-full">
            <label>Local</label>
            <input type="text" id="local" value="SP 330 KM 151,600 SUL - RODOVIA ANHANGUERA" readonly>
        </div>

        <!-- Data automática -->
        <div class="campo">
            <label>Data (DD/MM/AA)</label>
            <input type="text" id="data" readonly style="font-weight:bold; color:#f1c40f;">
        </div>

        <!-- Equipe / Tipo (sem valor padrão) -->
        <div class="campo">
            <label>Equipe / Tipo</label>
            <select id="equipeTipo">
                <option value="">-- Selecione --</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="TOR">TOR</option>
                <option value="DEJEM">DEJEM</option>
                <option value="ADM">ADM</option>
            </select>
        </div>

        <!-- Turno (sem valor padrão) -->
        <div class="campo">
            <label>Turno</label>
            <select id="turno">
                <option value="">-- Selecione --</option>
                <option value="DIURNA">Diurna</option>
                <option value="NOTURNA">Noturna</option>
            </select>
        </div>

        <!-- Base ou Viatura (sem valor padrão) -->
        <div class="campo">
            <label>Base / Viatura</label>
            <select id="baseViatura">
                <option value="">-- Selecione --</option>
                <option value="BASE">BASE</option>
                <option value="VIATURA">VIATURA</option>
            </select>
        </div>

        <!-- Hora -->
        <div class="campo">
            <label>Hora da assunção</label>
            <input type="text" id="hora" placeholder="Ex: 04:45">
        </div>

        <!-- PDR (viatura) -->
        <div class="campo">
            <label>PDR (ex: 44.0)</label>
            <input type="text" id="pdr" placeholder="Ex: 44.0">
        </div>

        <!-- Encarregado -->
        <div class="campo">
            <label>PM Encarregado</label>
            <input type="text" id="encarregado" placeholder="Ex: GUIDINI">
        </div>

        <!-- Motorista (opcional) -->
        <div class="campo">
            <label>PM Motorista (opcional)</label>
            <input type="text" id="motorista" placeholder="Deixe em branco se não houver">
        </div>

        <div class="separador"></div>

        <!-- Dados do Encarregado -->
        <div class="campo"><label>Pistola GLOCK (Enc.)</label><input type="text" id="pistola_enc" placeholder="Nº"></div>
        <div class="campo"><label>Colete (Enc.)</label><input type="text" id="colete_enc" placeholder="Nº"></div>
        <div class="campo"><label>Algema (Enc.)</label><input type="text" id="algema_enc" placeholder="Nº"></div>
        <div class="campo"><label>COP (Enc.)</label><input type="text" id="cop_enc" placeholder="Nº"></div>

        <div class="separador"></div>

        <!-- Dados do Motorista (opcionais) -->
        <div class="campo"><label>Pistola GLOCK (Mot.)</label><input type="text" id="pistola_mot" placeholder="Nº"></div>
        <div class="campo"><label>Colete (Mot.)</label><input type="text" id="colete_mot" placeholder="Nº"></div>
        <div class="campo"><label>Algema (Mot.)</label><input type="text" id="algema_mot" placeholder="Nº"></div>
        <div class="campo"><label>COP (Mot.)</label><input type="text" id="cop_mot" placeholder="Nº"></div>

        <div class="campo"><label>CNH Registro</label><input type="text" id="cnh_reg" placeholder="Nº"></div>
        <div class="campo"><label>CNH Validade</label><input type="text" id="cnh_val" placeholder="DD/MM/AAAA"></div>
        <div class="campo"><label>CNH Categoria</label><input type="text" id="cnh_cat" placeholder="Ex: D"></div>

        <div class="separador"></div>

        <!-- PPRI -->
        <div class="campo">
            <label>PPRI Nº (somente número)</label>
            <input type="text" id="ppri" placeholder="Ex: 31826">
        </div>
    </div>

    <div class="botoes">
        <button class="btn btn-copiar" id="btnCopiar">Copiar texto</button>
        <button class="btn btn-wpp" id="btnWhats">Salvar no WhatsApp</button>
        <button class="btn btn-limpar" id="btnLimpar">Limpar campos</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="area-texto" id="textoFinal"></div>
</div>

<script>
    (function() {
        // Referências dos campos
        const localInput = document.getElementById('local');
        const dataInput = document.getElementById('data');
        const equipeTipoSelect = document.getElementById('equipeTipo');
        const turnoSelect = document.getElementById('turno');
        const baseViaturaSelect = document.getElementById('baseViatura');
        const horaInput = document.getElementById('hora');
        const pdrInput = document.getElementById('pdr');
        const encarregadoInput = document.getElementById('encarregado');
        const motoristaInput = document.getElementById('motorista');

        const pistolaEnc = document.getElementById('pistola_enc');
        const coleteEnc = document.getElementById('colete_enc');
        const algemaEnc = document.getElementById('algema_enc');
        const copEnc = document.getElementById('cop_enc');

        const pistolaMot = document.getElementById('pistola_mot');
        const coleteMot = document.getElementById('colete_mot');
        const algemaMot = document.getElementById('algema_mot');
        const copMot = document.getElementById('cop_mot');
        const cnhReg = document.getElementById('cnh_reg');
        const cnhVal = document.getElementById('cnh_val');
        const cnhCat = document.getElementById('cnh_cat');

        const ppriInput = document.getElementById('ppri');

        const textoFinal = document.getElementById('textoFinal');
        const feedback = document.getElementById('feedback');

        // Data atual automática
        function atualizarData() {
            const hoje = new Date();
            const dia = String(hoje.getDate()).padStart(2, '0');
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const ano = String(hoje.getFullYear()).slice(-2);
            dataInput.value = `${dia}/${mes}/${ano}`;
        }
        atualizarData();

        // Função principal de geração do texto
        function gerarTexto() {
            const local = localInput.value.trim();
            const data = dataInput.value.trim();
            const equipeTipo = equipeTipoSelect.value;
            const turno = turnoSelect.value;
            const baseViatura = baseViaturaSelect.value;
            const hora = horaInput.value.trim();
            const pdr = pdrInput.value.trim();
            const enc = encarregadoInput.value.trim();
            const mot = motoristaInput.value.trim();

            const p1 = pistolaEnc.value.trim();
            const c1 = coleteEnc.value.trim();
            const a1 = algemaEnc.value.trim();
            const cop1 = copEnc.value.trim();

            const p2 = pistolaMot.value.trim();
            const c2 = coleteMot.value.trim();
            const a2 = algemaMot.value.trim();
            const cop2 = copMot.value.trim();
            const cnhR = cnhReg.value.trim();
            const cnhV = cnhVal.value.trim();
            const cnhC = cnhCat.value.trim();

            const ppriNum = ppriInput.value.trim() || '';

            let linhas = [];

            // Linha 1: Local (sempre)
            if (local) linhas.push(local);

            // Linha 2: Data + Equipe + Turno (só se houver data)
            let linhaEquipe = '';
            if (data) linhaEquipe += data;
            if (equipeTipo) linhaEquipe += ` - EQUIPE ${equipeTipo}`;
            if (turno) linhaEquipe += ` ${turno}`;
            if (linhaEquipe) linhas.push(linhaEquipe);

            linhas.push('');
            linhas.push('COMPOSIÇÃO DA US:');
            linhas.push('');

            // PDR e BOP
            if (pdr) {
                linhas.push(`PDR ${pdr} - BOP 330/3`);
            } else {
                linhas.push('BOP 330/3');
            }
            linhas.push('');

            // Encarregado
            if (enc) {
                linhas.push(`SD PM ${enc.toUpperCase()} NA FUNÇÃO DE ENCARREGADO`);
                linhas.push('');
                if (p1) linhas.push(`Nº PISTOLA GLOCK: ${p1}`);
                if (c1) linhas.push(`Nº COLETE: ${c1}`);
                if (a1) linhas.push(`Nº ALGEMA: ${a1}`);
                if (cop1) linhas.push(`Nº COP: ${cop1}`);
                linhas.push('');
            }

            // Motorista (opcional)
            if (mot) {
                linhas.push(`SD PM ${mot.toUpperCase()} NA FUNÇÃO DE MOTORISTA`);
                linhas.push('');
                if (p2) linhas.push(`Nº PISTOLA GLOCK: ${p2}`);
                if (c2) linhas.push(`Nº COLETE: ${c2}`);
                if (a2) linhas.push(`Nº ALGEMA: ${a2}`);
                if (cop2) linhas.push(`Nº COP: ${cop2}`);
                if (cnhR) linhas.push(`CNH REGISTRO: ${cnhR}`);
                if (cnhV) linhas.push(`VALIDADE: ${cnhV}`);
                if (cnhC) linhas.push(`CATEGORIA: ${cnhC}`);
                linhas.push('');
            }

            // Hora e assunção
            if (hora) {
                linhas.push(`AS ${hora} HORAS, ASSUNÇÃO DO SERVIÇO PELA BOP 330/3.`);
            } else {
                linhas.push('AS XX HORAS, ASSUNÇÃO DO SERVIÇO PELA BOP 330/3.');
            }
            linhas.push('SEM OCORRÊNCIAS PENDENTES.');

            // Base ou Viatura
            if (baseViatura === 'BASE') {
                linhas.push('BASE LIMPA E ABASTECIDA.');
            } else if (baseViatura === 'VIATURA') {
                linhas.push('VIATURA LIMPA E ABASTECIDA.');
            } else {
                linhas.push('BASE/VIATURA LIMPA E ABASTECIDA.'); // se não selecionou
            }
            linhas.push('');

            // PPRI
            if (ppriNum) {
                linhas.push(`PPRI Nº ${ppriNum}/441/2026`);
            } else {
                linhas.push('PPRI Nº _____/441/2026');
            }
            linhas.push('CUMPRIMENTO DAS ATIVIDADES E OPERAÇÕES CONFORME DETERMINA O PPRI.');
            linhas.push('PRODUTIVIDADE E RESULTADOS FORAM INSERIDOS NO SISTEMA DO MAPA FORÇA, PPRI E SICOORDOP.');

            return linhas.join('\n');
        }

        function atualizarVisualizacao() {
            textoFinal.textContent = gerarTexto();
        }

        // Vincula eventos a todos os campos
        const todosInputs = document.querySelectorAll('input, select');
        todosInputs.forEach(el => {
            el.addEventListener('input', atualizarVisualizacao);
            el.addEventListener('change', atualizarVisualizacao);
        });

        atualizarVisualizacao();

        // Botão Copiar
        document.getElementById('btnCopiar').addEventListener('click', function() {
            const texto = gerarTexto();
            navigator.clipboard.writeText(texto).then(() => {
                feedback.textContent = 'Texto copiado para a área de transferência!';
                feedback.style.color = '#f1c40f';
                setTimeout(() => feedback.textContent = '', 3500);
            }).catch(() => {
                const area = document.createElement('textarea');
                area.value = texto;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                document.body.removeChild(area);
                feedback.textContent = 'Texto copiado!';
                feedback.style.color = '#f1c40f';
                setTimeout(() => feedback.textContent = '', 3500);
            });
        });

        // Botão WhatsApp
        document.getElementById('btnWhats').addEventListener('click', function() {
            const texto = gerarTexto();
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
            feedback.textContent = 'Abrindo WhatsApp...';
            feedback.style.color = '#25d366';
            setTimeout(() => feedback.textContent = '', 3000);
        });

        // Botão Limpar – zera todos os campos editáveis
        document.getElementById('btnLimpar').addEventListener('click', function() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(inp => {
                if (inp.id === 'local' || inp.id === 'data') return; // mantém fixos
                inp.value = '';
            });
            // Reseta selects para a opção vazia
            const selects = document.querySelectorAll('select');
            selects.forEach(sel => {
                sel.value = '';
            });
            atualizarVisualizacao();
            feedback.textContent = 'Campos limpos (mantidos local e data)';
            feedback.style.color = '#f1c40f';
            setTimeout(() => feedback.textContent = '', 3000);
        });

    })();
</script>

</body>
</html>
