<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MBFT — Manual Brasileiro de Fiscalização de Trânsito</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: #f6f7f8;
      margin: 0;
      padding: 0;
      color: #111;
    }
    header {
      background: #00994d;
      color: white;
      text-align: center;
      padding: 16px;
    }
    h1 { margin: 0; font-size: 20px; }
    main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
    }
    section {
      background: white;
      border-radius: 10px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .pdf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      background: #f2f2f2;
      padding: 10px 15px;
      border-bottom: 1px solid #ddd;
    }
    .pdf-header h2 { margin: 0; font-size: 16px; }
    .pdf-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pdf-buttons button {
      background: #00994d;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .pdf-buttons button:hover { background: #007a3d; }
    iframe { width: 100%; height: 90vh; border: none; }
    footer {
      text-align: center;
      padding: 12px;
      font-size: 13px;
      color: #444;
    }
    @media (max-width: 768px) {
      iframe { height: 85vh; }
      .pdf-header { flex-direction: column; align-items: stretch; gap: 8px; }
      .pdf-buttons { justify-content: center; }
    }
  </style>
</head>
<body>

<header>
  <h1>Manual Brasileiro de Fiscalização de Trânsito (MBFT)</h1>
</header>

<main>
  <section>
    <div class="pdf-header">
      <h2>Visualizador do MBFT</h2>
      <div class="pdf-buttons">
        <button onclick="baixarPDF()">📥 Baixar PDF</button>
        <button onclick="telaCheia()">⛶ Tela Cheia</button>
      </div>
    </div>
    <!-- Use seu link real do GitHub Pages aqui -->
    <iframe id="pdfFrame"
      src="https://drive.google.com/viewerng/viewer?embedded=true&url=https://marcosmunhoz.github.io/4CIA/mbvt20222.pdf">
    </iframe>
  </section>
</main>

<footer>
  Arquivo: <strong>MBFT — Manual Brasileiro de Fiscalização de Trânsito</strong><br>
  Fonte: <a href="https://www.gov.br/infraestrutura/pt-br/assuntos/transito/conteudo/manual-brasileiro-de-fiscalizacao-de-transito" target="_blank">gov.br/infraestrutura</a>
</footer>

<script>
function baixarPDF() {
  const link = document.createElement('a');
  link.href = 'mbvt20222.pdf';
  link.download = 'MBFT.pdf';
  link.click();
}
function telaCheia() {
  const iframe = document.getElementById('pdfFrame');
  if (iframe.requestFullscreen) iframe.requestFullscreen();
  else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
  else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
}
</script>

</body>
</html>
