    ul.menu-horizontal > li > a:hover,

    ul.submenu-horizontal {

    @media (max-width: 768px) {

    /* Mantive sua definição global */

    /* ---------- VÍDEO DE FUNDO CORRIGIDO ---------- */

      height: 100%;

      object-position: center center;
      z-index: -1;
      background-color: #000;

    /* Menu circular principal - AUMENTADO */
    .menu-circle {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 650px; /* Aumentado de 500px */
      height: 650px; /* Aumentado de 500px */
      transform: translate(-50%, -50%);

      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      transition: all 0.3s ease;
      z-index: 100;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      width: 130px; /* Aumentado de 100px */
      height: 130px; /* Aumentado de 100px */

      height: 75px; /* Aumentado de 60px */

      pointer-events: none; 
      transition: transform 0.3s ease;

    }

    /* Ajustes nas posições para o tamanho maior */

    .menu-item:nth-child(2) { transform: rotate(45deg) translate(260px) rotate(-45deg); }
    .menu-item:nth-child(3) { transform: rotate(90deg) translate(260px) rotate(-90deg); }

    .menu-item:nth-child(5) { transform: rotate(180deg) translate(260px) rotate(-180deg); }

    .menu-item:nth-child(7) { transform: rotate(270deg) translate(260px) rotate(-270deg); }
    .menu-item:nth-child(8) { transform: rotate(315deg) translate(260px) rotate(-315deg); }

    /* Submenu circular - AUMENTADO */

      height: 520px; /* Aumentado de 400px */

    .submenu-item {

      font-size: 13px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: bold;
      line-height: 1.2;
      user-select: none;
      transition: all 0.3s ease;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .submenu-icon { 
      width: 65px; /* Aumentado de 50px */
      height: 65px; /* Aumentado de 50px */
      object-fit: contain; 
      margin-bottom: 5px;
      transition: transform 0.3s ease;

    .submenu-text { font-size: 13px; margin-bottom: 2px; }

    .submenu-item a {

      .submenu-item:nth-child(5) { transform: rotate(288deg) translate(110px) rotate(-288deg); }
    }
  </style>

  <script>
    // Funções do menu horizontal
    window.addEventListener('scroll', function() {
      const nav = document.getElementById('mainNav');
      if (window.scrollY > 50) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    });

    document.querySelectorAll('ul.menu-horizontal > li > a').forEach(link => {
      link.addEventListener('click', function(e) {
        document.querySelectorAll('ul.submenu-horizontal.active').forEach(sub => {
          if (sub !== this.nextElementSibling) {
            sub.classList.remove('active');
          }
        });

        if (this.nextElementSibling && this.nextElementSibling.classList.contains('submenu-horizontal')) {
          e.preventDefault();
          this.nextElementSibling.classList.toggle('active');

          if (this.nextElementSibling.classList.contains('active')) {
            document.body.classList.add('menu-open');
          } else {
            document.body.classList.remove('menu-open');
          }
        }
      });
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('nav')) {
        document.querySelectorAll('.submenu-horizontal.active').forEach(sub => {
          sub.classList.remove('active');
          document.body.classList.remove('menu-open');
        });
      }
    });

    // Funções do menu circular
    function toggleSubmenu(index) {
      const submenus = document.querySelectorAll(".submenu-circle");
      submenus.forEach(menu => menu.style.display = "none");

      const submenu = document.getElementById("submenu" + index);
      if (submenu) {
        submenu.style.display = "flex";
      }
    }

    document.addEventListener("click", function(e) {
      if (!e.target.classList.contains("menu-item") &&
          !e.target.closest('.menu-item') &&
          !e.target.classList.contains("submenu-item") &&
          !e.target.closest('.submenu-item')) {
        const submenus = document.querySelectorAll(".submenu-circle");
        submenus.forEach(menu => menu.style.display = "none");
      }
    });
  </script>
