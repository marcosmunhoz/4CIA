<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menu - BPRv</title>
  <style>
    :root{
      --gap: 14px;
      --btn-height: 56px;
      --btn-radius: 999px;
      --max-width: 600px;
      --page-bg-light: linear-gradient(180deg,#f6f8fb,#eef4fb);
      --page-bg-dark: linear-gradient(180deg,#0f172a,#1e293b);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--page-bg-light);
      color:#111;
      transition:background 0.4s ease, color 0.4s ease;
    }

    body.dark{
      background:var(--page-bg-dark);
      color:#f1f5f9;
    }

    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 18px;
      box-sizing:border-box;
      position:relative;
    }

    /* Botão modo claro/escuro */
    .toggle-theme{
      position:absolute;
      top:14px;
      right:18px;
      background:none;
      border:none;
      cursor:pointer;
      font-size:26px;
      color:#333;
      transition: transform .2s ease;
      z-index:10;
    }

    body.dark .toggle-theme{
      color:#f1f5f9;
    }

    .toggle-theme:active{
      transform:scale(0.9);
    }

    .card{
      width:100%;
      max-width:var(--max-width);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:var(--gap);
      padding:28px;
      box-sizing:border-box;
      background:transparent;
    }

    .btn{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      width:88%;
      max-width:420px;
      height:var(--btn-height);
      padding:0 18px;
      border-radius:var(--btn-radius);
      text-decoration:none;
      color:#fff;
      font-weight:700;
      font-size:18px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.08), 0 10px 20px rgba(10,25,50,0.06);
      transition: transform .12s ease, box-shadow .12s ease;
      overflow:hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active{
      transform:translateY(2px);
      box-shadow:0 3px 0 rgba(0,0,0,0.06);
    }

    @media (max-width:380px){
      .btn{ width:94%; font-size:16px; height:50px; }
    }

    /* Cores dos botões */
    .card .btn:nth-of-type(1){ background: linear-gradient(180deg,#00d1c6,#00a89a); }
    .card .btn:nth-of-type(2){ background: linear-gradient(180deg,#ffb400,#ff8a00); }
    .card .btn:nth-of-type(3){ background: linear-gradient(180deg,#ff4b4b,#d92f2f); }
    .card .btn:nth-of-type(4){ background: linear-gradient(180deg,#5cd65c,#22a722); }
    .card .btn:nth-of-type(5){ background: linear-gradient(180deg,#5b6cff,#2a46d9); }
    .card .btn:nth-of-type(6){ background: linear-gradient(180deg,#4fc3f7,#0288d1); }

    .btn::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,rgba(255,255,255,0.12),rgba(255,255,255,0.02));
      border-radius:var(--btn-radius);
      pointer-events:none;
    }

    .note{
      margin-top:6px;
      font-size:13px;
      color:#4b5563;
      opacity:0.9;
      text-align:center;
    }

    body.dark .note{
      color:#cbd5e1;
    }
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <button class="toggle-theme" id="themeToggle" title="Alternar modo de fundo">🌙</button>

    <div class="card" aria-labelledby="titulo">
      <h1 id="titulo" style="font-size:20px;margin:0 0 6px 0;">Manutenção de 1° Escalão</h1>

      <a class="btn" href="1%C2%B0%20BPRv.html">1° BPRv</a>
      <a class="btn" href="2%C2%B0%20BPRv.html">2° BPRv</a>
      <a class="btn" href="3%C2%B0%20BPRv.html">3° BPRv</a>
      <a class="btn" href="4bprv.html">4° BPRv</a>
      <a class="btn" href="5%C2%B0%20BPRv.html">5° BPRv</a>
      <a class="btn" href="6%C2%B0%20BPRv.html">6° BPRv</a>

      <p class="note">Toque em um botão para abrir a página correspondente.</p>
    </div>
  </main>

  <script>
    const toggle = document.getElementById('themeToggle');
    const body = document.body;

    // 🔹 Verifica se já existe preferência salva no navegador
    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark');
      toggle.textContent = '☀️';
    }

    // 🔹 Alterna o tema e salva a preferência
    toggle.addEventListener('click', () => {
      body.classList.toggle('dark');
      const isDark = body.classList.contains('dark');
      toggle.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
