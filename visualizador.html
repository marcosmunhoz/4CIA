<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Simulado CEP — Visualizador (Amostra 20 questões)</title>
<style>
:root{--accent:#005bb5;--bg:#ffffff;--muted:#444}
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:#111}
.header{background:linear-gradient(90deg,var(--accent),#2a9df4);color:#fff;padding:16px}
.container{max-width:900px;margin:18px auto;padding:16px}
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
.meta{color:var(--muted);font-size:13px}
.title{font-weight:700;margin-top:8px}
.choices{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.choice{border:1px solid #e6eefc;padding:12px;border-radius:8px;cursor:pointer;background:#fbfdff}
.choice:hover{background:#f0f8ff}
.choice.selected{outline:2px solid #cfe6ff;background:#eef6ff}
.explain{margin-top:14px;padding:12px;border-radius:8px;background:#fbfdff;border:1px solid #eef6ff;display:none;white-space:pre-wrap}
.footer-controls{position:fixed;left:0;right:0;bottom:0;padding:14px;background:rgba(255,255,255,0.96);display:flex;justify-content:center;gap:12px;box-shadow:0 -6px 18px rgba(0,0,0,0.04)}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.secondary{background:#fff;color:var(--accent);border:1px solid #cfe6ff}
.progress{height:8px;background:#e9eef6;border-radius:999px;overflow:hidden;margin-top:8px}
.progress > i{display:block;height:100%;background:var(--accent);width:0%}
.footer-note{text-align:center;padding:10px;color:#666;font-size:12px;margin-top:60px}
.hidden-credit{font-size:10px;color:#ffffff}
</style>
</head>
<body>
<div class="header"><div style="max-width:900px;margin:0 auto;"><h2>Simulado CEP — Visualizador (Amostra)</h2><div style="color:#fff;font-size:13px">20 questões — CTB & MBFT (explicações detalhadas)</div></div></div>

<main class="container">
  <div id="card" class="card"></div>
  <div class="progress"><i id="bar" style="width:0%"></i></div>
  <div id="result" class="card" style="display:none"></div>
  <div style="height:120px"></div>
</main>

<div class="footer-controls">
  <button id="prev" class="btn secondary">Anterior</button>
  <button id="next" class="btn secondary">Próxima</button>
  <button id="finish" class="btn">Finalizar</button>
  <button id="reset" class="btn secondary">Reiniciar</button>
</div>

<footer class="footer-note">Simulado CEP — Desenvolvido por SD PM 194528-9 GUIDINI</footer>

<script>
// ---------- QUESTÕES (20 amostra) ----------
const QUESTIONS = [
  {
    "q": "1) Segundo o Art. 165 do CTB, qual a principal consequência administrativa para quem dirige sob influência de álcool?",
    "choices": [
      "Infração gravíssima — multa, suspensão do direito de dirigir e possibilidade de medidas penais quando houver crime",
      "Infração leve — advertência por escrito",
      "Multa média sem suspensão da CNH",
      "Apenas retenção do veículo até sobriedade"
    ],
    "answer": 0,
    "explain": "Base legal: Art. 165, CTB.\n\nExplicação (MBFT): Conduzir sob influência de álcool é infração gravíssima e sujeita o condutor a multa e suspensão do direito de dirigir; situações com lesão ou risco configuram crime e medidas penais. O agente deve lavrar auto, descrever sinais de alteração, coletar provas e seguir procedimento para notificação e instauração administrativa."
  },
  {
    "q": "2) No caso de recusa do condutor em submeter-se ao etilômetro (Art.165-A), qual a medida administrativa prevista?",
    "choices": [
      "Infração administrativa — multa e registro da recusa no auto de infração",
      "Isenção de penalidade enquanto não houver exame clínico",
      "Detenção imediata sem auto de infração",
      "Advertência verbal e liberação"
    ],
    "answer": 0,
    "explain": "Base legal: Art. 165-A, CTB.\n\nExplicação (MBFT): A recusa é tratada como infração administrativa. O agente deve registrar detalhadamente a recusa no auto, identificar testemunhas, e aplicar a penalidade prevista, observando instruções do MBFT sobre documentação do fato."
  },
  {
    "q": "3) Ao identificar veículo circulando sem registro/licenciamento (Art.230 V), qual medida administrativa o agente deve adotar?",
    "choices": [
      "Remoção do veículo e aplicação de multa (infração gravíssima)",
      "Apenas advertência escrita ao proprietário",
      "Retenção temporária sem remoção até apresentação de documento",
      "Permissão para circulação mediante termo de responsabilidade"
    ],
    "answer": 0,
    "explain": "Base legal: Art. 230, V, CTB.\n\nExplicação (MBFT): Veículo sem registro/licenciamento configura infração gravíssima; aplica-se multa e medida administrativa de remoção. O MBFT determina documentação da irregularidade, comunicação ao proprietário e procedimentos para liberação após regularização."
  },
  {
    "q": "4) Para-brisa com trinca que compromete a visibilidade do condutor deve resultar em:",
    "choices": [
      "Autuação e retenção do veículo até conserto; remoção se houver risco iminente",
      "Advertência e autorização de circulação por 24 horas",
      "Multa leve sem retenção",
      "Permissão para circular com aviso escrito"
    ],
    "answer": 0,
    "explain": "Base legal: Normas sobre condições do veículo (CTB/MBFT).\n\nExplicação (MBFT): Quando a trinca compromete visibilidade, o agente deve autuar, registrar evidências (fotos) e ordenar retenção até o conserto; se risco iminente for verificado, a remoção pode ser aplicada para proteger segurança viária."
  },
  {
    "q": "5) Instalar lâmpadas LED não homologadas nos faróis do veículo implica:",
    "choices": [
      "Autuação por alteração não autorizada das características do veículo; multa e retenção até regularização",
      "Isenção por melhorar a visibilidade do condutor",
      "Apenas notificação sem penalidade",
      "Substituição facultativa sem obrigação de homologar"
    ],
    "answer": 0,
    "explain": "Base legal: Art. 230 (alteração de características), resoluções do CONTRAN.\n\nExplicação (MBFT): Alterações de iluminação sem homologação podem prejudicar segurança de terceiros; o agente autua e determina regularização técnica (retirada ou homologação), com possível retenção até adequação."
  },
  {
    "q": "6) Película de controle solar não homologada que reduza visibilidade noturna deve ser tratada como:",
    "choices": [
      "Irregularidade sujeita à exigência de remoção e aplicação de multa",
      "Aceita se for assinada pelo proprietário do veículo",
      "Apenas orientação para remoção futura",
      "Permitida sem restrições se instalada anteriormente"
    ],
    "answer": 0,
    "explain": "Base legal: Resoluções do CONTRAN e MBFT.\n\nExplicação (MBFT): Películas que comprometam visibilidade são proibidas; o agente exige remoção imediata, autua e anexa evidências ao auto para instrução administrativa."
  },
  {
    "q": "7) Qual a finalidade primária do cronotacógrafo em veículos de transporte?",
    "choices": [
      "Registrar tempos de direção e descanso para fiscalização da jornada",
      "Medir consumo de combustível do veículo",
      "Controlar temperatura da carga transportada",
      "Registrar apenas a velocidade média em trechos"
    ],
    "answer": 0,
    "explain": "Base legal: Normas sobre transporte de cargas e MBFT.\n\nExplicação (MBFT): Cronotacógrafo documenta jornada de trabalho do condutor (tempos dirigindo/descanso), instrumento para autuação em caso de excesso de jornada ou violação de períodos de repouso."
  },
  {
    "q": "8) Número ONU (UN) correto para o etanol no transporte rodoviário de produtos perigosos:",
    "choices": [
      "UN1170",
      "UN1203",
      "UN1202",
      "UN1978"
    ],
    "answer": 0,
    "explain": "Base legal: Lista ONU de substâncias perigosas.\n\nExplicação (MBFT): Etanol é identificado por UN1170; documentos do transporte (fichas FISPQ/SDS, Nota de Transporte) e plaquetas devem conter esse código para permitir resposta a emergências e enquadramento legal."
  },
  {
    "q": "9) Placa R-19, segundo o manual de sinalização, refere-se geralmente a:",
    "choices": [
      "Regulamentação de parada/embarque e desembarque conforme legenda da placa",
      "Sinal de advertência de perigo à frente",
      "Sinal indicativo de serviço turístico",
      "Placa de indicação de velocidade máxima"
    ],
    "answer": 0,
    "explain": "Base legal: Manual Brasileiro de Sinalização.\n\nExplicação (MBFT): Placas regulamentadoras (R) estabelecem regras de conduta; R-19 costuma tratar de regras de parada/embarque conforme o texto na placa e o manual de sinalização aplica-se para autuação por descumprimento."
  },
  {
    "q": "10) Segundo o Anexo I do CTB, 'via' é definida como:",
    "choices": [
      "Área destinada à circulação de veículos e pessoas, compreendendo pista, acostamento e passeio",
      "Somente a pista de rolamento destinada a automóveis",
      "Qualquer área pública fora de áreas urbanas",
      "Exclusivamente rodovias federais"
    ],
    "answer": 0,
    "explain": "Base legal: Anexo I, CTB - definições.\n\nExplicação (MBFT): As definições do Anexo I são normativas para enquadramento de infrações e delimitação de competências; 'via' tem compreensão ampla incluindo características úteis para fiscalizações."
  },
  {
    "q": "11) Categoria A da CNH habilita para conduzir:",
    "choices": [
      "Motocicletas e veículos de duas ou três rodas",
      "Veículos de carga com PBT acima de 3.500 kg",
      "Automóveis de passeio com reboque leve",
      "Transportes coletivos de passageiros"
    ],
    "answer": 0,
    "explain": "Base legal: CTB — categorias de habilitação.\n\nExplicação (MBFT): Categoria A é específica para veículos de duas ou três rodas motorizadas; requisitos incluem provas teóricas e práticas específicas."
  },
  {
    "q": "12) Categoria B da CNH autoriza para:",
    "choices": [
      "Automóveis de passeio até 3.500 kg e lotação até 8 passageiros",
      "Ônibus e micro-ônibus para transporte de passageiros",
      "Veículos de carga acima de 3.500 kg",
      "Veículos articulados de carga"
    ],
    "answer": 0,
    "explain": "Base legal: CTB — categorias de habilitação.\n\nExplicação (MBFT): Categoria B é para automóveis e utilitários leves; cargas e lotações superiores exigem categorias C, D ou E conforme o caso."
  },
  {
    "q": "13) Qual a diferença essencial entre caminhão e caminhão-trator (trator de unidade)?",
    "choices": [
      "Caminhão é veículo de carga autônomo; caminhão-trator é projetado para tracionar semirreboques",
      "Não há diferença legal entre ambos",
      "Caminhão-trator é apenas para uso urbano",
      "Caminhão sempre possui cabine dupla"
    ],
    "answer": 0,
    "explain": "Base legal: Regras de classificação veicular e registro.\n\nExplicação (MBFT): Classificação influencia registro, tacógrafo quando aplicável, e responsabilidades do transportador; fiscalização verifica composição e documentação específica."
  },
  {
    "q": "14) Ao encontrar transporte de produto perigoso sem FISPQ e sem placas UN, a ação imediata do agente é:",
    "choices": [
      "Autuar, reter a carga e comunicar autoridade competente, impedindo continuidade até regularização",
      "Liberar com termo de responsabilidade da transportadora",
      "Aplicar somente multa administrativa e permitir prosseguimento",
      "Encaminhar somente à guarda municipal para registro"
    ],
    "answer": 0,
    "explain": "Base legal: Normas sobre transporte de produtos perigosos, ANTT e MBFT.\n\nExplicação (MBFT): Falta de documentação é risco à segurança; agente deve autuar, reter/segregar carga, comunicar órgãos competentes e garantir medidas de proteção."
  },
  {
    "q": "15) Quando é cabível a medida administrativa de remoção do veículo conforme MBFT/CTB?",
    "choices": [
      "Quando a irregularidade comprometer a segurança ou quando o veículo estiver impedido de transitar por ausência de licenciamento",
      "Sempre que houver pequeno dano estético no para-choque",
      "Apenas quando o motorista for inabilitado por crime não relacionado ao trânsito",
      "Quando o condutor recusar a prestar documento sem infração evidente"
    ],
    "answer": 0,
    "explain": "Base legal: Art. 230 e MBFT (procedimentos de medidas administrativas).\n\nExplicação (MBFT): Remoção é medida proporcional quando há risco ou vedação à circulação; deve ser fundamentada no auto e seguir instruções para guarda e liberação."
  },
  {
    "q": "16) Art. 242 (falsa declaração) no CTB trata principalmente de:",
    "choices": [
      "Falsa declaração de domicílio ou dados para fins de registro/habilitação — infração gravíssima",
      "Informações incorretas em notas fiscais apenas",
      "Furto de documentos pessoais em delegacias",
      "Contestação de multa por erro de placa"
    ],
    "answer": 0,
    "explain": "Base legal: Art. 242, CTB.\n\nExplicação (MBFT): Falsa declaração é infração séria; o agente deve registrar e encaminhar para análise administrativa, com possibilidade de multa e sanções cabíveis."
  },
  {
    "q": "17) Placa adulterada ou ilegível na via: qual é a ação fiscalizadora correta?",
    "choices": [
      "Autuação e apreensão para verificação e identificação; possível remoção se for o caso",
      "Advertência e solicitação de emenda no local",
      "Liberação com recomendação de conserto posterior",
      "Aplicar multa indireta ao proprietário do local público"
    ],
    "answer": 0,
    "explain": "Base legal: Art. 230 incisos sobre identificação e condições do veículo; MBFT procedimentos para apreensão de itens adulterados.\n\nExplicação (MBFT): Placas adulteradas impedem identificação e segurança; apreensão e autuação são medidas usuais para investigação e regularização."
  },
  {
    "q": "18) Quem é o órgão normativo máximo do Sistema Nacional de Trânsito responsável por resoluções técnicas?",
    "choices": [
      "CONTRAN (Conselho Nacional de Trânsito)",
      "DETRAN estadual",
      "ANTT (exclusivamente para rodovias)",
      "Prefeitura municipal"
    ],
    "answer": 0,
    "explain": "Base legal: Estrutura do Sistema Nacional de Trânsito.\n\nExplicação (MBFT): CONTRAN é órgão normativo que edita resoluções; DETRAN executa a nível estadual; ANTT regula transportes interestaduais (incluindo perigosos) conforme competência."
  },
  {
    "q": "19) Em fiscalização de transporte coletivo, o que é obrigatório quanto ao tacógrafo e documentação do motorista?",
    "choices": [
      "Registro de jornada (cronotacógrafo ou documentos equivalentes) e documentação do motorista atualizada e à mão",
      "Apenas documento do veículo é suficiente",
      "Somente a carteira do cobrador é exigida",
      "Nenhuma documentação é requerida em fiscalizações locais"
    ],
    "answer": 0,
    "explain": "Base legal: Normas sobre transporte coletivo, MBFT e regulamentações específicas.\n\nExplicação (MBFT): Fiscalização verifica tacógrafo/cronicidade de jornada, cartões de controle, ticketings e documentos do motorista para compliance de jornada e segurança."
  },
  {
    "q": "20) Em abordagem por alteração de características de veículo (ex.: alterações no escapamento), qual o procedimento correto do agente?",
    "choices": [
      "Autuar, descrever tecnicamente a alteração, exigir regularização e reter o veículo se a alteração comprometer a segurança ou a emissão de ruído exceder limites",
      "Liberar após orientação verbal ao proprietário",
      "Prescrever solução e cobrar taxa no local",
      "Encaminhar o veículo automaticamente para leilão"
    ],
    "answer": 0,
    "explain": "Base legal: Art. 230 e resoluções do CONTRAN; MBFT - verificação de alterações.\n\nExplicação (MBFT): Alterações que afetam segurança ou poluição exigem autuação e medidas administrativas; o auto deve conter descrição técnica e fundamentação legal."
  }
];

// ---------- FUNCIONALIDADE DO QUIZ ----------
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
shuffle(QUESTIONS); // embaralha a ordem das questões

let idx = 0;
let answers = new Array(QUESTIONS.length).fill(null);

const card = document.getElementById('card');
const bar = document.getElementById('bar');
const resultDiv = document.getElementById('result');

function render(i){
  const q = QUESTIONS[i];
  card.innerHTML = '';
  const meta = document.createElement('div'); meta.className='meta'; meta.textContent = 'Pergunta ' + (i+1) + ' de ' + QUESTIONS.length;
  const title = document.createElement('div'); title.className='title'; title.textContent = q.q;
  card.appendChild(meta); card.appendChild(title);
  const choicesDiv = document.createElement('div'); choicesDiv.className='choices';
  const opts = q.choices.slice();
  shuffle(opts);
  opts.forEach((opt,ci)=>{
    const ch = document.createElement('div'); ch.className='choice'; ch.dataset.val = opt; ch.innerHTML = '<strong>' + String.fromCharCode(65+ci) + '.</strong> ' + opt;
    ch.addEventListener('click', ()=>{
      choicesDiv.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
      ch.classList.add('selected');
      answers[i] = opt;
      let ex = card.querySelector('.explain');
      if(!ex){ ex = document.createElement('div'); ex.className='explain'; card.appendChild(ex); }
      const correct = (opt === q.choices[q.answer]);
      ex.style.display = 'block';
      ex.innerHTML = (correct ? '<strong>Correto</strong>' : '<strong>Incorreto</strong>') + '<div style="margin-top:8px">' + q.explain + '</div>';
      updateProgress();
    });
    choicesDiv.appendChild(ch);
  });
  card.appendChild(choicesDiv);
  if(answers[i] !== null){
    const sel = Array.from(choicesDiv.children).find(c=>c.dataset.val === answers[i]);
    if(sel) sel.classList.add('selected');
    let ex = card.querySelector('.explain'); if(!ex){ ex = document.createElement('div'); ex.className='explain'; card.appendChild(ex); }
    ex.style.display = 'block'; ex.innerHTML = '<strong>Resposta registrada</strong><div style="margin-top:8px">' + q.explain + '</div>';
  }
  updateProgress();
}

function updateProgress(){ const answered = answers.filter(a=>a!==null).length; bar.style.width = Math.round((answered / QUESTIONS.length) * 100) + '%'; }

document.getElementById('prev').addEventListener('click', ()=>{ if(idx>0){ idx--; render(idx); window.scrollTo({top:0,behavior:'smooth'}); } });
document.getElementById('next').addEventListener('click', ()=>{ if(idx<QUESTIONS.length-1){ idx++; render(idx); window.scrollTo({top:0,behavior:'smooth'}); } });
document.getElementById('reset').addEventListener('click', ()=>{ if(!confirm('Zerar respostas e reiniciar?')) return; answers = new Array(QUESTIONS.length).fill(null); idx = 0; shuffle(QUESTIONS); render(idx); updateProgress(); resultDiv.style.display='none'; });
document.getElementById('finish').addEventListener('click', ()=>{ if(!confirm('Finalizar e ver resultado?')) return; let correct = 0, answered = 0; for(let i=0;i<QUESTIONS.length;i++){ if(answers[i]===null) continue; answered++; if(answers[i] === QUESTIONS[i].choices[QUESTIONS[i].answer]) correct++; } const wrong = answered - correct; const percent = Math.round((correct / QUESTIONS.length) * 100); resultDiv.style.display='block'; resultDiv.innerHTML = '<strong>Resultado:</strong><div class=\"card\"><div>Acertos: '+correct+' — Erros: '+wrong+' — Não respondidas: '+(QUESTIONS.length-answered)+' — Percentual sobre total: '+percent+'%</div></div>'; resultDiv.scrollIntoView(); });

// initial render
render(0);
</script>
</body>
</html>
