<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CTB pesquisável — Código de Trânsito Brasileiro</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background: #f7f7f8;
      color: #111;
    }
    header {
      background: #00994d;
      color: white;
      text-align: center;
      padding: 16px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }
    input[type=text] {
      flex: 1;
      min-width: 200px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: 0;
      background: white;
      color: #00994d;
      font-weight: 600;
      cursor: pointer;
    }
    main {
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    #content {
      flex: 1;
      max-height: 75vh;
      overflow: auto;
      padding: 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    .highlight {
      background: yellow;
    }
    footer {
      padding: 12px 16px;
      font-size: 13px;
      color: #444;
      text-align: center;
    }
    a { color: #00994d; text-decoration: none; }
    a:hover { text-decoration: underline; }

    @media (min-width: 768px) {
      main { flex-direction: row; gap: 20px; }
      #content { flex: 1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>CTB pesquisável — Texto consolidado</h1>
    <div class="controls">
      <input id="searchInput" type="text" placeholder="Pesquise palavra, expressão ou artigo (ex: cinto, 165, alcoolemia)">
      <button id="searchBtn">Pesquisar</button>
      <button id="reloadBtn">Recarregar texto</button>
    </div>
  </header>

  <main>
    <section id="content">
      <p style="font-size:13px;color:#555">
        O texto é carregado automaticamente da fonte oficial (Planalto). 
        Se não aparecer, cole o texto/HTML do CTB abaixo.
      </p>
      <div id="lawContainer"></div>
      <textarea id="manualPaste" style="display:none;width:100%;height:200px;margin-top:12px"></textarea>
      <div id="manualActions" style="display:none;margin-top:8px">
        <button id="useManual">Usar texto colado</button>
      </div>
    </section>
  </main>

  <footer>
    Fonte oficial: 
    <a href="https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm" target="_blank">Planalto</a> · 
    Backup: 
    <a href="https://www.ctbdigital.com.br/" target="_blank">CTB Digital</a>
  </footer>

  <script>
    const PLANALTO_URL = 'https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm';
    const lawContainer = document.getElementById('lawContainer');

    async function loadFromPlanalto() {
      lawContainer.innerHTML = '<p>Carregando o texto consolidado...</p>';
      try {
        const res = await fetch(PLANALTO_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const txt = await res.text();
        injectLawHtml(txt);
      } catch (err) {
        lawContainer.innerHTML = '<p>Não foi possível carregar automaticamente (bloqueio CORS). Cole o texto oficial no campo abaixo.</p>';
        document.getElementById('manualPaste').style.display = 'block';
        document.getElementById('manualActions').style.display = 'block';
      }
    }

    function injectLawHtml(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      let source = doc.querySelector('body') || doc;
      source.querySelectorAll('script,style,iframe,nav,header').forEach(n => n.remove());
      source.querySelectorAll('a').forEach(a => { a.target = '_blank'; });
      lawContainer.innerHTML = source.innerHTML;
    }

    function clearHighlights() {
      document.querySelectorAll('.highlight').forEach(el => {
        el.outerHTML = el.textContent;
      });
    }

    function highlightAndScroll(term) {
      clearHighlights();
      if (!term) return 0;
      const container = lawContainer;
      const re = new RegExp(term.replace(/[-/\\^$*+?.()|[\\]{}]/g, '\\\\$&'), 'ig');
      let html = container.innerHTML;
      const matches = html.match(re);
      if (!matches) return 0;
      html = html.replace(re, m => `<span class="highlight">${m}</span>`);
      container.innerHTML = html;
      const first = container.querySelector('.highlight');
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return matches.length;
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
      const term = document.getElementById('searchInput').value.trim();
      const count = highlightAndScroll(term);
      if (term) alert(`${count} ocorrência(s) encontradas.`);
    });

    document.getElementById('reloadBtn').addEventListener('click', () => loadFromPlanalto());

    document.getElementById('useManual').addEventListener('click', () => {
      const txt = document.getElementById('manualPaste').value;
      if (!txt) return alert('Cole o texto antes de usar.');
      injectLawHtml(txt);
      document.getElementById('manualPaste').style.display = 'none';
      document.getElementById('manualActions').style.display = 'none';
    });

    // Carregar automaticamente na abertura
    loadFromPlanalto();
  </script>
</body>
</html>
