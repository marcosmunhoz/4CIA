// shuffle array in-place (Fisher–Yates)
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

// On load, shuffle question order
shuffle(QUESTIONS);

// For each question, build choices array including correct + distractors and shuffle on render
let idx=0;
let answers=new Array(QUESTIONS.length).fill(null);

const card=document.getElementById('card');
const bar=document.getElementById('bar');

function render(i){
  const q=QUESTIONS[i];
  card.innerHTML='';
  const meta=document.createElement('div'); meta.className='meta'; meta.textContent='Pergunta ' + (i+1) + ' de ' + QUESTIONS.length;
  const title=document.createElement('div'); title.className='title'; title.textContent=q.q;
  card.appendChild(meta); card.appendChild(title);
  const choicesDiv=document.createElement('div'); choicesDiv.className='choices';
  // build choices
  const opts=[q.correct].concat(q.distractors);
  shuffle(opts);
  opts.forEach((opt,ci)=>{
    const ch=document.createElement('div'); ch.className='choice'; ch.dataset.val=opt; ch.innerHTML='<strong>'+String.fromCharCode(65+ci)+'.</strong> '+opt;
    ch.addEventListener('click', ()=>{
      // mark selection
      choicesDiv.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
      ch.classList.add('selected');
      answers[i]=opt;
      // show explanation
      let ex=card.querySelector('.explain');
      if(!ex){ ex=document.createElement('div'); ex.className='explain'; card.appendChild(ex); }
      const correct = (opt === q.correct);
      ex.style.display='block';
      ex.innerHTML = '<strong>' + (correct ? 'Correto' : 'Incorreto') + '</strong><div style="margin-top:8px">' + q.explain + '</div>';
      updateProgress();
    });
    choicesDiv.appendChild(ch);
  });
  card.appendChild(choicesDiv);
  // if already answered, restore selection
  if(answers[i] !== null){ const sel = Array.from(choicesDiv.children).find(c=>c.dataset.val===answers[i]); if(sel) sel.classList.add('selected'); let ex=document.createElement('div'); ex.className='explain'; ex.style.display='block'; ex.innerHTML='<strong>Resposta registrada</strong><div style="margin-top:8px">'+q.explain+'</div>'; card.appendChild(ex); }
  updateProgress();
}

function updateProgress(){ const answered = answers.filter(a=>a!==null).length; bar.style.width = Math.round((answered / QUESTIONS.length) * 100) + '%'; }

document.getElementById('prev').addEventListener('click', ()=>{ if(idx>0){ idx--; render(idx); window.scrollTo({top:0,behavior:'smooth'}); } });
document.getElementById('next').addEventListener('click', ()=>{ if(idx<QUESTIONS.length-1){ idx++; render(idx); window.scrollTo({top:0,behavior:'smooth'}); } });
document.getElementById('reset').addEventListener('click', ()=>{ if(!confirm('Zerar respostas e reiniciar?')) return; answers=new Array(QUESTIONS.length).fill(null); idx=0; shuffle(QUESTIONS); render(idx); updateProgress(); document.getElementById('result').style.display='none'; });
document.getElementById('finish').addEventListener('click', ()=>{ if(!confirm('Finalizar e ver resultado?')) return; let correct=0, answered=0; for(let i=0;i<QUESTIONS.length;i++){ if(answers[i]===null) continue; answered++; if(answers[i] === QUESTIONS[i].correct) correct++; } const wrong = answered - correct; const percent = Math.round((correct / QUESTIONS.length) * 100); const res = document.getElementById('result'); res.style.display='block'; res.innerHTML = '<strong>Resultado:</strong><div class="card"><div>Acertos: '+correct+' — Erros: '+wrong+' — Não respondidas: '+(QUESTIONS.length-answered)+' — Percentual sobre total: '+percent+'%</div></div>'; res.scrollIntoView(); });

// populate explain fields if empty
for(let i=0;i<QUESTIONS.length;i++){ QUESTIONS[i].explain = QUESTIONS[i].explain || ('Base legal e procedimento: ' + QUESTIONS[i].correct + '. Consulte CTB e MBFT.'); }

// initial render
render(0);
