        ch.classList.add('selected');
        // show explanation
        expl.style.display='block'; expl.innerHTML = '<strong>' + (ci===q.answer? 'Correto' : 'Incorreto') + '</strong><div style="margin-top:6px">' + q.explain + '</div>';
      });
      card.appendChild(ch);
    });
    const expl = document.createElement('div'); expl.className='explain'; card.appendChild(expl);
    quiz.appendChild(card);
  });
}
function score(){
  let correct=0, answered=0;
  QUESTIONS.forEach(q=>{ const card = document.querySelectorAll('.card')[QUESTIONS.indexOf(q)]; const sel = card.querySelector('.choice.selected'); if(sel){ answered++; const idx = Array.from(card.querySelectorAll('.choice')).indexOf(sel); if(idx===q.answer) correct++; }});
  return {correct, answered, total:QUESTIONS.length, wrong: answered-correct};
}
document.getElementById('finish').addEventListener('click', ()=>{ const r=score(); const res = document.getElementById('result'); res.style.display='block'; res.innerHTML = '<strong>Resultado:</strong><div>Acertos: '+r.correct+' — Erros: '+r.wrong+' — Respondidas: '+r.answered+' — Total: '+r.total+'</div>'; res.scrollIntoView(); });
document.getElementById('reset').addEventListener('click', ()=>{ if(!confirm('Reiniciar?')) return; renderAll(); document.getElementById('result').style.display='none'; });
renderAll();
</script>
</body></html>
