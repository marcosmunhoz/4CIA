<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obter Minha Localização</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #1a2a6c;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .localizacao-btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 0 auto 30px;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
            width: 100%;
            max-width: 350px;
        }
        
        .localizacao-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(76, 175, 80, 0.5);
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
        }
        
        .localizacao-btn:active {
            transform: translateY(2px);
        }
        
        .localizacao-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .localizacao-btn i {
            font-size: 24px;
        }
        
        .resultados {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            display: none;
        }
        
        .resultados.ativo {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .info-item {
            margin-bottom: 15px;
            text-align: left;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ddd;
        }
        
        .info-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .info-label {
            font-weight: bold;
            color: #1a2a6c;
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
        }
        
        .info-value {
            color: #333;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            word-break: break-all;
            background: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        
        .coordenadas {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .coordenada-item {
            flex: 1;
        }
        
        .acoes {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .acao-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .copiar-btn {
            background: #2196F3;
            color: white;
        }
        
        .copiar-btn:hover {
            background: #0b7dda;
        }
        
        .maps-btn {
            background: #FF5722;
            color: white;
        }
        
        .maps-btn:hover {
            background: #e64a19;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
            text-align: center;
        }
        
        .status.sucesso {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .status.erro {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .status.carregando {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            display: block;
        }
        
        .notificacao {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 300px;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .localizacao-btn {
                padding: 18px 30px;
                font-size: 18px;
            }
            
            .coordenadas {
                flex-direction: column;
                gap: 10px;
            }
            
            .acoes {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Obter Minha Localização</h1>
        
        <button class="localizacao-btn" id="localizacaoBtn">
            <span>🌍 OBTER LOCALIZAÇÃO ATUAL</span>
        </button>
        
        <div class="status" id="status"></div>
        
        <div class="resultados" id="resultados">
            <div class="coordenadas">
                <div class="coordenada-item">
                    <div class="info-item">
                        <div class="info-label">LATITUDE</div>
                        <div class="info-value" id="latitude">-</div>
                    </div>
                </div>
                <div class="coordenada-item">
                    <div class="info-item">
                        <div class="info-label">LONGITUDE</div>
                        <div class="info-value" id="longitude">-</div>
                    </div>
                </div>
            </div>
            
            <div class="info-item">
                <div class="info-label">PRECISÃO</div>
                <div class="info-value" id="precisao">-</div>
            </div>
            
            <div class="info-item">
                <div class="info-label">HORÁRIO DA CAPTURA</div>
                <div class="info-value" id="horario">-</div>
            </div>
            
            <div class="acoes">
                <button class="acao-btn copiar-btn" id="copiarBtn">
                    📋 Copiar Coordenadas
                </button>
                <button class="acao-btn maps-btn" id="mapsBtn">
                    🗺️ Abrir no Maps
                </button>
            </div>
        </div>
        
        <div class="info-item" style="margin-top: 30px; text-align: center; font-size: 14px; color: #666;">
            <p>⚠️ <strong>Atenção:</strong> Para melhor precisão, ative o GPS do seu dispositivo</p>
            <p>O navegador solicitará permissão para acessar sua localização</p>
        </div>
    </div>
    
    <div class="notificacao" id="notificacao">
        ✅ Coordenadas copiadas!
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const localizacaoBtn = document.getElementById('localizacaoBtn');
            const resultados = document.getElementById('resultados');
            const statusDiv = document.getElementById('status');
            const notificacao = document.getElementById('notificacao');
            const latitudeSpan = document.getElementById('latitude');
            const longitudeSpan = document.getElementById('longitude');
            const precisaoSpan = document.getElementById('precisao');
            const horarioSpan = document.getElementById('horario');
            const copiarBtn = document.getElementById('copiarBtn');
            const mapsBtn = document.getElementById('mapsBtn');
            
            let coordenadasAtuais = null;
            
            // Função para mostrar status
            function mostrarStatus(mensagem, tipo) {
                statusDiv.textContent = mensagem;
                statusDiv.className = `status ${tipo}`;
                
                if (tipo !== 'carregando') {
                    setTimeout(() => {
                        statusDiv.style.display = 'none';
                    }, 5000);
                }
            }
            
            // Função para mostrar notificação
            function mostrarNotificacao(mensagem) {
                notificacao.textContent = mensagem;
                notificacao.style.display = 'block';
                setTimeout(() => {
                    notificacao.style.display = 'none';
                }, 3000);
            }
            
            // Função para formatar data/hora
            function formatarDataHora(data) {
                return data.toLocaleString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }
            
            // Função para obter localização
            function obterLocalizacao() {
                // Verificar se o navegador suporta geolocalização
                if (!navigator.geolocation) {
                    mostrarStatus('Seu navegador não suporta geolocalização!', 'erro');
                    return;
                }
                
                // Mostrar carregando
                mostrarStatus('Obtendo localização...', 'carregando');
                localizacaoBtn.disabled = true;
                localizacaoBtn.innerHTML = '<span>🔄 OBTENDO LOCALIZAÇÃO...</span>';
                
                // Configurações da geolocalização
                const opcoes = {
                    enableHighAccuracy: true, // Alta precisão (GPS)
                    timeout: 10000, // 10 segundos de timeout
                    maximumAge: 0 // Sem cache
                };
                
                // Solicitar localização
                navigator.geolocation.getCurrentPosition(
                    // Sucesso
                    function(posicao) {
                        const latitude = posicao.coords.latitude;
                        const longitude = posicao.coords.longitude;
                        const precisao = posicao.coords.accuracy;
                        const timestamp = new Date(posicao.timestamp);
                        
                        // Salvar coordenadas
                        coordenadasAtuais = { latitude, longitude };
                        
                        // Atualizar interface
                        latitudeSpan.textContent = latitude.toFixed(6);
                        longitudeSpan.textContent = longitude.toFixed(6);
                        precisaoSpan.textContent = `${precisao.toFixed(1)} metros`;
                        horarioSpan.textContent = formatarDataHora(timestamp);
                        
                        // Mostrar resultados
                        resultados.classList.add('ativo');
                        
                        // Mostrar sucesso
                        mostrarStatus('✅ Localização obtida com sucesso!', 'sucesso');
                        
                        // Restaurar botão
                        localizacaoBtn.disabled = false;
                        localizacaoBtn.innerHTML = '<span>🌍 OBTER LOCALIZAÇÃO ATUAL</span>';
                    },
                    
                    // Erro
                    function(erro) {
                        let mensagemErro = '';
                        
                        switch(erro.code) {
                            case 1: // PERMISSION_DENIED
                                mensagemErro = 'Permissão negada! Por favor, permita o acesso à localização.';
                                break;
                            case 2: // POSITION_UNAVAILABLE
                                mensagemErro = 'Localização indisponível! Verifique seu GPS.';
                                break;
                            case 3: // TIMEOUT
                                mensagemErro = 'Tempo esgotado! Tente novamente.';
                                break;
                            default:
                                mensagemErro = 'Erro desconhecido ao obter localização.';
                        }
                        
                        mostrarStatus(`❌ ${mensagemErro}`, 'erro');
                        
                        // Restaurar botão
                        localizacaoBtn.disabled = false;
                        localizacaoBtn.innerHTML = '<span>🌍 OBTER LOCALIZAÇÃO ATUAL</span>';
                    },
                    
                    opcoes
                );
            }
            
            // Função para copiar coordenadas
            function copiarCoordenadas() {
                if (!coordenadasAtuais) return;
                
                const texto = `Latitude: ${coordenadasAtuais.latitude.toFixed(6)}\nLongitude: ${coordenadasAtuais.longitude.toFixed(6)}`;
                
                navigator.clipboard.writeText(texto)
                    .then(() => {
                        mostrarNotificacao('✅ Coordenadas copiadas!');
                    })
                    .catch(() => {
                        // Fallback para navegadores antigos
                        const textarea = document.createElement('textarea');
                        textarea.value = texto;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        mostrarNotificacao('✅ Coordenadas copiadas!');
                    });
            }
            
            // Função para abrir no Google Maps
            function abrirNoMaps() {
                if (!coordenadasAtuais) return;
                
                const { latitude, longitude } = coordenadasAtuais;
                const url = `https://www.google.com/maps?q=${latitude},${longitude}`;
                window.open(url, '_blank');
            }
            
            // Event Listeners
            localizacaoBtn.addEventListener('click', obterLocalizacao);
            copiarBtn.addEventListener('click', copiarCoordenadas);
            mapsBtn.addEventListener('click', abrirNoMaps);
            
            // Dica inicial
            mostrarStatus('Clique no botão para obter sua localização atual', 'sucesso');
        });
    </script>
</body>
</html>
