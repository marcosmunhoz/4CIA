<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Denis Auto Center · Talão</title>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #6b5f4b;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px 5px 20px 5px;
            width: 100%;
        }

        .talao-card {
            width: 100%;
            max-width: 460px;
            margin: 0 auto 15px auto;
            background: #fcf3e0;
            border: 4px solid #1e2a30;
            box-shadow: 6px 6px 0 #1f2a2e;
            padding: 20px 12px;
        }

        .header h1 {
            font-size: clamp(1.6rem, 7vw, 2.2rem);
            font-family: 'Arial Black', 'Impact', sans-serif;
            text-align: center;
            background: #20313c;
            color: #f5e5ce;
            padding: 8px 5px;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .slogan {
            background: #d4c5ab;
            font-size: clamp(0.55rem, 2.5vw, 0.75rem);
            font-weight: bold;
            text-align: center;
            padding: 8px 5px;
            border-radius: 30px;
            border: 1px solid #544b3a;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .row-num {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 5px 0 8px;
        }
        .talao-tit {
            font-size: clamp(1.3rem, 5.5vw, 1.8rem);
            font-weight: 900;
            background: #1d1d1d;
            color: #eddbb6;
            padding: 4px 12px 4px 10px;
            clip-path: polygon(0% 0%, 92% 0%, 100% 100%, 0% 100%);
            white-space: nowrap;
        }
        .num-display {
            background: #e7d7bc;
            border: 3px solid #222;
            font-size: clamp(1.6rem, 6.5vw, 2.2rem);
            font-weight: 900;
            padding: 4px 16px;
            font-family: monospace;
        }

        .data-wrapper {
            text-align: right;
            margin: 10px 0 18px;
        }
        .data-box {
            background: #dfd2b9;
            font-size: clamp(1rem, 4.5vw, 1.4rem);
            padding: 6px 20px;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid #4e4436;
            font-weight: bold;
        }

        /* CLIENTE */
        .cliente-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 8px;
            background: #e5d8c0;
            border: 2px solid #4a4031;
            padding: 15px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .campo {
            display: flex;
            flex-direction: column;
        }
        .campo label {
            font-size: 0.6rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #232f38;
        }
        .campo input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #5d503d;
            padding: 4px 2px 2px;
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
            outline: none;
            width: 100%;
        }
        .campo input:focus {
            background: #fff2da;
        }
        .full {
            grid-column: span 2;
        }

        /* MÃO DE OBRA */
        .mao-de-obra-container {
            background: #d9cdb2;
            border: 2px solid #4a4031;
            border-radius: 20px;
            padding: 12px 15px;
            margin-bottom: 20px;
        }
        .mao-de-obra-label {
            font-size: 0.8rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #1f2f38;
            margin-bottom: 5px;
        }
        .mao-de-obra-input {
            width: 100%;
            background: #fff8e7;
            border: 2px solid #5d503d;
            border-radius: 16px;
            padding: 12px 15px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            resize: vertical;
            min-height: 70px;
            outline: none;
        }

        /* TABELA DE ITENS - VERSÃO SIMPLIFICADA E GARANTIDA */
        .tabela-container {
            width: 100%;
            margin: 15px 0 15px;
            border: 2px solid #1d1d1d;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        .tabela-linha {
            display: flex;
            width: 100%;
            border-bottom: 1px solid #888;
            background: #fffcf0;
        }

        .tabela-linha:last-child {
            border-bottom: none;
        }

        .tabela-cabecalho {
            background: #554e3f;
            color: white;
            font-weight: bold;
        }

        .col-quant {
            width: 15%;
            min-width: 60px;
            padding: 8px 4px;
            text-align: center;
            border-right: 1px solid #888;
        }

        .col-desc {
            width: 45%;
            padding: 8px 4px;
            border-right: 1px solid #888;
        }

        .col-preco {
            width: 20%;
            padding: 8px 4px;
            border-right: 1px solid #888;
            text-align: center;
        }

        .col-total {
            width: 20%;
            padding: 8px 4px;
            text-align: right;
            padding-right: 10px;
            background: #d3c8b0;
            font-weight: bold;
        }

        .tabela-cabecalho .col-quant,
        .tabela-cabecalho .col-desc,
        .tabela-cabecalho .col-preco,
        .tabela-cabecalho .col-total {
            background: #554e3f;
            color: white;
            text-align: center;
            font-size: 0.7rem;
        }

        .tabela-linha input {
            width: 100%;
            border: 1px solid #9f947f;
            padding: 6px 4px;
            font-size: 0.85rem;
            background: white;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .total-item-display {
            font-weight: 800;
            font-size: 0.9rem;
        }

        /* Total geral */
        .total-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            color: white;
            padding: 10px 16px;
            border-radius: 50px;
            margin: 15px 0;
        }
        .total-label {
            font-size: 1.1rem;
        }
        .total-valor {
            background: #fad893;
            color: #121212;
            font-size: clamp(1.4rem, 6vw, 1.9rem);
            font-weight: 900;
            padding: 5px 20px;
            border-radius: 50px;
        }

        /* Assinatura */
        .assinatura-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-top: 2px dashed #4d4234;
            padding: 15px 0 0;
            gap: 10px;
        }
        .ass-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 1rem;
        }
        .linha-assinatura {
            width: 120px;
            border-bottom: 3px solid #1e1e1e;
            height: 16px;
        }
        .ass-right {
            background: #d2c2a6;
            font-size: 1.4rem;
            font-weight: 900;
            padding: 5px 18px;
            border-radius: 50px;
        }

        /* Botões */
        .botoes-fixos {
            max-width: 460px;
            width: 100%;
            margin: 5px auto 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            padding: 5px 0 8px;
            position: sticky;
            bottom: 5px;
            z-index: 20;
        }
        .btn {
            flex: 0 1 auto;
            min-width: 75px;
            background: #2c4053;
            border: none;
            color: white;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 10px 12px;
            border-radius: 40px;
            box-shadow: 0 3px 0 #1c2a35;
            cursor: pointer;
            border: 1px solid #8fa3bb;
            text-align: center;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1c2a35;
        }
        .btn-wpp {
            background: #25a05e;
            box-shadow: 0 3px 0 #146b3a;
        }
        .btn-reset {
            background: #625945;
            box-shadow: 0 3px 0 #3f382b;
        }
    </style>
</head>
<body>
    <div class="talao-card" id="talaoCard">
        <div class="header">
            <h1>DENIS AUTO CENTER</h1>
            <div class="slogan">Suspensão Originais e Preparadas • Limpeza de Injetores • Suspensão • Troca de óleo • Freio • Mecânico em Geral • Câmbio Automático</div>
        </div>

        <!-- Nº e data -->
        <div class="row-num">
            <span class="talao-tit">TALÃO DE PEDIDO</span>
            <span class="num-display" id="numeroTalao">0001</span>
        </div>
        <div class="data-wrapper">
            <span class="data-box" id="dataAtual"></span>
        </div>

        <!-- CLIENTE -->
        <div class="cliente-grid">
            <div class="campo full"><label>CLIENTE</label> <input type="text" value="" id="cliente"></div>
            <div class="campo full"><label>ENDEREÇO</label> <input type="text" value="" id="endereco"></div>
            <div class="campo"><label>BAIRRO</label> <input type="text" value="" id="bairro"></div>
            <div class="campo"><label>CEP</label> <input type="text" value="" id="cep"></div>
            <div class="campo"><label>CIDADE</label> <input type="text" value="" id="cidade"></div>
            <div class="campo"><label>FONE</label> <input type="text" value="" id="fone"></div>
            <div class="campo"><label>FAX</label> <input type="text" value="" id="fax"></div>
            <div class="campo"><label>CEL</label> <input type="text" value="" id="cel"></div>
            <div class="campo"><label>CNPJ/CPF</label> <input type="text" value="" id="cpf"></div>
            <div class="campo"><label>INCR./RG</label> <input type="text" value="" id="rg"></div>
            <div class="campo full"><label>COND. PAGAMENTO</label> <input type="text" value="" id="condicao"></div>
        </div>

        <!-- MÃO DE OBRA -->
        <div class="mao-de-obra-container">
            <div class="mao-de-obra-label">✋ MÃO DE OBRA / SERVIÇO</div>
            <textarea class="mao-de-obra-input" id="maoDeObra" placeholder="Descreva aqui os serviços realizados..."></textarea>
        </div>

        <!-- TABELA DE ITENS (VISÍVEL E FUNCIONAL) -->
        <div class="tabela-container" id="tabelaItens">
            <!-- Cabeçalho -->
            <div class="tabela-linha tabela-cabecalho">
                <div class="col-quant">QUANT</div>
                <div class="col-desc">DESCRIÇÃO</div>
                <div class="col-preco">PREÇO UNIT</div>
                <div class="col-total">TOTAL</div>
            </div>
            <!-- Linhas de itens serão inseridas aqui -->
            <div id="itens-container"></div>
        </div>

        <!-- Total geral -->
        <div class="total-container">
            <span class="total-label">TOTAL R$</span>
            <span class="total-valor" id="totalGeral">0.00</span>
        </div>

        <!-- Assinatura -->
        <div class="assinatura-row">
            <div class="ass-left">Assinatura: <span class="linha-assinatura"></span></div>
            <div class="ass-right" id="totalAssinatura">R$ 0.00</div>
        </div>
    </div>

    <!-- BOTÕES -->
    <div class="botoes-fixos">
        <button class="btn" id="addLinhaBtn">➕ Item</button>
        <button class="btn" id="calcularBtn">🧮 Calcular</button>
        <button class="btn btn-wpp" id="wppBtn">📲 WhatsApp</button>
        <button class="btn btn-reset" id="zerarBtn">⚙️ Zerar</button>
    </div>

    <script>
        (function() {
            // ===== NUMERAÇÃO =====
            let numeroAtual = localStorage.getItem('talaoNumero') ? parseInt(localStorage.getItem('talaoNumero')) : 1;
            
            function formatarNum(n) {
                return n.toString().padStart(4, '0');
            }
            document.getElementById('numeroTalao').innerText = formatarNum(numeroAtual);

            function incrementarNumero() {
                numeroAtual++;
                localStorage.setItem('talaoNumero', numeroAtual);
                document.getElementById('numeroTalao').innerText = formatarNum(numeroAtual);
            }

            document.getElementById('zerarBtn').addEventListener('click', function() {
                numeroAtual = 1;
                localStorage.setItem('talaoNumero', numeroAtual);
                document.getElementById('numeroTalao').innerText = formatarNum(numeroAtual);
            });

            // ===== DATA =====
            const hoje = new Date();
            const dia = String(hoje.getDate()).padStart(2, '0');
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const ano = String(hoje.getFullYear()).slice(-2);
            document.getElementById('dataAtual').innerText = `${dia}, ${mes}, ${ano}`;

            // ===== CONTAINER DE ITENS =====
            const itensContainer = document.getElementById('itens-container');

            // Função para criar uma linha de item
            function criarLinhaItem() {
                const div = document.createElement('div');
                div.className = 'tabela-linha';
                div.innerHTML = `
                    <div class="col-quant"><input type="number" class="item-qtd" step="0.01" min="0" placeholder="0" value=""></div>
                    <div class="col-desc"><input type="text" class="item-desc" placeholder="Descrição do item" value=""></div>
                    <div class="col-preco"><input type="number" class="item-preco" step="0.01" min="0" placeholder="0.00" value=""></div>
                    <div class="col-total total-item">R$ 0.00</div>
                `;
                return div;
            }

            // Adicionar 4 linhas iniciais
            for (let i = 0; i < 4; i++) {
                itensContainer.appendChild(criarLinhaItem());
            }

            // ===== BOTÃO ADICIONAR ITEM =====
            document.getElementById('addLinhaBtn').addEventListener('click', function() {
                itensContainer.appendChild(criarLinhaItem());
            });

            // ===== FUNÇÃO CALCULAR =====
            function calcularTotais() {
                const linhas = document.querySelectorAll('#itens-container .tabela-linha');
                let totalGeral = 0;

                linhas.forEach(linha => {
                    const qtdInput = linha.querySelector('.item-qtd');
                    const precoInput = linha.querySelector('.item-preco');
                    const totalCell = linha.querySelector('.total-item');
                    
                    if (qtdInput && precoInput && totalCell) {
                        const qtd = parseFloat(qtdInput.value) || 0;
                        const preco = parseFloat(precoInput.value) || 0;
                        const total = qtd * preco;
                        
                        totalCell.innerText = 'R$ ' + total.toFixed(2);
                        totalGeral += total;
                    }
                });

                document.getElementById('totalGeral').innerText = totalGeral.toFixed(2);
                document.getElementById('totalAssinatura').innerText = 'R$ ' + totalGeral.toFixed(2);
            }

            document.getElementById('calcularBtn').addEventListener('click', function() {
                calcularTotais();
            });

            // ===== BOTÃO WHATSAPP (GERAR IMAGEM E COMPARTILHAR) =====
            document.getElementById('wppBtn').addEventListener('click', function() {
                calcularTotais(); // Atualiza os valores antes de gerar imagem
                
                const elemento = document.getElementById('talaoCard');
                const btn = this;
                const textoOriginal = btn.innerText;
                
                btn.innerText = '⏳ Gerando...';
                btn.disabled = true;

                html2canvas(elemento, {
                    scale: 2.0,
                    backgroundColor: '#fcf3e0',
                    allowTaint: false,
                    useCORS: true,
                    logging: false
                }).then(canvas => {
                    canvas.toBlob(function(blob) {
                        const fileName = `talao_${formatarNum(numeroAtual)}.png`;
                        const file = new File([blob], fileName, { type: 'image/png' });
                        
                        // Tenta compartilhar via Web Share API
                        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                            navigator.share({
                                title: 'Talão de Pedido',
                                text: 'Segue o talão em anexo',
                                files: [file]
                            }).then(() => {
                                incrementarNumero();
                                btn.innerText = textoOriginal;
                                btn.disabled = false;
                            }).catch(() => {
                                // Fallback: baixar e abrir WhatsApp
                                const url = URL.createObjectURL(blob);
                                const link = document.createElement('a');
                                link.href = url;
                                link.download = fileName;
                                link.click();
                                
                                setTimeout(() => {
                                    window.open(`https://wa.me/?text=${encodeURIComponent('Olá, segue o talão em anexo. A imagem foi baixada automaticamente.')}`, '_blank');
                                    incrementarNumero();
                                    btn.innerText = textoOriginal;
                                    btn.disabled = false;
                                }, 500);
                            });
                        } else {
                            // Fallback direto
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.href = url;
                            link.download = fileName;
                            link.click();
                            
                            setTimeout(() => {
                                window.open(`https://wa.me/?text=${encodeURIComponent('Olá, segue o talão em anexo. A imagem foi baixada automaticamente.')}`, '_blank');
                                incrementarNumero();
                                btn.innerText = textoOriginal;
                                btn.disabled = false;
                   
});
            });

            // Calcular inicial
            calcularTotais();
        })();
    </script>
</body>
</html>
