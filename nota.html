<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Talão de Pedido · Denis Auto Center</title>
    <!-- html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #c0b9a8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #fcf7e9;
            border: 3px solid #2c2c2c;
            box-shadow: 8px 8px 0 #3a3a3a;
            padding: 16px 12px;
            border-radius: 0;
        }
        /* cabeçalho */
        .header {
            text-align: center;
            border-bottom: 2px dashed #444;
            margin-bottom: 15px;
            padding-bottom: 10px;
        }
        .header h1 {
            font-size: clamp(1.6rem, 7vw, 2.4rem);
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Arial Black', 'Impact', sans-serif;
            color: #1f2a36;
            line-height: 1.2;
        }
        .slogan {
            font-size: clamp(0.65rem, 3vw, 0.8rem);
            background: #d8cfbc;
            padding: 6px 4px;
            margin-top: 6px;
            border-radius: 20px;
            font-weight: 600;
            color: #121212;
        }
        /* linha do título talão + número */
        .talao-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin: 15px 0 12px;
        }
        .talao-titulo {
            font-size: clamp(1.4rem, 6vw, 2.2rem);
            font-weight: bold;
            letter-spacing: 1.5px;
            background: #222;
            color: #f0e5d2;
            padding: 4px 15px 4px 10px;
            clip-path: polygon(0% 0%, 90% 0%, 100% 100%, 0% 100%);
        }
        .numero-talao {
            font-size: 1.6rem;
            font-weight: 800;
            background: #ece1cf;
            padding: 5px 15px;
            border: 2px solid #222;
            display: inline-block;
        }
        /* data automática */
        .data-row {
            text-align: right;
            font-size: 1.2rem;
            margin: 10px 0 20px;
            background: #e6dccb;
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid #5a4f42;
        }
        .data-row strong {
            background: #2d2d2d;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            margin-left: 8px;
        }
        /* grid campos cliente */
        .cliente-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 8px;
            background: #eadfcb;
            border: 2px solid #3b352c;
            padding: 18px 12px;
            margin-bottom: 25px;
            border-radius: 10px;
        }
        .campo {
            display: flex;
            flex-direction: column;
        }
        .campo label {
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1f2a2f;
        }
        .campo input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #4a3f33;
            padding: 8px 4px 4px;
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            width: 100%;
            outline: none;
        }
        .campo input:focus {
            background: #fff6df;
            border-bottom-color: #ad7e4b;
        }
        .full-width {
            grid-column: span 2;
        }
        /* tabela itens */
        .table-container {
            overflow-x: auto;
            margin: 20px 0 15px;
            border: 2px solid #222;
            background: #f3ecdb;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 400px;
        }
        th {
            background: #988f7a;
            color: #fff;
            padding: 10px 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            border: 1px solid #111;
        }
        td {
            border: 1px solid #333;
            padding: 5px 2px;
            background: #fffef8;
        }
        td input {
            width: 100%;
            border: 1px solid #b0a58f;
            padding: 10px 5px;
            font-size: 0.9rem;
            background: #fffdf3;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
        }
        .total-item {
            font-weight: bold;
            text-align: right;
            padding-right: 12px;
            background: #ddcfb5;
            white-space: nowrap;
        }
        /* rodapé totais */
        .total-geral-box {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            background: #222;
            color: white;
            padding: 15px 20px;
            border-radius: 40px;
        }
        .total-geral-box span {
            font-size: 1.8rem;
            font-weight: bold;
            background: #f7e9cf;
            color: #222;
            padding: 5px 25px;
            border-radius: 40px;
        }
        .assinatura-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px dashed #3a3a3a;
            padding-top: 20px;
            margin: 20px 0 10px;
        }
        .ass-col {
            font-weight: bold;
            font-size: 1.2rem;
        }
        .linha-assinatura {
            display: inline-block;
            width: 180px;
            border-bottom: 3px solid #2c2c2c;
            height: 25px;
        }
        .total-assinatura {
            background: #cec09f;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: 800;
        }
        /* botões */
        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 30px 0 10px;
        }
        .btn {
            flex: 1 1 140px;
            background: #33404d;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px 8px;
            border-radius: 40px;
            box-shadow: 0 5px 0 #1b232c;
            transition: 0.08s linear;
            cursor: pointer;
            border: 1px solid #7d8ca0;
            min-width: 120px;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1b232c;
        }
        .btn-pdf {
            background: #6a3f1f;
            box-shadow: 0 5px 0 #422c18;
        }
        .obs {
            font-size: 0.7rem;
            text-align: right;
            color: #3f3f3f;
            margin-top: 12px;
        }
        /* tira setas input number (opcional) */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            opacity: 0.5;
            height: 20px;
        }
    </style>
</head>
<body>
<div class="container" id="pedidoContainer">
    <!-- cabeçalho DENIS AUTO CENTER -->
    <div class="header">
        <h1>DENIS AUTO CENTER</h1>
        <div class="slogan">Suspensão Originais e Preparadas · Limpeza de Bicos Injetores · Suspensão · Troca de óleo · Freio · Mecânico em Geral</div>
    </div>

    <!-- TALÃO DE PEDIDO + Nº dinâmico -->
    <div class="talao-row">
        <span class="talao-titulo">TALÃO DE PEDIDO</span>
        <span class="numero-talao" id="numeroTalao">0001</span>
    </div>

    <!-- DATA automática do dia (preenchida via js) -->
    <div class="data-row">
        📅 DATA: <strong id="dataAtual"></strong>
    </div>

    <!-- CLIENTE: todos os campos vazios, prontos para preencher -->
    <div class="cliente-grid">
        <div class="campo full-width"><label>CLIENTE</label> <input type="text" placeholder="" value=""></div>
        <div class="campo full-width"><label>ENDEREÇO</label> <input type="text" placeholder="" value=""></div>
        <div class="campo"><label>BAIRRO</label> <input type="text" value=""></div>
        <div class="campo"><label>CEP</label> <input type="text" value=""></div>
        <div class="campo"><label>CIDADE</label> <input type="text" value=""></div>
        <div class="campo"><label>FONE</label> <input type="text" value=""></div>
        <div class="campo"><label>FAX</label> <input type="text" value=""></div>
        <div class="campo"><label>CEL</label> <input type="text" value=""></div>
        <div class="campo"><label>CNPJ/CPF</label> <input type="text" value=""></div>
        <div class="campo"><label>INCR./RG</label> <input type="text" value=""></div>
        <div class="campo full-width"><label>COND. PAGAMENTO</label> <input type="text" value=""></div>
    </div>

    <!-- TABELA DE ITENS (totalmente limpa, sem valores pré-preenchidos) -->
    <div class="table-container">
        <table id="tabelaItens">
            <thead>
                <tr><th>QUANT</th><th>DESCRIÇÃO</th><th>PREÇO UNIT</th><th>TOTAL</th></tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- serão inseridas linhas vazias via js, mas deixamos uma linha vazia modelo -->
                <tr>
                    <td><input type="number" class="qtd" value="" step="0.01" min="0" placeholder="0"></td>
                    <td><input type="text" class="desc" placeholder=""></td>
                    <td><input type="number" class="preco" value="" step="0.01" min="0" placeholder="0.00"></td>
                    <td class="totalItem">R$ 0.00</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- total geral -->
    <div class="total-geral-box">
        <span style="font-size: 1.2rem;">TOTAL GERAL</span>
        <span id="totalGeral">0.00</span>
    </div>

    <!-- assinatura e total repetido -->
    <div class="assinatura-area">
        <div class="ass-col">Assinatura: <span class="linha-assinatura"></span></div>
        <div class="total-assinatura" id="totalAssinatura">R$ 0.00</div>
    </div>
    <div class="obs">* preencha os itens conforme necessidade</div>
</div>

<!-- botões -->
<div class="botoes">
    <button class="btn" id="addLinhaBtn">➕ Item</button>
    <button class="btn" id="calcularBtn">🧮 Calcular</button>
    <button class="btn btn-pdf" id="pdfBtn">📄 Gerar PDF</button>
</div>

<script>
    (function() {
        // ---------- CONTROLE DE NUMERAÇÃO (localStorage) ----------
        let numeroAtual = localStorage.getItem('talaoNumero');
        if (!numeroAtual) {
            numeroAtual = 1;
        } else {
            numeroAtual = parseInt(numeroAtual, 10);
        }
        // Formata com 4 dígitos (0001)
        function formatarNumero(n) {
            return n.toString().padStart(4, '0');
        }
        document.getElementById('numeroTalao').innerText = formatarNumero(numeroAtual);

        // Incrementa para a próxima vez (quando gerar PDF)
        function incrementarNumero() {
            numeroAtual++;
            localStorage.setItem('talaoNumero', numeroAtual);
            document.getElementById('numeroTalao').innerText = formatarNumero(numeroAtual);
        }

        // ---------- DATA AUTOMÁTICA DO DIA ----------
        function atualizarData() {
            const hoje = new Date();
            const dia = String(hoje.getDate()).padStart(2, '0');
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const ano = String(hoje.getFullYear()).slice(-2);
            document.getElementById('dataAtual').innerText = `${dia}, ${mes}, ${ano}`;
        }
        atualizarData();

        // ---------- TABELA: garantir que comece com linhas VAZIAS (sem valores da imagem) ----------
        const corpoTabela = document.getElementById('corpoTabela');
        // Limpa qualquer conteúdo prévio (exceto a estrutura de modelo)
        corpoTabela.innerHTML = ''; 
        // Adiciona 4 linhas vazias para começar (pode ajustar, mas o botão adiciona mais)
        for (let i = 0; i < 4; i++) {
            const novaLinha = document.createElement('tr');
            novaLinha.innerHTML = `
                <td><input type="number" class="qtd" step="0.01" min="0" placeholder="0"></td>
                <td><input type="text" class="desc" placeholder=""></td>
                <td><input type="number" class="preco" step="0.01" min="0" placeholder="0.00"></td>
                <td class="totalItem">R$ 0.00</td>
            `;
            corpoTabela.appendChild(novaLinha);
        }

        // ---------- FUNÇÃO CALCULAR ----------
        function calcularTotalGeral() {
            const linhas = document.querySelectorAll('#corpoTabela tr');
            let acumulado = 0;
            linhas.forEach(linha => {
                const qtdInput = linha.querySelector('.qtd');
                const precoInput = linha.querySelector('.preco');
                const celTotal = linha.querySelector('.totalItem');
                if (qtdInput && precoInput && celTotal) {
                    let qtd = parseFloat(qtdInput.value) || 0;
                    let preco = parseFloat(precoInput.value) || 0;
                    let totalItem = qtd * preco;
                    celTotal.innerText = 'R$ ' + totalItem.toFixed(2);
                    acumulado += totalItem;
                }
            });
            document.getElementById('totalGeral').innerText = acumulado.toFixed(2);
            document.getElementById('totalAssinatura').innerText = 'R$ ' + acumulado.toFixed(2);
        }

        // Adicionar linha (em branco)
        function adicionarLinhaVazia() {
            const novaLinha = document.createElement('tr');
            novaLinha.innerHTML = `
                <td><input type="number" class="qtd" step="0.01" min="0" placeholder="0"></td>
                <td><input type="text" class="desc" placeholder=""></td>
                <td><input type="number" class="preco" step="0.01" min="0" placeholder="0.00"></td>
                <td class="totalItem">R$ 0.00</td>
            `;
            corpoTabela.appendChild(novaLinha);
            // não recalcula automaticamente para não atrapalhar, mas pode chamar calcular
        }

        // ---------- EVENT LISTENERS ----------
        document.getElementById('addLinhaBtn').addEventListener('click', function() {
            adicionarLinhaVazia();
        });

        document.getElementById('calcularBtn').addEventListener('click', function() {
            calcularTotalGeral();
        });

        // Para gerar PDF com incremento automático do Nº
        document.getElementById('pdfBtn').addEventListener('click', function() {
            // primeiro calcular para garantir totais atualizados
            calcularTotalGeral();

            // elemento a ser convertido
            const elemento = document.getElementById('pedidoContainer');

            // configuração do pdf
            const opt = {
                margin:        [0.5, 0.5, 0.5, 0.5],
                filename:     `talao_${formatarNumero(numeroAtual)}.pdf`,
                image:        { type: 'jpeg', quality: 0.95 },
                html2canvas:  { scale: 2, letterRendering: true, useCORS: true },
                jsPDF:        { unit: 'cm', format: 'a4', orientation: 'portrait' }
            };

            // executa a geração
            html2pdf().set(opt).from(elemento).save();

            // Após salvar (com pequeno atraso para nao conflitar), incrementa número
            setTimeout(() => {
                incrementarNumero();
            }, 300);
        });

        // Atalho: ao digitar em qualquer input, pode chamar calcular? 
        // Fica a critério, mas melhor usar o botão para performance no celular.
        // Opcional: atualizar ao sair do campo (blur)
        document.addEventListener('input', function(e) {
            if (e.target.classList.contains('qtd') || e.target.classList.contains('preco')) {
                // se quiser cálculo em tempo real descomente linha abaixo:
                // calcularTotalGeral(); 
                // deixei só no botão pra evitar lentidão, mas pode ativar.
            }
        });

        // Expor calcular para uso externo, mas já está ok
        window.calcularTotalGeral = calcularTotalGeral;

        // Inicializa total
        calcularTotalGeral();

        // Responsividade: campos de data já estão
    })();
</script>

<!-- rodapé opcional -->
</body>
</html>
