<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Denis Auto Center · Talão</title>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #7a6e5a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px 5px 20px 5px;
        }

        .talao-card {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 15px auto;
            background: #fcf3e0;
            border: 4px solid #1e2a30;
            box-shadow: 6px 6px 0 #1f2a2e;
            padding: 18px 12px;
            position: relative;
        }

        /* BOTÃO APAGAR */
        .btn-apagar {
            position: absolute;
            top: 8px;
            right: 8px;
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s;
            padding: 5px;
            z-index: 10;
        }
        .btn-apagar:hover {
            opacity: 1;
        }

        h1 {
            font-size: clamp(1.6rem, 7vw, 2.2rem);
            font-family: 'Arial Black', sans-serif;
            text-align: center;
            background: #20313c;
            color: #f5e5ce;
            padding: 8px 5px;
            margin-bottom: 8px;
        }

        .slogan {
            background: #d4c5ab;
            font-size: 0.7rem;
            font-weight: bold;
            text-align: center;
            padding: 8px 5px;
            border-radius: 30px;
            border: 1px solid #544b3a;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .linha-talao {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }
        .talao-titulo {
            font-size: 1.5rem;
            font-weight: bold;
            background: #222;
            color: #eddbb6;
            padding: 4px 12px;
            clip-path: polygon(0% 0%, 92% 0%, 100% 100%, 0% 100%);
        }
        .numero {
            background: #e7d7bc;
            border: 3px solid #222;
            font-size: 2rem;
            font-weight: bold;
            padding: 4px 16px;
        }

        .data-container {
            display: flex;
            justify-content: flex-end;
            margin: 10px 0 15px;
        }
        .data-box {
            background: #dfd2b9;
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid #4e4436;
            font-weight: bold;
            display: inline-block;
        }

        /* CLIENTE */
        .cliente-linhas {
            width: 100%;
            margin: 15px 0;
        }
        .linha-dupla {
            display: flex;
            gap: 15px;
            margin-bottom: 8px;
        }
        .linha-dupla .campo {
            flex: 1;
        }
        .campo label {
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #2f3a42;
        }
        .campo input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #5d503d;
            padding: 4px 2px;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            outline: none;
        }
        .campo-full {
            margin-bottom: 8px;
        }
        .campo-full label {
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .campo-full input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #5d503d;
            padding: 4px 2px;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            outline: none;
        }

        /* MÃO DE OBRA */
        .mao-obra {
            margin: 20px 0;
            border: 2px solid #4a4031;
            border-radius: 15px;
            padding: 12px;
            background: #d9cdb2;
        }
        .mao-obra label {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 5px;
        }
        .mao-obra textarea {
            width: 100%;
            background: #fff8e7;
            border: 2px solid #5d503d;
            border-radius: 10px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            min-height: 80px;
            height: auto;
            resize: vertical;
            word-wrap: break-word;
            white-space: pre-wrap;
            overflow-y: auto;
            line-height: 1.4;
        }

        /* TABELA */
        .tabela-produtos {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            border: 2px solid #222;
            background: white;
        }
        .tabela-produtos th {
            background: #554e3f;
            color: white;
            padding: 8px 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            border: 1px solid #222;
        }
        .tabela-produtos td {
            border: 1px solid #444;
            padding: 4px;
            background: #fffcf0;
        }
        .tabela-produtos input {
            width: 100%;
            border: 1px solid #9f947f;
            padding: 8px 4px;
            font-size: 0.85rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .total-item {
            font-weight: bold;
            text-align: right;
            padding-right: 8px;
            background: #d3c8b0;
        }

        /* DESCONTO */
        .desconto-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            background: #e5d8c0;
            border: 2px solid #4a4031;
            border-radius: 15px;
            padding: 12px 15px;
            margin: 10px 0 15px;
        }
        .desconto-label {
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
        }
        .desconto-opcoes {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .desconto-opcoes label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .desconto-input {
            width: 90px;
            padding: 6px 8px;
            border: 2px solid #5d503d;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
        }
        .desconto-valor {
            font-weight: bold;
            color: #c53a1f;
            font-size: 1rem;
            background: #fff;
            padding: 5px 10px;
            border-radius: 20px;
        }

        /* Total */
        .total-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            color: white;
            padding: 10px 16px;
            border-radius: 40px;
            margin: 15px 0;
        }
        .total-valor {
            background: #fad893;
            color: #121212;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 5px 20px;
            border-radius: 40px;
        }

        /* Assinatura */
        .assinatura {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px dashed #4d4234;
            padding: 15px 0 5px;
        }
        .linha-ass {
            display: inline-block;
            width: 150px;
            border-bottom: 3px solid #000;
            height: 16px;
        }
        .total-ass {
            background: #d2c2a6;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 5px 18px;
            border-radius: 30px;
        }

        /* Botões */
        .botoes {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 5px;
            position: sticky;
            bottom: 5px;
        }
        .btn {
            flex: 0 1 auto;
            min-width: 70px;
            background: #2c4053;
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 10px 12px;
            border: none;
            border-radius: 40px;
            box-shadow: 0 3px 0 #1c2a35;
            cursor: pointer;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        .btn-wpp {
            background: #25a05e;
        }
        .btn-reset {
            background: #625945;
        }
    </style>
</head>
<body>
    <div class="talao-card" id="talaoCard">
        <button class="btn-apagar" id="btnApagar" title="Apagar tudo">🗑️</button>

        <h1>DENIS AUTO CENTER</h1>
        <div class="slogan">Suspensão Originais e Preparadas • Limpeza de Injetores • Suspensão • Troca de óleo • Freio • Mecânico em Geral • Câmbio Automático</div>

        <div class="linha-talao">
            <span class="talao-titulo">TALÃO DE PEDIDO</span>
            <span class="numero" id="numeroTalao">0001</span>
        </div>
        <div class="data-container">
            <span class="data-box" id="dataAtual"></span>
        </div>

        <!-- CLIENTE -->
        <div class="cliente-linhas">
            <div class="campo-full"><label>CLIENTE</label><input type="text" id="cliente"></div>
            <div class="campo-full"><label>ENDEREÇO</label><input type="text" id="endereco"></div>
            <div class="linha-dupla">
                <div class="campo"><label>BAIRRO</label><input type="text" id="bairro"></div>
                <div class="campo"><label>CEP</label><input type="text" id="cep"></div>
            </div>
            <div class="linha-dupla">
                <div class="campo"><label>CIDADE</label><input type="text" id="cidade"></div>
                <div class="campo"><label>FONE</label><input type="text" id="fone"></div>
            </div>
            <div class="linha-dupla">
                <div class="campo"><label>FAX</label><input type="text" id="fax"></div>
                <div class="campo"><label>CEL</label><input type="text" id="cel"></div>
            </div>
            <div class="linha-dupla">
                <div class="campo"><label>CNPJ/CPF</label><input type="text" id="cpf"></div>
                <div class="campo"><label>INCR./RG</label><input type="text" id="rg"></div>
            </div>
            <div class="campo-full"><label>COND. PAGAMENTO</label><input type="text" id="condicao"></div>
        </div>

        <!-- MÃO DE OBRA -->
        <div class="mao-obra">
            <label>✋ MÃO DE OBRA / SERVIÇO</label>
            <textarea id="maoDeObra" placeholder="Descreva aqui os serviços realizados..."></textarea>
        </div>

        <!-- TABELA -->
        <table class="tabela-produtos" id="tabelaProdutos">
            <thead>
                <tr><th>QUANT</th><th>DESCRIÇÃO</th><th>PREÇO UNIT</th><th>TOTAL</th></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>

        <!-- DESCONTO -->
        <div class="desconto-container">
            <span class="desconto-label">DESCONTO:</span>
            <div class="desconto-opcoes">
                <label><input type="radio" name="tipoDesconto" value="R$" checked> R$</label>
                <label><input type="radio" name="tipoDesconto" value="%"> %</label>
            </div>
            <input type="number" class="desconto-input" id="valorDesconto" value="0" min="0" step="0.01">
            <span class="desconto-valor" id="descontoExibido">R$ 0,00</span>
        </div>

        <!-- Total -->
        <div class="total-container">
            <span>TOTAL R$</span>
            <span class="total-valor" id="totalGeral">0.00</span>
        </div>

        <!-- Assinatura -->
        <div class="assinatura">
            <div>Assinatura: <span class="linha-ass"></span></div>
            <div class="total-ass" id="totalAssinatura">R$ 0.00</div>
        </div>
    </div>

    <!-- Botões -->
    <div class="botoes">
        <button class="btn" id="addLinhaBtn">➕ Item</button>
        <button class="btn" id="calcularBtn">🧮 Calcular</button>
        <button class="btn btn-wpp" id="wppBtn">📲 WhatsApp</button>
        <button class="btn btn-reset" id="zerarBtn">⚙️ Zerar</button>
    </div>

    <script>
        (function() {
            // Numeração
            let numeroAtual = localStorage.getItem('talaoNumero') ? parseInt(localStorage.getItem('talaoNumero')) : 1;
            document.getElementById('numeroTalao').innerText = numeroAtual.toString().padStart(4, '0');

            function incrementarNumero() {
                numeroAtual++;
                localStorage.setItem('talaoNumero', numeroAtual);
                document.getElementById('numeroTalao').innerText = numeroAtual.toString().padStart(4, '0');
            }

            document.getElementById('zerarBtn').addEventListener('click', function() {
                numeroAtual = 1;
                localStorage.setItem('talaoNumero', numeroAtual);
                document.getElementById('numeroTalao').innerText = '0001';
            });

            // Data
            const hoje = new Date();
            document.getElementById('dataAtual').innerText = 
                `${String(hoje.getDate()).padStart(2, '0')}, ${String(hoje.getMonth()+1).padStart(2, '0')}, ${String(hoje.getFullYear()).slice(-2)}`;

            // Tabela
            const corpoTabela = document.getElementById('corpoTabela');

            function criarLinha() {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="number" class="qtd" step="0.01" min="0" placeholder="0"></td>
                    <td><input type="text" class="desc" placeholder="Descrição"></td>
                    <td><input type="number" class="preco" step="0.01" min="0" placeholder="0.00"></td>
                    <td class="total-item">R$ 0.00</td>
                `;
                return tr;
            }

            for (let i = 0; i < 4; i++) {
                corpoTabela.appendChild(criarLinha());
            }

            document.getElementById('addLinhaBtn').addEventListener('click', function() {
                corpoTabela.appendChild(criarLinha());
            });

            // Calcular
            function calcular() {
                const linhas = document.querySelectorAll('#corpoTabela tr');
                let subtotal = 0;
                
                linhas.forEach(linha => {
                    const qtd = linha.querySelector('.qtd')?.value;
                    const preco = linha.querySelector('.preco')?.value;
                    const cell = linha.querySelector('.total-item');
                    
                    if (qtd && preco && cell) {
                        const val = (parseFloat(qtd) || 0) * (parseFloat(preco) || 0);
                        cell.innerText = 'R$ ' + val.toFixed(2);
                        subtotal += val;
                    }
                });

                const tipo = document.querySelector('input[name="tipoDesconto"]:checked').value;
                let valorDesc = parseFloat(document.getElementById('valorDesconto').value) || 0;
                let desconto = 0;
                
                if (tipo === 'R$') {
                    desconto = Math.min(valorDesc, subtotal);
                } else {
                    desconto = subtotal * (Math.min(valorDesc, 100) / 100);
                }
                
                const totalFinal = subtotal - desconto;
                
                document.getElementById('descontoExibido').innerText = 
                    tipo === 'R$' ? `- R$ ${desconto.toFixed(2)}` : `- ${valorDesc.toFixed(1)}% (R$ ${desconto.toFixed(2)})`;
                
                document.getElementById('totalGeral').innerText = totalFinal.toFixed(2);
                document.getElementById('totalAssinatura').innerText = 'R$ ' + totalFinal.toFixed(2);
            }

            document.getElementById('calcularBtn').addEventListener('click', calcular);

            // Apagar tudo
            document.getElementById('btnApagar').addEventListener('click', function() {
                document.getElementById('cliente').value = '';
                document.getElementById('endereco').value = '';
                document.getElementById('bairro').value = '';
                document.getElementById('cep').value = '';
                document.getElementById('cidade').value = '';
                document.getElementById('fone').value = '';
                document.getElementById('fax').value = '';
                document.getElementById('cel').value = '';
                document.getElementById('cpf').value = '';
                document.getElementById('rg').value = '';
                document.getElementById('condicao').value = '';
                
                document.getElementById('maoDeObra').value = '';
                
                corpoTabela.innerHTML = '';
                for (let i = 0; i < 4; i++) {
                    corpoTabela.appendChild(criarLinha());
                }
                
                document.getElementById('valorDesconto').value = '0';
                document.querySelector('input[name="tipoDesconto"][value="R$"]').checked = true;
                document.getElementById('descontoExibido').innerText = 'R$ 0,00';
                
                calcular();
            });

            // ===== WHATSAPP - CORRIGIDO =====
            document.getElementById('wppBtn').addEventListener('click', function() {
                calcular();
                
                const elemento = document.getElementById('talaoCard');
                const btn = this;
                btn.innerText = '⏳ Gerando...';
                btn.disabled = true;

                // Salvar o conteúdo original do textarea
                const textarea = document.getElementById('maoDeObra');
                const textoOriginal = textarea.value;
                
                // Criar um div temporário com o mesmo texto, mas sem as limitações do textarea
                const tempDiv = document.createElement('div');
                tempDiv.style.cssText = `
                    font-family: 'Courier New', monospace;
                    font-size: 0.9rem;
                    line-height: 1.4;
                    white-space: pre-wrap;
                    word-wrap: break-word;
                    padding: 12px;
                    background: #fff8e7;
                    border: 2px solid #5d503d;
                    border-radius: 10px;
                    min-height: 80px;
                    width: 100%;
                    margin-bottom: 20px;
                `;
                tempDiv.innerText = textoOriginal;

                // Substituir o textarea pelo div temporariamente
                const maoObraDiv = document.querySelector('.mao-obra');
                textarea.style.display = 'none';
                maoObraDiv.appendChild(tempDiv);

                html2canvas(elemento, {
                    scale: 2,
                    backgroundColor: '#fcf3e0',
                    allowTaint: false,
                    useCORS: true,
                    logging: false,
                    windowWidth: elemento.scrollWidth,
                    windowHeight: elemento.scrollHeight
                }).then(canvas => {
                    // Remover o div temporário e restaurar o textarea
                    tempDiv.remove();
                    textarea.style.display = '';
                    
                    canvas.toBlob(blob => {
                        const fileName = `talao_${numeroAtual.toString().padStart(4, '0')}.png`;
                        
                        if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, {type: 'image/png'})] })) {
                            navigator.share({
                                title: 'Talão de Pedido',
                                text: 'Segue o talão em anexo',
                                files: [new File([blob], fileName, {type: 'image/png'})]
                            }).then(() => {
                                incrementarNumero();
                                btn.innerText = '📲 WhatsApp';
                                btn.disabled = false;
                            }).catch(() => {
                                const url = URL.createObjectURL(blob);
                                const link = document.createElement('a');
                                link.href = url;
                                link.download = fileName;
                                link.click();
                                setTimeout(() => {
                                    window.open('https://wa.me/?text=' + encodeURIComponent('Olá, segue o talão. A imagem foi baixada automaticamente.'), '_blank');
                                    incrementarNumero();
                                    btn.innerText = '📲 WhatsApp';
                                    btn.disabled = false;
                                }, 500);
                            });
                        } else {
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.href = url;
                            link.download = fileName;
                            link.click();
                            setTimeout(() => {
                                window.open('https://wa.me/?text=' + encodeURIComponent('Olá, segue o talão. A imagem foi baixada automaticamente.'), '_blank');
                                incrementarNumero();
                                btn.innerText = '📲 WhatsApp';
                                btn.disabled = false;
                            }, 500);
                        }
                    }, 'image/png', 0.95);
                }).catch(err => {
                    // Em caso de erro, restaurar o textarea
                    tempDiv.remove();
                    textarea.style.display = '';
                    alert('Erro ao gerar imagem: ' + err.message);
                    btn.innerText = '📲 WhatsApp';
                    btn.disabled = false;
                });
            });

            calcular();
        })();
    </script>
</body>
</html>
