<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Denis Auto Center · Talão Oficial</title>
    <!-- html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* RESET COMPLETO - sem vazamentos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #8b7f6b;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px 6px 20px 6px;
            width: 100%;
        }

        /* CARD PRINCIPAL - TUDO DENTRO AQUI */
        .talao-card {
            width: 100%;
            max-width: 480px;
            margin: 0 auto 15px auto;
            background: #fdf5e6;
            border: 4px solid #1e2a30;
            box-shadow: 8px 8px 0 #1f2a2e;
            padding: 20px 15px;
        }

        /* cabeçalho */
        .header h1 {
            font-size: clamp(1.8rem, 7.5vw, 2.5rem);
            font-family: 'Arial Black', 'Impact', sans-serif;
            text-align: center;
            background: #20313c;
            color: #f5e5ce;
            padding: 10px 5px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .slogan {
            background: #d4c5ab;
            font-size: clamp(0.6rem, 2.8vw, 0.8rem);
            font-weight: bold;
            text-align: center;
            padding: 10px 6px;
            border-radius: 40px;
            border: 1px solid #544b3a;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        /* linha do número */
        .row-num {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 5px 0 8px;
        }
        .talao-tit {
            font-size: clamp(1.5rem, 6vw, 2rem);
            font-weight: 900;
            background: #1d1d1d;
            color: #eddbb6;
            padding: 5px 14px 5px 12px;
            clip-path: polygon(0% 0%, 92% 0%, 100% 100%, 0% 100%);
            white-space: nowrap;
        }
        .num-display {
            background: #e7d7bc;
            border: 3px solid #222;
            font-size: clamp(1.8rem, 7vw, 2.4rem);
            font-weight: 900;
            padding: 5px 18px;
            font-family: monospace;
        }

        /* data */
        .data-wrapper {
            text-align: right;
            margin: 15px 0 20px;
        }
        .data-box {
            background: #dfd2b9;
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            padding: 8px 25px;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid #4e4436;
            font-weight: bold;
        }

        /* cliente grid - sem códigos soltos */
        .cliente-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px 10px;
            background: #e5d8c0;
            border: 2px solid #4a4031;
            padding: 20px 14px;
            border-radius: 24px;
            margin-bottom: 25px;
        }
        .campo {
            display: flex;
            flex-direction: column;
        }
        .campo label {
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #232f38;
            margin-bottom: 2px;
        }
        .campo input {
            background: transparent;
            border: none;
            border-bottom: 2.5px solid #5d503d;
            padding: 6px 2px 4px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            outline: none;
            width: 100%;
        }
        .campo input:focus {
            background: #fff2da;
        }
        .full {
            grid-column: span 2;
        }

        /* tabela com scroll suave */
        .tabela-rolagem {
            overflow-x: auto;
            border: 2px solid #1d1d1d;
            background: #eae2d2;
            border-radius: 16px;
            margin: 20px 0 15px;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 380px;
        }
        th {
            background: #554e3f;
            color: white;
            padding: 10px 3px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        td {
            border: 1px solid #3a3a3a;
            padding: 4px 3px;
            background: #fffcf0;
        }
        td input {
            width: 100%;
            border: 1px solid #9f947f;
            padding: 10px 6px;
            font-size: 0.9rem;
            background: #ffffff;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
        }
        .total-item {
            font-weight: 800;
            text-align: right;
            padding-right: 12px;
            background: #d3c8b0;
            white-space: nowrap;
        }

        /* totais */
        .total-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            color: white;
            padding: 15px 20px;
            border-radius: 60px;
            margin: 20px 0;
        }
        .total-label {
            font-size: 1.3rem;
        }
        .total-valor {
            background: #fad893;
            color: #121212;
            font-size: clamp(1.6rem, 7vw, 2.2rem);
            font-weight: 900;
            padding: 8px 25px;
            border-radius: 60px;
        }

        /* assinatura */
        .assinatura-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-top: 2px dashed #4d4234;
            padding: 20px 0 5px;
            gap: 15px;
        }
        .ass-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            flex-wrap: wrap;
        }
        .linha-assinatura {
            width: 150px;
            border-bottom: 3px solid #1e1e1e;
            height: 18px;
        }
        .ass-right {
            background: #d2c2a6;
            font-size: 1.8rem;
            font-weight: 900;
            padding: 8px 25px;
            border-radius: 60px;
            white-space: nowrap;
        }

        /* mensagem pequena */
        .obs-footer {
            font-size: 0.65rem;
            text-align: right;
            color: #3e3e3e;
            margin-top: 12px;
        }

        /* BOTÕES FIXOS E ACESSÍVEIS */
        .botoes-fixos {
            max-width: 480px;
            width: 100%;
            margin: 5px auto 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding: 8px 0 10px;
            position: sticky;
            bottom: 5px;
            z-index: 20;
            background: transparent;
        }
        .btn {
            flex: 1 1 100px;
            min-width: 100px;
            background: #2c4053;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 800;
            padding: 14px 6px;
            border-radius: 50px;
            box-shadow: 0 5px 0 #1c2a35;
            cursor: pointer;
            border: 1px solid #8fa3bb;
            text-align: center;
            transition: 0.05s linear;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1c2a35;
        }
        .btn-pdf {
            background: #8b5a2e;
            box-shadow: 0 5px 0 #543e24;
        }
        .btn-reset {
            background: #625945;
            box-shadow: 0 5px 0 #3f382b;
        }

        /* garantir que nenhum css vaze */
        .full { grid-column: span 2; } /* redundante mas seguro */
    </style>
</head>
<body>
    <!-- TALÃO DE PEDIDO - ESTRUTURA LIMPA -->
    <div class="talao-card" id="talaoCard">
        <div class="header">
            <h1>DENIS AUTO CENTER</h1>
            <div class="slogan">Suspensão Originais e Preparadas · Limpeza de Injetores · Suspensão · Troca de óleo · Freio · Mecânico em Geral</div>
        </div>

        <!-- Nº e data -->
        <div class="row-num">
            <span class="talao-tit">TALÃO DE PEDIDO</span>
            <span class="num-display" id="numeroTalao">0001</span>
        </div>
        <div class="data-wrapper">
            <span class="data-box" id="dataAtual"></span>
        </div>

        <!-- Cliente: todos os campos vazios -->
        <div class="cliente-grid">
            <div class="campo full"><label>CLIENTE</label> <input type="text" value=""></div>
            <div class="campo full"><label>ENDEREÇO</label> <input type="text" value=""></div>
            <div class="campo"><label>BAIRRO</label> <input type="text" value=""></div>
            <div class="campo"><label>CEP</label> <input type="text" value=""></div>
            <div class="campo"><label>CIDADE</label> <input type="text" value=""></div>
            <div class="campo"><label>FONE</label> <input type="text" value=""></div>
            <div class="campo"><label>FAX</label> <input type="text" value=""></div>
            <div class="campo"><label>CEL</label> <input type="text" value=""></div>
            <div class="campo"><label>CNPJ/CPF</label> <input type="text" value=""></div>
            <div class="campo"><label>INCR./RG</label> <input type="text" value=""></div>
            <div class="campo full"><label>COND. PAGAMENTO</label> <input type="text" value=""></div>
        </div>

        <!-- Tabela de itens (linhas serão inseridas via JS) -->
        <div class="tabela-rolagem">
            <table id="tabelaItens">
                <thead>
                    <tr><th>QUANT</th><th>DESCRIÇÃO</th><th>PREÇO UNIT</th><th>TOTAL</th></tr>
                </thead>
                <tbody id="corpoTabela">
                    <!-- linhas vazias via js -->
                </tbody>
            </table>
        </div>

        <!-- Total geral -->
        <div class="total-container">
            <span class="total-label">TOTAL R$</span>
            <span class="total-valor" id="totalGeral">0.00</span>
        </div>

        <!-- Assinatura -->
        <div class="assinatura-row">
            <div class="ass-left">Assinatura: <span class="linha-assinatura"></span></div>
            <div class="ass-right" id="totalAssinatura">R$ 0.00</div>
        </div>
        <div class="obs-footer">* preencha os campos. Botões abaixo.</div>
    </div>

    <!-- BOTÕES (fora do card) -->
    <div class="botoes-fixos">
        <button class="btn" id="addLinhaBtn">➕ Item</button>
        <button class="btn" id="calcularBtn">🧮 Calcular</button>
        <button class="btn btn-pdf" id="pdfBtn">📄 Gerar PDF</button>
        <button class="btn btn-reset" id="zerarBtn">⚙️ Zerar</button>
    </div>

    <script>
        (function() {
            // -------------------- NUMERAÇÃO --------------------
            let numeroAtual = localStorage.getItem('talaoNumero');
            if (!numeroAtual) numeroAtual = 1;
            else numeroAtual = parseInt(numeroAtual, 10);

            function formatarNum(n) {
                return n.toString().padStart(4, '0');
            }
            document.getElementById('numeroTalao').innerText = formatarNum(numeroAtual);

            function incrementarNumero() {
                numeroAtual++;
                localStorage.setItem('talaoNumero', numeroAtual);
                document.getElementById('numeroTalao').innerText = formatarNum(numeroAtual);
            }

            // Zerar
            document.getElementById('zerarBtn').addEventListener('click', function() {
                numeroAtual = 1;
                localStorage.setItem('talaoNumero', numeroAtual);
                document.getElementById('numeroTalao').innerText = formatarNum(numeroAtual);
            });

            // -------------------- DATA AUTOMÁTICA --------------------
            const dataEl = document.getElementById('dataAtual');
            const hoje = new Date();
            const dia = String(hoje.getDate()).padStart(2, '0');
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const ano = String(hoje.getFullYear()).slice(-2);
            dataEl.innerText = `${dia}, ${mes}, ${ano}`;

            // -------------------- TABELA: 4 LINHAS INICIAIS VAZIAS --------------------
            const corpo = document.getElementById('corpoTabela');
            corpo.innerHTML = ''; // limpa qualquer resíduo

            for (let i = 0; i < 4; i++) {
                const novaLinha = document.createElement('tr');
                novaLinha.innerHTML = `
                    <td><input type="number" class="qtd" step="0.01" min="0" placeholder="0"></td>
                    <td><input type="text" class="desc" placeholder=""></td>
                    <td><input type="number" class="preco" step="0.01" min="0" placeholder="0.00"></td>
                    <td class="total-item">R$ 0.00</td>
                `;
                corpo.appendChild(novaLinha);
            }

            // -------------------- FUNÇÃO CALCULAR --------------------
            function calcularTotais() {
                const linhas = document.querySelectorAll('#corpoTabela tr');
                let totalGeral = 0;
                linhas.forEach(linha => {
                    const qtdInp = linha.querySelector('.qtd');
                    const precoInp = linha.querySelector('.preco');
                    const totalCell = linha.querySelector('.total-item');
                    if (qtdInp && precoInp && totalCell) {
                        let q = parseFloat(qtdInp.value) || 0;
                        let p = parseFloat(precoInp.value) || 0;
                        let sub = q * p;
                        totalCell.innerText = 'R$ ' + sub.toFixed(2);
                        totalGeral += sub;
                    }
                });
                document.getElementById('totalGeral').innerText = totalGeral.toFixed(2);
                document.getElementById('totalAssinatura').innerText = 'R$ ' + totalGeral.toFixed(2);
            }

            // Adicionar linha vazia
            document.getElementById('addLinhaBtn').addEventListener('click', function() {
                const linha = document.createElement('tr');
                linha.innerHTML = `
                    <td><input type="number" class="qtd" step="0.01" min="0" placeholder="0"></td>
                    <td><input type="text" class="desc" placeholder=""></td>
                    <td><input type="number" class="preco" step="0.01" min="0" placeholder="0.00"></td>
                    <td class="total-item">R$ 0.00</td>
                `;
                corpo.appendChild(linha);
                // não recalcula automaticamente (o usuário clica em calcular)
            });

            // Calcular
            document.getElementById('calcularBtn').addEventListener('click', function() {
                calcularTotais();
            });

            // Gerar PDF + incremento
            document.getElementById('pdfBtn').addEventListener('click', function() {
                calcularTotais(); // atualiza antes

                const elemento = document.getElementById('talaoCard');
                const opt = {
                    margin:        [0.4, 0.4, 0.4, 0.4],
                    filename:     `talao_${formatarNum(numeroAtual)}.pdf`,
                    image:        { type: 'jpeg', quality: 0.96 },
                    html2canvas:  { scale: 2, letterRendering: true, useCORS: true },
                    jsPDF:        { unit: 'cm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(elemento).save();

                setTimeout(() => {
                    incrementarNumero();
                }, 250);
            });

            // Cálculo inicial (tudo zero)
            calcularTotais();
        })();
    </script>
</body>
</html>
