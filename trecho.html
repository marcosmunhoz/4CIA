<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Consulta de Rodovias - SP (Completo)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 24px;
        }
        h1 {
            font-size: 28px;
            color: #1a2a3a;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #5a6a7a;
        }
        .search-box {
            display: flex;
            gap: 12px;
            margin: 20px 0 24px;
            flex-wrap: wrap;
        }
        .search-box input {
            flex: 1;
            min-width: 250px;
            padding: 12px 18px;
            border: 2px solid #dce1e8;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.2s;
            outline: none;
        }
        .search-box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
        }
        .search-box .clear-btn {
            padding: 12px 24px;
            background: #eef2f6;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            color: #1a2a3a;
        }
        .search-box .clear-btn:hover {
            background: #dce1e8;
        }
        .stats {
            font-size: 14px;
            color: #4a5a6a;
            margin-bottom: 16px;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: #f1f4f9;
            color: #1a2a3a;
            font-weight: 600;
            padding: 14px 12px;
            text-align: left;
            border-bottom: 2px solid #dce1e8;
            white-space: nowrap;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }
        tr:hover {
            background: #fafcff;
        }
        .municipio {
            font-weight: 500;
            color: #1e3a5f;
        }
        .codigo {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #2563eb;
            white-space: nowrap;
        }
        .btn-mapa {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-mapa:hover {
            background: #1d4ed8;
            transform: scale(1.02);
        }
        .btn-mapa:active {
            transform: scale(0.97);
        }
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #6a7a8a;
            font-size: 16px;
        }
        @media (max-width: 600px) {
            .container { padding: 16px; }
            th, td { padding: 8px 6px; font-size: 12px; }
            .btn-mapa { font-size: 11px; padding: 4px 10px; }
        }
    </style>
</head>

    // ==================== LÓGICA DE FILTRO E RENDER ====================
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const tbody = document.getElementById('tableBody');
    const countSpan = document.getElementById('count');

    function render(filterText = '') {
        const term = filterText.trim().toLowerCase();
        let filtered = dados;
        if (term) {
            filtered = dados.filter(item => {
                const codigoCompleto = (item.codificacao + ' ' + item.codigo).toLowerCase();
                const nomeLower = item.nome.toLowerCase();
                const municipioLower = item.municipio.toLowerCase();
                return codigoCompleto.includes(term) ||
                       nomeLower.includes(term) ||
                       item.codigo.toLowerCase().includes(term) ||
                       municipioLower.includes(term);
            });
        }

        countSpan.textContent = filtered.length;

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="no-results">Nenhuma rodovia encontrada para "<strong>${filterText}</strong>"</td></tr>`;
            return;
        }

        let html = '';
        filtered.forEach((item, index) => {
            const codigoExibicao = item.codificacao + ' ' + item.codigo;
            html += `
                <tr>
                    <td class="codigo">${codigoExibicao}</td>
                    <td>${item.nome}</td>
                    <td>${item.kmInicial}</td>
                    <td>${item.kmFinal}</td>
                    <td>${item.extensao}</td>
                    <td class="municipio">${item.municipio}</td>
                    <td>
                        <button class="btn-mapa" data-index="${index}">🗺️ Ver mapa</button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;

        document.querySelectorAll('.btn-mapa').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const idx = parseInt(this.dataset.index);
                const item = filtered[idx];
                abrirMapa(item);
            });
        });
    }

    function abrirMapa(item) {
        const query = encodeURIComponent(`${item.nome} ${item.municipio} SP`);
        const url = `https://www.google.com/maps/search/?api=1&query=${query}`;
        window.open(url, '_blank');
    }

    searchInput.addEventListener('input', function() {
        render(this.value);
    });

    clearBtn.addEventListener('click', function() {
        searchInput.value = '';
        render('');
        searchInput.focus();
    });

    render('');
</script>
